article: 3
title: 第3条
titleOsaka: ''
originalText:
  - 官武一途庶民に至るまで、各其の志を遂げ、人心をして倦まざらしめんことを要す。
osakaText:
  - お役人さんも武士も一つの道にまとまって、それが庶民にまで及ぶようにし、みんなそれぞれ自分の志を遂げられるようにするんや。せやから、誰の心も腐らせんようにせなあかんねん。
commentary:
  - 五箇条の御誓文は、慶応4年3月14日(1868年4月6日)に明治天皇が天地の神々に誓約する形式で発布され、公卿・諸侯に示された明治新政府の基本方針です。第三条は、そのなかで身分を問わずすべての人が自分の志を遂げられる社会を目指すことを宣言した条文です。
  - 「官武一途」とは、朝廷に仕える公家や文官(官)と、武力を担う武士(武)とが、それぞれ別々の道を歩むのではなく、一つの方針のもとにまとまることを意味します。さらに「庶民に至るまで」という言葉が加えられていることから、対象は支配階級だけにとどまらず、一般の民衆にまで広げられていることが分かります。「各其の志を遂げ」は、身分にかかわらず一人ひとりが自分の目標や希望を実現できるようにすることを意味し、「人心をして倦まざらしめんことを要す」は、人々の心が投げやりになったりやる気を失ったりしないようにすることが重要だと述べています。
  - 例えば、江戸時代の身分制度のもとでは、生まれた家によって就ける職業や果たせる役割があらかじめ決まっており、どれだけ能力や意欲があっても、それを発揮できる場は限られていました。第三条は、そうした固定化された仕組みを改め、官吏であれ武士であれ庶民であれ、それぞれが志を持って努力すれば報われる社会を築こうとする決意を示したものです。この理念は、第二条で示された身分を超えた協力の精神をさらに一歩進め、個人の意欲そのものを国づくりの原動力として位置づけている点に特徴があります。
commentaryOsaka:
  - 自分のやりたいことを、身分に関係なくちゃんと叶えられる世の中ってどんなんやと思う? 第三条はまさにそれを目指した条文やねん。「官武一途庶民に至るまで」やから、お役人さんも、お侍さんも、それから町のおっちゃんおばちゃんまで、みんな同じ土俵に立たなあかん、ていう話やねんで。
  - 江戸時代は生まれた家によって、なれる仕事もできることもだいたい決まってしもてたんや。お百姓の子に生まれたらずっとお百姓、武士の子に生まれたらずっと武士。どれだけ才能があっても、志があっても、それを試す場所すらもらえへんことがぎょうさんあってん。
  - 例えばな、Aさんはめっちゃ算術が得意な農家の子やったとするやろ。ところが江戸時代やったら、その才能を活かして役人になる道なんかまずなかったんや。せやけど第三条の考え方やったら、Aさんも身分に関係なく志を遂げるチャンスをもらえるべきやし、隣のBさんがお侍さんの子でも同じように自分の道を選べなあかん。誰かが「どうせわたしなんか」って心が折れてしもたら意味がないから、「人心をして倦まざらしめんことを要す」いう一文で、みんなのやる気を大事にしよう、ていうところまでちゃんと書いてあるんが、この条文のえらいところやねんで。
