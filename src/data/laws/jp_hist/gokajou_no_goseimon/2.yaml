article: 2
title: 第2条
titleOsaka: ''
originalText:
  - 上下心を一にして、盛んに経綸を行うべし。
osakaText:
  - 身分の上も下も関係なく心を一つにして、国を治めるまつりごとを盛んにやっていかなあかんで。
commentary:
  - 五箇条の御誓文は、慶応4年3月14日(西暦1868年4月6日)、明治天皇が天地の神々に誓約するという形式をとって発布され、公卿や諸侯(大名)に示された明治新政府の基本方針です。第二条はその中で、身分の上下によって分断されていた江戸時代までの社会のあり方を改め、立場の異なる人々が心を一つにして国家運営にあたるべきことを説いています。
  - 「上下心を一にして」とは、公家や武士といった支配階級と庶民との間にあった身分の隔たりを超えて、皆が同じ目的意識を持つことを意味します。「経綸」はもともと絹糸を紡いで織物を仕上げる作業を指す言葉で、そこから転じて国家の制度や政策を整え治めていくことを表す言葉として使われてきました。つまりこの条文は、身分にとらわれず心を一つにして、国づくりという大事業に取り組むべきだと述べているのです。
  - 例えば、江戸時代であれば武士が政治を独占し、庶民が意見を述べる機会はほとんどありませんでした。しかし明治新政府は、そうした旧来のあり方を改め、身分を問わず人々の力を結集して近代国家の建設にあたろうとしたのです。この理念は、第一条で示された「広く会議を興し、万機公論に決すべし」という議会政治の精神とも深く結びついており、御誓文全体を貫く一体感の重要性を裏付けています。
commentaryOsaka:
  - 「経綸」ってゆう字、よう見たら糸へんがついてるやろ。もともとは糸を紡いで機を織るときの言葉やってん。バラバラの糸を一本にまとめて、丈夫な布に仕上げていく作業のことやな。第二条は、その言葉を使こうて「国をまとめるのも、糸を織るのと同じや。みんなの心を一本にまとめな、ええ国にはならへんで」って教えてくれてる条文なんよ。
  - 江戸時代までは、お侍さんとお百姓さんとでは住む世界がまるで違うたし、身分の上下で発言力もぜんぜん違うたんや。せやけどこの条文は「上下心を一にして」、つまり身分の高い低いに関係なく、みんなが同じ方向を向いて力を合わせなあかんて言うてるわけやねん。
  - 例えばな、Aさんが偉いお役人さんで、Bさんが町の職人さんやったとするやろ。それまでやったらAさんの考えだけで物事が決まって、Bさんの意見なんか誰も聞いてくれへんかった。せやけどこの条文の精神に従うんやったら、AさんもBさんも同じ心で新しい国づくりに参加せなあかんいうことになるんや。身分で線引きせんと、みんなの力を合わせて糸を紡ぐみたいに国をまとめていく。それがこの条文の教えやねんで。
