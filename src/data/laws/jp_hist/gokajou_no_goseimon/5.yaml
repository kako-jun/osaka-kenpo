article: 5
title: 第5条
titleOsaka: ''
originalText:
  - 智識を世界に求め、大いに皇基を振起すべし。
osakaText:
  - 知恵や知識は世界中から集めてきて、天皇はんを中心にした国の土台を、うんと盛り立てていかなあかんな。
commentary:
  - 五箇条の御誓文は、慶応4年3月14日(1868年4月6日)に明治天皇が天地の神々に誓約する形式で発布され、公卿・諸侯に示された明治新政府の基本方針です。最後の第五条は、鎖国から開国へと転換した明治新政府が、世界に目を向けて国力を高めていく方針を締めくくりとして示した条文です。
  - 「智識を世界に求め」とは、それまで幕府によって厳しく制限されていた海外との交流を改め、西洋をはじめとする世界各国の学問・技術・制度を積極的に学び取り入れることを意味します。「大いに皇基を振起すべし」の「皇基」は天皇を中心とする国家の基盤を指し、「振起」は奮い立たせる、盛んにするという意味です。つまりこの条文は、世界から得た知識を国内に取り入れることで、天皇を中心とした新しい国家体制の基礎を強固なものにしていこうという決意を表しています。
  - 例えば、明治政府はこの条文の精神に基づき、岩倉使節団を欧米に派遣して政治制度や産業の視察を行ったほか、多くの外国人技術者や学者を「お雇い外国人」として招き、鉄道・郵便・法律・医学などさまざまな分野で近代化を進めました。この条文は、第四条で示された旧来の陋習からの脱却という方針を実行に移すための具体的な指針となるものであり、五箇条の御誓文全体を、開国と近代国家建設への決意で締めくくる条文と位置づけられます。
commentaryOsaka:
  - 「井の中の蛙」ということわざ、知ってるやろ。狭い世界だけで満足してたら、外にどんだけ広い世界があるか気づけへんまま終わってしまうんや。第五条はまさに、そういう「井の中の蛙」から抜け出そういう条文やねんで。
  - 江戸時代の日本は、長いこと鎖国をしとって、外国の学問や技術にほとんど触れんと過ごしてきたんや。せやけど世界にはもっと進んだ知恵がぎょうさんある。第五条は、そのことを素直に認めて、「知識は世界中から集めてこよう、そんでもって天皇はんを中心にした新しい国の土台を、うんと盛り立てていこう」いう決意を示した条文なんよ。
  - 例えばな、Aさんが村いちばんの物知りやったとしても、隣村のBさんの方が新しい農具の使い方に詳しかったら、意地張らんとBさんに教えてもろた方がええやろ。それと同じで、明治政府も「日本の考え方だけが正しい」と意地張るんやのうて、外国の学者さんや技術者さんをようさん招いて、鉄道や医学や法律のことをどんどん教えてもろたんや。自分らのプライドにこだわるより、国全体のためになる道を選んだんや。それがこの条文の教えやねんで。知らんことを素直に「知らん」と認めて教えを請う謙虚さが、結局は国を強うする一番の近道やったんやな。
