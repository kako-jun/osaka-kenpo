article: 1
title: 第1条
originalText:
  - 広く会議を興し、万機公論に決すべし。
osakaText:
  - 広く会議を開いて、すべてのことはみんなで話し合って決めなあかんで。
commentary:
  - 五箇条の御誓文は、慶応4年3月14日(西暦1868年4月6日)に明治天皇が天地の神々に誓約するという形式をとって発布され、公卿や諸侯(大名)に示された明治新政府の基本方針です。全五条のうち最初に置かれた第一条は、これから続く条文全体の理念を先取りして示す、いわば宣言の冒頭にあたる条文です。
  - 「広く会議を興し」とは、公家や大名といった一部の支配階級だけでなく、身分の枠を超えてできるだけ多くの人々が参加する会議を開くことを意味します。「万機公論に決すべし」の「万機」はあらゆる政治上の重要事項を指し、「公論」は広く開かれた場での議論を意味する言葉です。つまりこの条文は、少数の権力者による独断ではなく、多くの人々の声を集めた公の議論によって国の重要な物事を決めていくべきだという方針を示しているのです。
  - 例えば、江戸時代までの政治は、将軍や老中、あるいは各藩の藩主といったごく限られた人々の判断によって動かされており、庶民はもちろん、多くの武士でさえも国政の意思決定に関わる機会はほとんどありませんでした。これに対し明治新政府は、御誓文発布後まもなく公議所や集議院といった合議のための機関を設け、諸藩の代表者らが集まって政策を議論する仕組みづくりを試みています。第一条はこうした変化の出発点となる理念を示した条文だといえます。
  - この理念は、身分の上下を超えた協力を説く第二条や、一人ひとりが志を遂げられる社会を目指す第三条とも深く結びついています。第一条が「広く会議を興し、万機公論に決すべし」という開かれた議論の姿勢を最初に掲げたからこそ、続く条文の理念もその土台の上に成り立っていると考えられます。
commentaryOsaka:
  - 五箇条の御誓文はな、慶応4年3月14日、西暦でいうたら1868年4月6日に、明治天皇さんが天と地の神さまに誓うっちゅう形で発表しはった、明治政府の一番はじめの約束事やねん。全部で五つある条文のうち、この第一条はいちばん最初に置かれとって、これから続く条文全部の土台になる、いわば「はじめの一言」みたいな条文なんよ。
  - 「広く会議を興し」ゆうのは、お公家さんやお殿様みたいな偉い人だけやのうて、身分に関係なくぎょうさんの人が集まって話し合いをしよう、いうことやねん。「万機公論に決すべし」の「万機」は政治の大事なことぜんぶ、「公論」はみんなが開けた場所で意見を出し合うことを指す言葉や。つまり、一部の偉い人がこっそり一人で決めるんやのうて、みんなの声を集めた話し合いで物事を決めていこう、ていう考え方が書いてあるんやで。
  - 例えばな、Cさんが村の顔役で、Dさんがただの農家のおっちゃんやったとするやろ。江戸時代やったら、村の大事なことはCさんみたいな一部の人だけでどんどん決まっていって、Dさんの意見なんか誰も聞いてくれへんかったんや。せやけど第一条の考え方に従うんやったら、CさんもDさんも一緒の場に集まって、みんなで話し合うて決めなあかんいうことになる。実際、明治政府もこの後、公議所やら集議院やらいう話し合いの場をこしらえて、いろんな藩の人らが集まって相談する仕組みを作っていったんやで。
  - この第一条が一番最初に「みんなで話し合おう」いう姿勢を掲げたからこそ、続く第二条の「心を一つにして力を合わせよう」も、第三条の「みんな自分の志を遂げよう」も、その上に積み重なっていけるんやな。御誓文全体の一番はじめに、この開かれた話し合いの精神を置いたところに、この条文の値打ちがあるんよ。
