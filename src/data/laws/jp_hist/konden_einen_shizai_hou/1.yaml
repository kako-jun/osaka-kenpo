article: 1
title: 全文
titleOsaka: 耕した土地はずっとあんたのもんやで
originalText:
  - <ruby>聞<rt>き</rt></ruby>くならく、<ruby>墾田<rt>こんでん</rt></ruby>は<ruby>養老<rt>ようろう</rt></ruby><ruby>七年<rt>しちねん</rt></ruby>の<ruby>格<rt>きゃく</rt></ruby>に<ruby>依<rt>よ</rt></ruby>りて、<ruby>限<rt>かぎ</rt></ruby>り<ruby>満<rt>み</rt></ruby>つるの<ruby>後<rt>のち</rt></ruby>は、<ruby>例<rt>れい</rt></ruby>に<ruby>依<rt>よ</rt></ruby>りて<ruby>収授<rt>しゅうじゅ</rt></ruby>す。<ruby>是<rt>これ</rt></ruby>に<ruby>由<rt>よ</rt></ruby>りて、<ruby>農夫<rt>のうふ</rt></ruby><ruby>怠倦<rt>たいけん</rt></ruby>して、<ruby>開<rt>ひら</rt></ruby>ける<ruby>地<rt>ち</rt></ruby><ruby>復<rt>また</rt></ruby><ruby>荒<rt>あ</rt></ruby>る。
  - <ruby>今<rt>いま</rt></ruby>より<ruby>以後<rt>いご</rt></ruby>、<ruby>任<rt>にん</rt></ruby>に<ruby>私財<rt>しざい</rt></ruby>と<ruby>為<rt>な</rt></ruby>し、<ruby>三世一身<rt>さんぜいっしん</rt></ruby>を<ruby>論<rt>ろん</rt></ruby>ずること<ruby>無<rt>な</rt></ruby>く、<ruby>咸悉<rt>ことごと</rt></ruby>くに<ruby>永年<rt>えいねん</rt></ruby><ruby>取<rt>と</rt></ruby>る<ruby>莫<rt>なか</rt></ruby>れ。
osakaText:
  - 聞くところによるとな、開墾した田んぼは養老七年の決まりに従って、期限が満ちたらいつも通り取り上げて別の人に渡し直すことになっとるんやて。そやから農民さんらは開墾する気力をなくしてしもて、せっかく開いた土地もまた荒れてしもてるんやわ。今からは、思うがままに私有財産として認めるで。三世代までとか一代限りとかいう期限にはこだわらんと、みんな残らず永久に取り上げへんことにするんやで。
commentary:
  - 墾田永年私財法は、743年（天平15年）に聖武天皇の詔として発布された法令です。新たに開墾した田地（墾田）について、期限を設けず永久に個人の私有財産として認めることを定めました。それまでの制度では、開墾した土地であっても一定期間が過ぎれば国に収公され、口分田として他の人に再配分される仕組みになっていましたが、この法律により開墾者とその子孫は、自ら開いた土地を代々にわたって自分のものとして保持できるようになったのです。
  - この法律は、20年前の723年（養老7年）に出された三世一身法の後継にあたります。三世一身法は、新しく灌漑施設を作って開墾した土地は本人から孫までの三世代、既存の施設を利用して開墾した土地は本人一代に限って私有を認めるという内容でしたが、期限が近づくと農民は開墾への意欲を失い、せっかく開いた土地を再び荒れ地に戻してしまうという問題が起きていました。墾田永年私財法は、この期限を撤廃して永年の私有を認めることで、農民の開墾意欲を引き出そうとしたものです。
  - 例えば、ある農民が苦労して山林を切り開き水田を作ったとしても、三世一身法の下では自分の子や孫の代までしか自分の土地として扱われず、いずれ国に取り上げられることが分かっていれば、開墾に力を入れる意味が薄れてしまいます。墾田永年私財法によって永久私有が認められたことで、有力な貴族や大寺院、地方豪族はこぞって大規模な開墾に乗り出すようになりました。もっとも、この法律は同時に身分に応じた開墾面積の上限（親王・一位で500町など）も定めており、無制限な土地集中を防ごうとする意図もうかがえます。
  - しかし実際には、経済力のある貴族や大寺院が上限を超える規模で開墾を進め、私有地を拡大していきました。これにより、律令制の根幹であった公地公民制（土地と人民はすべて国家のものとする原則）は大きく揺らぎ始めます。奈良時代から平安時代にかけて、これらの私有地はやがて荘園と呼ばれる大土地所有制度へと発展し、貴族や寺社の経済的基盤となっていきました。墾田永年私財法は、律令国家が土地公有の原則を自ら崩す転換点となった法令として、日本の土地制度史上きわめて重要な位置を占めています。
commentaryOsaka:
  - なんでせっかく開いた土地が、時間が経つとまた荒れ地に戻ってしまうことがあったか、考えたことあるか？ 土地を耕すんはほんまに骨の折れる仕事やのに、その苦労の結果が自分のもんにならへんかったら、人間そら本気出さんようになるもんやねん。墾田永年私財法いう法律は、まさにこの「やる気の問題」に手ぇつけたものなんやで。
  - 実はこの20年前、養老七年（723年）にも似たような決まり、三世一身法いうのが一回出とってん。せやけどこの決まり、期限の数え方が土地によってバラバラでな、新しく水路まで掘って開いた土地は孫の代まで持っといてええけど、もとからある水路を使うただけの土地やったら自分一代限り、いう細かい線引きやったんや。期限が近づいてくると「どうせ取り上げられるんやったら」ってなって、農民さんらの手が止まってまう。中途半端な期限の設け方が、かえって農民さんの計算高さを引き出してしもたわけやな。そこで743年（天平15年）、聖武天皇の詔として、この面倒な線引きごと全部なくして永久に自分のもんにしてええようにしたんが、この法律なんやわ。
  - 例えばな、いまの貸し農園を思い浮かべてみ。Aさんが1年契約で借りた区画をせっせと石ころ拾うて土ぃ肥やして、やっと野菜がようできる畑に育てたとするやん。せやのに契約更新のたびに「来年はBさんに貸しますね」言われるかもしれん条件やったら、Aさんはどこまで本気で土づくりするやろか。たぶんほどほどにしとくと思うで。墾田永年私財法が変えたんは、まさにこの「どこまで本気出すか」の部分なんや。ずっと自分のもんにしてええでって言われたら、そら本気になって耕すよな。
  - ただな、これで話がめでたしめでたしとちゃうところが、歴史のおもろいとこでな。永久に自分のもんにしてええってなったら、力のある貴族さんや大きなお寺は、それこそ張り切って広大な土地を開いていったんや。国は身分に応じて開ける広さの上限も決めとったんやけど、結局その枠を超えて土地を広げていく人らも出てきて、これが後の荘園いう仕組みにつながっていくことになるんやで。やる気を引き出すためのルールが、思わぬ形で世の中を変えてまう。法律を作るいうんは、そういう先まで見通さなあかん難しい仕事なんやなって、わたしは思うんよ。
