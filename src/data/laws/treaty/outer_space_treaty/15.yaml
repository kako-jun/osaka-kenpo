article: 15
title: 第15条
titleOsaka: ''
originalText:
  - 条約のいずれの当事国も、この条約の改正を提案することができる。改正は、条約の当事国の過半数がこれを受諾した時に、その改正を受諾した条約の当事国について効力を生じ、その後は、条約の他の各当事国については、その国による受諾の日に効力を生ずる。
osakaText:
  - 条約のどの当事国であってもな、この条約の改正を提案することができるんやで。改正は、条約の当事国の過半数がそれを受け入れた時点で、その改正を受け入れた当事国について効力を生じるんや。その後は、条約のほかの当事国についても、それぞれの国が受け入れた日に効力を生じることになるんやで。
commentary:
  - 第15条は、条約の改正手続について定めた条文です。いずれの当事国も条約の改正を提案することができ、その改正案は当事国の過半数が受諾した時点で、受諾した当事国について効力を生じます。その後、まだ受諾していない他の当事国については、それぞれがその改正を受諾した日に効力が生じるという、段階的な発効方式が採用されています。
  - この方式の特徴は、全会一致を必要とせず過半数の受諾で改正の効力が生じる一方で、改正を受諾しない国にまでその改正の効力を一律に及ぼすことはしない点にあります。これにより、時代の変化に応じて条約内容を見直す柔軟性を確保しつつ、各国の主権的な意思決定を尊重するという、多数国間条約に特有のバランスが取られています。第14条が定める署名・批准・加入の手続と並んで、条約が長期にわたって国際社会の規範であり続けるための制度的な基盤となっています。
  - 宇宙条約が交渉された1960年代は、宇宙技術がまだ黎明期にあり、今後どのような技術や活動が登場するか完全には予測できない状況でした。条約起草者たちは、将来の技術発展や国際情勢の変化に応じて条文を見直す必要が生じることを見越し、あらかじめ改正の手続を条約自体に組み込んでおいたと考えられます。もっとも、条約発効から半世紀以上が経過した現在に至るまで、本条に基づく実質的な改正が行われた例はなく、宇宙条約の基本的な枠組みは1967年の発効当初からほぼ維持され続けています。
  - 例えば、将来的に民間企業による月面資源の採掘が本格化し、既存の条文だけでは対応しきれない問題が生じた場合、当事国はこの第15条の手続に従って条約の改正を提案することができます。実際には条約本体の改正よりも、月協定のような別個の関連条約を新たに作る形で対応が図られてきた経緯があり、この点も本条の改正手続が示す柔軟性の一つの表れといえます。
commentaryOsaka:
  - 一度決めたクラスの当番表でも、学期の途中で不都合が出てきたら、話し合って書き直すことがあるやろ。何十年も先まで、最初に決めたルールをそのまま使い続けなあかん、いうのは無理な話や。宇宙条約にも、そういう見直しのための手続きがちゃんと用意されとるんやで。
  - 条約に入っとる国は、誰であってもこの条約の改正を提案することができるんや。その改正案に、条約の当事国の過半数が「それでええで」と受け入れたら、まずその改正を受け入れた国について、改正の効力が生じることになっとる。まだ受け入れてへん残りの国については、それぞれの国が後から受け入れた、その日になって初めて効力が生じる、いう段階的な仕組みになっとるんやで。全員一致を求めるわけやのうて、過半数の受け入れで動き出す一方で、まだ納得してへん国にまで無理やり押しつけることはせえへん。条約の中身を時代に合わせて見直す柔軟さと、それぞれの国の判断を尊重する姿勢とを、両方大事にしようとしとる工夫なんやな。
  - 例えばな、Hさんの国が「増え続ける宇宙ゴミの除去について、当事国に新しい義務を課す条文を追加したい」と、条約の改正を提案したとするやろ。この提案にEさんの国も含めて、条約に入っとる国の過半数が賛成したら、まず賛成した国々について、その新しい改正が効力を持つことになるんや。もしまだ賛成しとらんかった国があったとしたら、その国は自分らが後から「それでええで」と受け入れた、その日になってようやく、新しい義務を負うことになっとるんやで。
  - この仕組みのええところは、全員が同じ日にいっせいに新しいルールへ切り替わるわけやない、いうとこやねん。受け入れた国から順番に効力が生まれていくから、まだ心の準備ができてへん国に、無理やりルールを押しつけることにはならへん。条約を一度きりの約束事やのうて、時代とともに少しずつ育てていく「生きた約束事」にするための、優しい工夫がここに詰まっとるんやで。
