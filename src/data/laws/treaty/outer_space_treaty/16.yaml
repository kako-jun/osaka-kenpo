article: 16
title: 第16条
titleOsaka: ''
originalText:
  - 条約のいずれの当事国も、この条約の効力発生の後1年を経過したときは、寄託国政府にあてた通告書により、条約からの脱退を通告することができる。その脱退は、通告書の受領の日から1年で効力を生ずる。
osakaText:
  - 条約のどの当事国であってもな、この条約が効力を生じてから1年が経過したときは、寄託国政府にあてた通告書によって、条約からの脱退を通告することができるんや。その脱退は、通告書を受け取った日から1年で効力を生じるんやで。
commentary:
  - 第16条は、条約からの脱退手続について定めた条文です。いずれの当事国も、条約の効力発生後1年を経過すれば、寄託国政府にあてた通告書によって条約からの脱退を通告することができ、その脱退は通告書の受領の日から1年で効力を生じます。効力発生直後の脱退を防ぐ1年間の待機期間と、脱退の意思表示から実際の脱退までさらに1年を要するという二重の時間的猶予が設けられている点が特徴です。
  - このような慎重な脱退手続は、条約が定める非専有原則や非軍事化原則といった宇宙の基本秩序が、一国の一時的な政治判断によって軽々しく揺らぐことのないようにするための設計だと考えられます。仮に脱退の効力が即座に生じる仕組みであれば、国際情勢の緊張が高まった際に条約体制からの離脱が連鎖的に起こり、宇宙の平和利用という条約全体の目的が損なわれかねません。1年という猶予期間は、脱退を検討する国と残りの当事国の双方に、事態を再考し外交的な調整を図る時間を与える意味を持っています。
  - 冷戦下という国際情勢の不安定さの中で条約が起草された経緯を踏まえると、こうした脱退規定の慎重さは当然の配慮だったといえます。実際に、宇宙条約は1967年の発効以来、この脱退規定が実際に発動された例がなく、主要な宇宙開発国を含む多数の国が現在まで当事国であり続けていることは、条約が定める枠組みが国際社会において広く受け入れられてきたことを示しています。
  - 例えば、ある当事国が自国の安全保障政策の大幅な転換を理由に条約からの脱退を決断したとしても、脱退の通告から実際に効力が生じるまでには1年の期間が必要であり、その間に他の当事国との外交協議や国際世論の反応を踏まえて再考する余地が残されています。このような時間的な緩衝装置が、宇宙条約の安定性を長年にわたって支えてきたと考えられます。
commentaryOsaka:
  - 第16条はな、条約から抜けたいときの手続きを定めとる条文やねん。一度入った条約でも、未来永劫縛られ続けるわけやのうて、ちゃんと抜け道が用意されとるんやで。
  - 例えばな、あかりさんの国が条約に入って何年か経って、「うちの国はもうこの条約から抜けたい」と考えたとするやろ。ただし、いきなりは抜けられへんのや。まず条約が効力を生じてから1年は待たなあかん。その1年が過ぎたら、寄託国政府にあてて脱退の通告書を送ることができるんやで。ほんで、その通告書が受け取られた日から、さらに1年が経ってはじめて、あかりさんの国の脱退が実際に効力を持つことになっとるんや。
  - この「1年待って、通告してからさらに1年」いう二段構えの仕組みは、条約から急に国が抜けてしまって、宇宙活動のルールが混乱するのを防ぐためのもんやねん。離れる決断をするにも、周りの国が準備する時間が要る。国際社会でのお別れにも、ちゃんと作法があるいうことを教えてくれる条文やな。
