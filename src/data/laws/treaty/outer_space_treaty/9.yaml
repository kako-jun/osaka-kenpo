article: 9
title: 第9条
titleOsaka: ''
originalText:
  - 条約の当事国は、月その他の天体を含む宇宙空間の探査及び利用において、協力及び相互援助の原則に従うものとし、かつ、条約の他のすべての当事国の対応する利益に妥当な考慮を払って、月その他の天体を含む宇宙空間におけるすべての活動を行うものとする。条約の当事国は、月その他の天体を含む宇宙空間の有害な汚染、及び地球外物質の導入から生ずる地球環境の悪化を避けるように月その他の天体を含む宇宙空間の研究及び探査を実施、かつ、必要な場合には、このための適当な措置を執るものとする。条約の当事国は、自国又は自国民によって計画された月その他の天体を含む宇宙空間における活動又は実験が月その他の天体を含む宇宙空間の平和的探査及び利用における他の当事国の活動に潜在的に有害な干渉を及ぼすおそれがあると信ずる理由があるときは、その活動又は実験が行われる前に、適当な国際的協議を行うものとする。条約の当事国は、他の当事国が計画した月その他の天体を含む宇宙空間における活動又は実験が月その他の天体を含む宇宙空間の平和的な探査及び利用における活動に潜在的に有害な干渉を及ぼすおそれがあると信ずる理由があるときは、その活動又は実験に関する協議を要請することができる。
osakaText:
  - 条約に入ってる国はな、月やそのほかの天体を含む宇宙空間を探査したり利用したりするときは、協力と助け合いの原則に従わなあかんのや。ほかのすべての当事国の、対応する利益にもちゃんと目を配って、月やそのほかの天体を含む宇宙空間でのあらゆる活動をせなあかんのやで。
  - 条約に入ってる国はな、月やそのほかの天体を含む宇宙空間を有害に汚さんように、また地球のもんとちゃう物質を持ち込むことで地球の環境が悪くならんように気をつけて、研究や探査をせなあかんのや。必要なときには、そのための適切な対策を取らなあかんのやねん。
  - 条約に入ってる国はな、自分の国や自分の国の国民が計画してる月やそのほかの天体を含む宇宙空間での活動や実験が、ほかの当事国の平和的な探査や利用の活動に、有害な干渉を及ぼすかもしれへんと信じる理由があるときは、その活動や実験をする前に、ふさわしい国際的な協議をせなあかんで。
  - 条約に入ってる国はな、ほかの当事国が計画してる活動や実験が、自分らの平和的な探査や利用の活動に有害な干渉を及ぼすかもしれへんと信じる理由があるときは、その活動や実験について協議するよう要請することができるんやで。
commentary:
  - 第9条は、宇宙空間の探査及び利用における協力の原則と、環境保護、そして活動間の調整について定めた、条約の中でも特に内容が豊富な条文です。まず、当事国は協力及び相互援助の原則に従い、他の当事国の対応する利益に妥当な考慮を払いながら宇宙活動を行わなければならないとされています。これは第1条が定める「全人類の利益のための探査・利用」という理念を、具体的な行動原則として展開したものです。
  - 本条はさらに、宇宙空間の有害な汚染や、地球外物質の導入による地球環境の悪化を避けるよう、研究や探査を実施し必要な措置を執ることを求めています。これは今日でいう「プラネタリー・プロテクション」の考え方の先駆けであり、月や火星の探査を行う際に地球由来の微生物を持ち込まないようにする、あるいは逆に地球外の物質による地球環境への影響を防ぐといった配慮の法的根拠になっています。加えて、自国の活動や実験が他国の活動に有害な干渉を及ぼすおそれがあると信じる理由があるときは事前に国際的協議を行うこと、逆に他国の計画に懸念がある場合には協議を要請できることも定められています。
  - こうした規定の背景には、1960年代当時すでに、大気圏内での核実験による放射性降下物汚染が国際問題化していた経緯があります。宇宙空間においても同様に、一国の活動が他国の活動や地球環境全体に取り返しのつかない影響を及ぼしかねないという認識が、条約起草国の間で共有されていました。国連決議1962号の段階からこの相互配慮の原則が盛り込まれ、1967年発効の本条約に結実しています。
  - 例えば、ある国が火星探査機を送り込む際に、探査機に付着した地球由来の微生物が火星の環境を汚染し、将来の生命探査を妨げる可能性があると考えられる場合、その国は事前に他の当事国と協議を行うことが求められます。また、ある国が大規模な軌道上実験を計画し、それが他国の人工衛星の運用に有害な干渉を及ぼす懸念がある場合には、影響を受ける可能性のある国はその実験について協議を要請する権利を持っています。
commentaryOsaka:
  - 大部屋で共同生活してるとき、自分の趣味に没頭するあまり、部屋を散らかしっぱなしにしてほかの人に迷惑かけたらあかんやろ。宇宙は今、ものすごい数の人工衛星が飛び交う、いわば「大部屋」になりつつあってな、第9条はその部屋のマナーを定めてる条文なんやで。
  - 条約に入ってる国は、協力と助け合いの原則に従って、ほかの当事国の利益にもちゃんと配慮しながら宇宙で活動せなあかん。それだけやのうて、宇宙空間を有害に汚したらあかんし、地球外の物質を持ち込んで地球の環境そのものを悪くしてしまうことも避けなあかん。今の言葉で言うたら、宇宙にゴミを撒き散らさへんことも、この考え方の延長線上にあるんやで。
  - 宇宙にはそもそも、ここは自分の土地やから何をしてもええ、いう場所があらへん。せやからこそ、自分の実験がほかの国の活動の邪魔になるかもしれへんと思うたら、やる前に話し合っておく必要があるんや。あとから「知らんかった」では済まされへんし、被害を受けた側が泣き寝入りせんでええように、条約は「事前協議」を義務としてはっきり書き込んでるんやで。
  - 例えばな、リクさんの国が何千個もの通信衛星を一気に打ち上げる計画を立てたとするやろ。この衛星の群れが夜空を横切ることで、モモさんの国の天文台が星の観測をするたびに、光の筋が写り込んで邪魔になってしまうとしたらどうやろ。モモさんの国は、この干渉を理由に、リクさんの国へ協議を求めることができるんや。宇宙は広いようで、実はみんなが同時に使うてる「共有スペース」なんやいうことを、この条文はちゃんと分かってるんやで。
