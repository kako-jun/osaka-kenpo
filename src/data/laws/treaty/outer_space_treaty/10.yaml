article: 10
title: 第10条
titleOsaka: ''
originalText:
  - 条約の当事国は、月その他の天体を含む宇宙空間の探査及び利用における国際協力をこの条約の目的に従って促進するために、条約の他の当事国が打ち上げる宇宙物体の飛行を観測する機会を与えられることについての当該他の当事国の要請に対し、平等の原則に基づいて考慮を払うものとする。
  - その観測の機会の性質及びその機会が与えられる条件は、関係国間の合意により決定されるものとする。
osakaText:
  - 条約に入ってる国々はな、月やほかの天体も含めた宇宙空間の探査と利用における国際協力を、この条約の目的に沿うて進めていくために、ほかの条約加盟国が打ち上げた宇宙物体の飛行を観測する機会をもらえるようにという、その国からの要請に対して、平等の原則に基づいてちゃんと考慮せなあかんのや。その観測の機会がどんな性質のものか、どういう条件で与えられるかについては、関係する国同士の合意で決めるもんやで。
commentary:
  - 第10条は、当事国が他の当事国から要請を受けた場合に、自国が打ち上げる宇宙物体の飛行を観測する機会を提供することについて、平等の原則に基づいて考慮を払うべきことを定めた条文です。観測の機会の具体的な性質や条件は、関係国間の合意によって個別に決定されるものとされており、本条自体は一律の権利を保障するものではなく、国際協力を促進するための努力義務的な枠組みとして位置づけられています。
  - この規定は、第1条や第9条が定める国際協力の理念を、打上げ観測という具体的な活動の場面に適用したものです。宇宙開発の技術力に差がある国々の間で、技術力の劣る国が全く蚊帳の外に置かれることのないよう、観測参加という形で協力の窓口を開いておく意義があります。もっとも、義務ではなく「考慮を払う」という表現にとどまっている点からも分かるように、軍事的に機密性の高い打上げまで無条件に公開を強制するものではありません。
  - 背景には、1957年のスプートニク打上げ以降、宇宙開発が米ソという二大国に事実上独占される状況が生まれ、それ以外の国々からは自国の技術力向上や科学的知見の獲得のために、打上げ活動への何らかの関与を求める声が上がっていたことがあります。国連の場での条約交渉においても、宇宙開発途上国への配慮として、こうした観測機会の提供に関する規定が盛り込まれる必要があるとの議論がありました。
  - 例えば、自国では衛星打上げ能力を持たない国が、他国の打上げ施設付近やその軌道投入の様子を観測することを希望する場合、要請を受けた国は平等の原則に基づいてその可能性を検討することになります。実際にどのような設備の見学が可能か、どの範囲まで立ち会えるかといった具体的な条件は、両国間の個別の合意によって取り決められる仕組みになっています。
commentaryOsaka:
  - 第10条はな、宇宙に物を打ち上げる国と、それを見学したい国との関係を決めた条文やねん。宇宙開発いうたら莫大な技術と労力がかかることやから、他の国の打ち上げをこっそり見るなんてできへんし、勝手に見せろとも言えへん。せやからこの条文は「見せてほしい」いう頼みがあったときの心構えを定めとるんや。
  - 例えばな、ちなつさんの国が新しい観測衛星を打ち上げる計画を立てたとするやろ。それを知ったたけしさんの国が「たけしさんの国の技術者にも打ち上げの様子を見せてもらえへんか」と頼んできたとするな。このときちなつさんの国は、たけしさんの国が条約に入っとる国である限り、その頼みを無視したり、特定の国だけひいきしたりせんと、平等の原則に基づいてちゃんと検討せなあかんのや。ただし「絶対に見せなあかん」わけやのうて、見せる範囲や条件は、両方の国が話し合って決めていくもんやで。
  - この条文の面白いところはな、「義務」やのうて「考慮」を求めとるところやねん。宇宙開発の情報は軍事にも絡む微妙な部分もあるから、無条件の公開までは求めてへん。でも「平等に検討する」いう姿勢を義務づけることで、宇宙が一部の国だけの秘密の遊び場にならんようにしとるんやな。国同士の信頼関係を、少しずつ積み上げていくための知恵がここに詰まっとるんやで。
