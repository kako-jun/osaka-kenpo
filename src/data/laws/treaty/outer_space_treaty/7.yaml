article: 7
title: 第7条
titleOsaka: ''
originalText:
  - 条約の当事国は、月その他の天体を含む宇宙空間に物体を発射し若しくは発射させる場合又は自国の領域若しくは施設から物体が発射される場合には、その物体又はその構成部分が地球上、大気空間又は月その他の天体を含む宇宙空間において条約の他の当事国又はその自然人若しくは法人に与える損害について国際責任を有する。
osakaText:
  - 条約に入ってる国はな、月やそのほかの天体を含む宇宙空間に物体を打ち上げたり、打ち上げさせたりする場合、または自分の国の領域や施設から物体が打ち上げられる場合には、責任を持たなあかんのや。
  - その物体や、その一部の部品が、地球の上でも、大気の中でも、月やそのほかの天体を含む宇宙空間でも、ほかの当事国やその国の人・会社に与えた損害について、国際的な責任を負うんやで。
commentary:
  - 第7条は、宇宙空間に物体を発射した当事国が、その物体によって生じた損害について国際的な賠償責任を負うことを定めた条文です。対象となるのは、物体を発射した国、発射させた国、自国の領域や施設から物体が発射された国であり、これらの国は、物体やその構成部分が地球上、大気空間、あるいは宇宙空間や天体上で他の当事国やその国民に損害を与えた場合に責任を負います。
  - この条文は、第6条が定める国家の国際責任の原則を、損害賠償という具体的な場面に適用したものです。宇宙活動には本質的にロケットの打上げ失敗や人工衛星の落下といったリスクが伴いますが、こうした事故が起きた際に被害国が泣き寝入りすることのないよう、責任の所在をあらかじめ明確にしておく必要がありました。本条の考え方は、後に1972年に発効する宇宙損害責任条約においてさらに詳細な賠償手続として発展することになります。
  - 1957年のスプートニク打上げ以降、ロケット技術は急速に発達しましたが、打上げ失敗や軌道からの落下によって物体が地上に落下する危険性も現実のものでした。冷戦下で米ソ両国が競うように打上げ実験を繰り返す中、こうした活動に伴う損害を誰がどのように賠償するのかというルールを国際的に整備する必要性が高まっていたことが、本条制定の背景にあります。
  - 例えば、ある国が打ち上げたロケットの残骸が制御不能になり、他国の領土に落下して建物や農地に被害を与えた場合、打上げを行った国はその損害について国際的な賠償責任を負うことになります。実際に1978年には旧ソ連の原子力衛星コスモス954号がカナダ領内に落下する事故が起き、この条約の原則に基づいて賠償交渉が行われた実例もあり、第7条が抽象的な理念にとどまらず現実の国際紛争解決の基礎となってきたことがわかります。
commentaryOsaka:
  - 自分が飛ばした紙飛行機が、たまたまお隣さんの窓ガラスを割ってしもたら、ふつうは弁償するもんやろ。第7条が定めてるんは、それの宇宙スケール版や。ロケットや人工衛星を打ち上げた国は、それが原因で誰かに損害を与えたら、その責任を負わなあかんいう決まりなんやで。
  - 対象になるのは、物体を打ち上げた国、打ち上げさせた国、自分の領域や施設から物体を打ち上げさせた国や。地球の上であっても、大気の中であっても、宇宙空間や天体の上であっても、ほかの当事国やその国の人・会社に損害を与えたら、国際的な賠償責任がついてまわるんや。
  - 例えばな、ユウタさんの国が打ち上げたロケットが制御不能になって、にいなさんの国の領土に落ちて、農地に被害を出してしもたとするやろ。この場合、打ち上げたユウタさんの国が、その損害について国際的な賠償責任を負うことになるんやで。宇宙は誰の土地でもないからいうて、落としっぱなしにしてええわけとちゃうんや。
  - 宇宙開発にはロケットの打上げ失敗や衛星の落下いうリスクがどうしてもついてまわるから、被害を受けた国が泣き寝入りせんように、あらかじめ責任の所在をはっきりさせておく必要があったんやな。この第7条の考え方は、のちに詳しい賠償手続を定めた宇宙損害責任条約へと発展していくことになるんやで。
