article: 11
title: 第11条
titleOsaka: ''
originalText:
  - 月その他の天体を含む宇宙空間における活動を行う条約の当事国は、宇宙空間の平和的な探査及び利用における国際協力を促進するために、その活動の性質、実施状況、場所及び結果について、国際連合事務総長並びに公衆及び国際科学界に対し、実行可能な最大限度まで情報を提供することに合意する。
  - 国際連合事務総長は、この情報を受けたときは、それが迅速かつ効果的に公表されるようにするものとする。
osakaText:
  - 月やほかの天体を含む宇宙空間で活動をしとる条約の当事国はな、宇宙空間の平和的な探査と利用における国際協力を進めるために、その活動の性質・実施状況・場所・結果について、国際連合事務総長はもちろん、一般の人々や国際的な科学の世界に対しても、できる限り最大限に情報を提供するっちゅうことに合意しとるんや。国際連合事務総長はこの情報を受け取ったら、それがすみやかに、しかも効果的に公表されるようにせなあかんのやで。
commentary:
  - 第11条は、宇宙活動を行う当事国が、その活動の性質・実施状況・場所・結果について、実行可能な最大限度まで国連事務総長や公衆、国際科学界に情報提供することに合意した条文です。国連事務総長がこの情報を受けたときは、迅速かつ効果的に公表されるようにすることも定められており、単に国家間で情報をやり取りするだけでなく、広く世界に向けて公開されることを想定した仕組みになっています。
  - この透明性の確保は、宇宙活動が閉ざされた軍事機密の領域にとどまらず、人類共通の科学的知見として蓄積されるべきだという第1条の理念を制度的に支える役割を果たしています。また、他国の活動への懸念に基づく協議を定める第9条とも関連しており、各国の活動状況が事前に把握できることで、無用な誤解や不信感による国際的緊張の発生を防ぐ効果も期待されています。
  - もっとも本条は「実行可能な最大限度まで」という留保付きの表現になっており、軍事的に機微な情報まで無制限に公開することを義務づけるものではありません。この曖昧さは、冷戦下で軍事技術と宇宙技術が密接に結びついていた当時の国際政治の現実を反映したものであり、完全な情報公開を求める理想と、各国の安全保障上の懸念との間で折り合いをつけた結果だといえます。
  - 例えば、ある国が新型のロケットで人工衛星を打ち上げた場合、その打上げの目的や軌道、成果についての情報を国連事務総長に提供すれば、事務総長はこれを取りまとめて国際的に公表します。実際に国連は宇宙物体登録簿を管理しており、各国から寄せられる打上げ情報を集約して公開することで、世界中の研究者や一般市民が宇宙活動の全体像を把握できる仕組みが機能しています。
commentaryOsaka:
  - 第11条はな、宇宙で活動しとる国に「その活動について、できる限り情報を公開しなさい」と求めとる条文やねん。閉ざされた情報のままやと、国際協力どころか疑心暗鬼を生んでしまうからな。
  - 例えばな、しずかさんの国が月の探査機を飛ばしたとするやろ。この条文があるおかげで、しずかさんの国はその探査機がどんな目的で、どこを飛んで、どんな結果を残したんかを、国際連合の事務総長や、世界中の研究者、それに一般の人々にまで、できる限り知らせなあかんことになっとるんや。それを受け取った事務総長も、情報を抱え込まんと、すみやかにみんなに公表するよう努めなあかんのやで。
  - この仕組みのすごいところは、宇宙活動を「一部の専門家だけのもの」にせんと、公衆にまで開いとるところやねん。さゆりさんみたいに宇宙に興味のある一般の人でも、この条文のおかげで最新の探査結果を知ることができるんや。情報公開いうんは、単なる親切やのうて、宇宙を平和に使うための土台やっちゅうことを教えてくれる条文やな。
