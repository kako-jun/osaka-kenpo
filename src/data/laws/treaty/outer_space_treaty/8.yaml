article: 8
title: 第8条
titleOsaka: ''
originalText:
  - 宇宙空間に発射された物体が登録されている条約の当事国は、その物体及びその乗員に対し、それらが宇宙空間又は天体上にある間、管轄権及び管理権を保持する。宇宙空間に発射された物体（天体上に着陸させられ又は建造された物体を含む。）及びその構成部分の所有権は、それらが宇宙空間若しくは天体上にあること又は地球に帰還することによって影響を受けない。これらの物体又は構成部分は、物体が登録されている条約の当事国の領域外で発見されたときは、その当事国に、返還されるものとする。その当事国は、要請されたときは、それらの物体又は構成部分の返還に先立ち、識別のための資料を提供するものとする。
osakaText:
  - 宇宙空間に打ち上げられた物体が登録されてる条約当事国はな、その物体と、乗ってる人らに対して、それらが宇宙空間や天体の上にある間は、管轄権と管理権をずっと持ち続けるんやで。
  - 宇宙空間に打ち上げられた物体（天体の上に着陸させられたり、天体の上で作られたりした物体も含むで。）や、その部品の所有権は、それが宇宙空間や天体の上にあることや、地球に帰ってきたことでは、なんも影響を受けへんのや。
  - これらの物体や部品は、物体が登録されてる条約当事国の領域の外で見つかったときは、その当事国に返さなあかんのやねん。
  - その当事国は、頼まれたときには、物体や部品を返してもらう前に、それが自分のもんやて分かる資料を提供せなあかんで。
commentary:
  - 第8条は、宇宙空間に発射された物体とその乗員に対する管轄権・管理権、及び所有権の帰属について定めた条文です。まず、物体が登録されている当事国は、その物体と乗員が宇宙空間や天体上にある間、管轄権と管理権を保持し続けます。これは、宇宙空間という特定の国家主権が及ばない領域であっても、物体そのものについては登録国の法秩序が及ぶことを意味しており、宇宙活動の法的な秩序を保つ上で不可欠な仕組みです。
  - 次に本条は、宇宙に発射された物体やその構成部分の所有権が、それらが宇宙空間や天体上にあることや地球に帰還することによって影響を受けないと定めています。さらに、これらの物体が登録国の領域外で発見された場合には、登録国に返還されるものとし、返還に先立って登録国が要請されれば識別資料を提供することも定められています。これは第2条が定める宇宙空間そのものの非専有原則とは区別されるべき規定で、天体や宇宙空間自体は国家取得の対象にならない一方、そこに人為的に持ち込まれた物体の所有権は通常どおり保護されるという整理になっています。
  - このような登録制度の考え方は、1957年のスプートニク打上げ以降、宇宙空間に投入される人工物が急増する中で、誰がどの物体に責任を持ち、誰がその所有者であるかを明確にする必要性から生まれました。本条の原則は、後に1975年に署名のため開放された宇宙物体登録条約によって、登録簿の作成や国連事務総長への通報義務としてさらに制度化されていきます。
  - 例えば、ある国の人工衛星の部品が制御不能になって落下し、別の国の領域内で発見された場合、その部品は発見された国のものになるわけではなく、登録国からの返還要請があれば返還されなければなりません。実際に月面に着陸させた探査機や、地球に帰還したカプセルについても、それを所有する国や企業の権利は宇宙空間を経由したことによって失われることはなく、この規定が宇宙活動における財産権の安定性を支えています。
commentaryOsaka:
  - 財布を落として、それを誰かが拾うたとするやろ。誰が持ち主か分かる資料さえあれば、ふつうは持ち主に返してもらえるよな。第8条が定めてるのは、宇宙版の「落とし物は持ち主に返す」ルールなんや。ただし宇宙の場合、持ち主は国そのものになるんやで。
  - 宇宙空間に物体を打ち上げた国は、その物体と乗員に対して、宇宙にある間ずっと管轄権と管理権を持ち続ける。物体の所有権は、それが宇宙にあることでも、地球に帰ってきたことでも影響を受けへんし、もし登録国の領域の外で見つかったら、登録国に返してもらえるし、返還の前には身元が分かる資料を提供してもらえる決まりになってんねん。
  - 例えばな、なおみさんの国の人工衛星の部品が制御を失って落下して、エリさんの国の領土内で見つかったとするやろ。エリさんの国は、それを拾ったからいうて自分のもんにできるわけやのうて、なおみさんの国から返還の求めがあれば返さなあかんのや。逆になおみさんの国は、それが確かに自分の国の物やて示す資料を、求められたら渡す必要があるんやで。
  - この考え方は、1957年のスプートニク打上げ以降、宇宙空間に人工物がどんどん増えていく中で、誰がどの物体に責任を持つのかをはっきりさせる必要から生まれたもんや。第2条が「天体そのものは誰のもんにもならへん」て定めてる一方で、そこに人が持ち込んだ物体の所有権はちゃんと守られるいう整理になってるとこが、この第8条のおもしろいとこやねんな。
