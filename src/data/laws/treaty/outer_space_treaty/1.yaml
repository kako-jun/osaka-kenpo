article: 1
title: 第1条
titleOsaka: ''
originalText:
  - 月その他の天体を含む宇宙空間の探査及び利用は、すべての国の利益のために、その経済的又は科学的発展の程度にかかわりなく行われるものであり、全人類に認められる活動分野である。
  - 月その他の天体を含む宇宙空間は、すべての国がいかなる種類の差別もなく、平等の基礎に立ち、かつ、国際法に従って、自由に探査し及び利用できるものとし、また天体のすべての地域への立入は、自由である。
  - 月その他の天体を含む宇宙空間における科学的調査は、自由であり、また、諸国はこの調査における国際協力を容易にし、かつ、奨励するものとする。
osakaText:
  - 月やそのほかの天体を含めた宇宙空間を探査したり利用したりするんは、どこの国にとっても意味のあることであって、その国が経済的にも科学的にもどんだけ発展してるかは関係あらへんのや。全人類に開かれた活動の分野やねん。
  - 月やそのほかの天体を含む宇宙空間は、どこの国もどんな差別も受けんと、平等な立場で、国際法に従うっちゅう条件のもとで、自由に探査したり利用したりできるんやで。天体のどの場所にでも立ち入るんは自由や。
  - 月やそのほかの天体を含む宇宙空間での科学的な調査も自由やし、各国はこの調査でみんなが協力しやすいように取り計ろうて、しっかり後押ししていかなあかんのやで。
commentary:
  - 第1条は、宇宙条約の根幹をなす基本原則を定めた条文です。月その他の天体を含む宇宙空間の探査及び利用は、先進国であるか発展途上国であるかを問わず、すべての国の利益のために行われるべきものであり、特定の国家や勢力が独占してよい活動ではないことを明確にしています。「全人類に認められる活動分野」という表現は、宇宙が人類共通の財産であるという理念を象徴しており、後の月協定などにも受け継がれる「人類の共同財産」概念の出発点となりました。
  - さらに本条は、いかなる種類の差別もなく平等の基礎に立って宇宙を自由に探査・利用できること、天体のすべての地域への立入りが自由であること、そして科学的調査の自由と国際協力の奨励を定めています。これは、宇宙開発が一部の技術大国だけの特権とならないようにするための歯止めであり、第9条が定める国際協力の原則や第11条が定める情報公開の義務とも密接に結びついています。
  - この条文の背景には、1950年代から60年代にかけての米ソ冷戦下の激しい宇宙開発競争があります。1957年10月4日にソ連が世界初の人工衛星スプートニク1号の打上げに成功し、1961年4月12日には同じくソ連のガガーリンが人類初の有人宇宙飛行を成し遂げました。こうした軍事的緊張をはらんだ競争が無秩序に拡大することへの懸念から、国際連合は1963年12月13日に決議1962号「宇宙空間の探査及び利用における国家活動を律する法原則の宣言」を採択し、これが1967年に発効した本条約の直接の下敷きとなりました。
  - 例えば、自前の人工衛星を打ち上げる技術を持たない国であっても、他国が運用する気象衛星の観測データや通信衛星のサービスを利用することができるのは、この第1条が定める「すべての国の利益のための探査・利用」という理念があるからです。宇宙開発途上国が国際宇宙ステーション計画などの共同プロジェクトに参加できる法的な土台も、この条文の精神に由来しています。
commentaryOsaka:
  - 夜空を見上げてみてな。お月さんを眺めるだけやったら、貧しい国の人でも豊かな国の人でも、見え方はおんなじやろ。せやのに「そこへ行って調べる」いう話になったとたん、力のある国だけの特権になってしもたら、なんや寂しい話やと思わへん? 第1条は、そうならんように「宇宙は全人類みんなのもんや」て、法律の言葉ではっきり宣言してる条文なんやで。
  - この条文が大事にしてるんは、経済的にも科学的にもまだこれからの国にも、ちゃんと利益が行き渡るように書かれてるとこや。差別せんと、平等な立場で、国際法さえ守っとれば、どの国も自由に宇宙を探査・利用できるし、天体のどの場所に足を踏み入れてもかまへん。おまけに科学的な調べもんそのものが自由やっちゅうことと、国同士が力を合わせやすいように、みんなで後押ししていかなあかんいうことまで、ここに書き込まれてるんやで。
  - 例えばな、マキさんの国には自前の探査機を飛ばすほどの予算があらへんかったとするやろ。せやけど、ソウタさんの国が公開してる小惑星の観測データを自由に使うて、マキさんの国の理科部の生徒らが新しい鉱物の分布図を作って、国際的な発表会でお披露目することができるんや。ロケットを持ってる国だけが宇宙を語れるわけやのうて、データさえあれば誰でも宇宙の謎解きに参加できる、そんな仕組みを支えてるのがこの第1条やねんな。
  - ちなみにこの「みんなのもの」いう発想、実は宇宙が最初やのうて、地球の上に先輩がおるんやで。1959年に結ばれた南極条約は、南極大陸をどこの国のものでもない、平和利用と学術調査のための場所やて定めたんや。宇宙条約は、この南極での知恵をそのまま天まで持ち上げたようなもんやと思うたら、ちょっと親しみがわいてこおへんか。
