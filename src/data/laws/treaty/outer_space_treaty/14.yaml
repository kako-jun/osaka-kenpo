article: 14
title: 第14条
titleOsaka: ''
originalText:
  - この条約は、署名のためすべての国に開放される。この条約が3の規定に従って効力を生ずる前にこの条約に署名しない国は、いつでもこの条約に加入することができる。
  - この条約は、署名国により批准されなければならない。批准書及び加入書は、寄託国政府として指定されたアメリカ合衆国、グレートブリテン及び北アイルランド連合王国並びにソヴィエト社会主義共和国連邦の政府に寄託するものとする。
  - この条約は、この条約により寄託国政府として指定された政府を含む5の政府が批准書を寄託したときに効力を生ずる。
  - この条約の効力発生後に批准書又は加入書を寄託する国については、この条約はその批准書又は加入書の寄託の日に効力を生じる。
  - 寄託国政府は、すべての署名国及び加入国に対し、署名の日、この条約の批准書及び加入書の寄託の日、この条約の効力発生の日その他についてすみやかに通報するものとする。
  - この条約は、寄託国政府が国際連合憲章第102条の規定に従って登録するものとする。
osakaText:
  - この条約はな、署名のためにすべての国に開放されとるんや。この条約が3の規定に従って効力を生ずる前にこの条約に署名せえへんかった国も、いつでも加入することができるんやで。この条約は署名した国によって批准されなあかん。批准書と加入書は、寄託国政府として指定されたアメリカ合衆国、グレートブリテン及び北アイルランド連合王国、それにソヴィエト社会主義共和国連邦の政府に寄託するもんや。この条約は、寄託国政府として指定された政府を含む5つの政府が批准書を寄託した時に効力を生じるんやで。この条約が効力を生じた後に批准書か加入書を寄託する国については、その批准書か加入書を寄託した日に、この条約が効力を生じるんや。寄託国政府は、すべての署名国と加入国に対して、署名した日、この条約の批准書と加入書を寄託した日、この条約が効力を生じた日、そのほかについてもすみやかに通報せなあかんのや。この条約は、寄託国政府が国際連合憲章第102条の規定に従って登録するもんやで。
commentary:
  - 第14条は、条約の署名・批准・加入の手続、及び効力発生の条件について定めた、条約の実務的な運用を支える条文です。この条約はすべての国に署名のために開放されており、条約の効力発生前に署名しなかった国であっても、いつでも加入することができます。署名した国はその後批准を行う必要があり、批准書及び加入書は、寄託国政府として指定されたアメリカ合衆国、イギリス、ソヴィエト社会主義共和国連邦の政府に寄託されることになっています。
  - 条約は、寄託国政府を含む5か国の政府が批准書を寄託した時点で効力を生じるとされ、それ以降に批准書や加入書を寄託する国については、その寄託の日に効力が生じます。寄託国政府は、すべての署名国・加入国に対して署名の日や批准書・加入書の寄託の日、効力発生の日などを速やかに通報する義務を負い、さらに条約は国際連合憲章第102条の規定に従って登録されることとされています。これは、国家間の秘密協定の乱立を防ぎ、国際社会全体の透明性を確保するための国連憲章上の一般原則を、本条約についても適用したものです。
  - 寄託国が米・英・ソの3か国に指定されている点は、当時の国際政治力学を色濃く反映しています。1967年1月27日、この条約はワシントン、ロンドン、モスクワの3都市で同時に署名式が行われ、米ソという当時の二大宇宙開発国とその同盟国であるイギリスが手続の要となる寄託国を担うという形が取られました。日本もこの条約に1967年に署名し、批准しています。
  - 例えば、ある国が条約の交渉段階には参加していなくても、後になって宇宙開発に本格的に乗り出す際には、いつでもこの条約に加入することができます。実際に条約発効から半世紀以上が経過した現在まで、多くの新興宇宙開発国がこの手続を通じて条約体制に加わっており、批准国が100か国を超える普遍的な国際規範として機能する土台を、この第14条の柔軟な手続規定が支えています。
commentaryOsaka:
  - 第14条はな、条約がどうやって効力を持つようになるんか、その手続きを定めた条文やねん。宇宙条約は実際に1967年1月27日、ワシントン、ロンドン、モスクワの3つの都市で同時に署名されたんやで。
  - 例えばな、かなさんの国が条約に署名して、その後にちゃんと批准書を出したとするやろ。この条約は、寄託国政府に指定されたアメリカ合衆国、グレートブリテン及び北アイルランド連合王国、それにソヴィエト社会主義共和国連邦のどこかに批准書を届けなあかんのや。この3か国を含む5つの政府が批准書を寄託した時点で、条約はようやく効力を持つんやで。実際には1967年10月10日に発効しとるんや。えみさんの国みたいに、条約が発効した後から加入する国もあって、その場合はその国が批准書か加入書を寄託した日から、その国について条約が効力を生じることになっとるんや。
  - この条文のポイントは、寄託国政府がすべての署名国・加入国に対して、署名の日や発効の日をちゃんと知らせる義務を負っとるところやねん。誰がいつ仲間になったんか、みんなが分かるようにしとかんと、国際社会の中で条約がふわふわしたもんになってしまうからな。しかも条約は国際連合憲章第102条に従って登録されるから、後から「そんな条約知らん」とは言えへん、公式な記録として残るんやで。
