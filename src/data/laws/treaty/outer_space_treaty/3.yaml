article: 3
title: 第3条
titleOsaka: ''
originalText:
  - 条約の当事国は、国際連合憲章を含む国際法に従って、国際の平和及び安全の維持並びに国際間の協力及び理解の促進のために、月その他の天体を含む宇宙空間の探査及び利用における活動を行わなければならない。
osakaText:
  - 条約に入ってる国はな、国際連合憲章も含めた国際法にちゃんと従わなあかんのや。
  - そのうえで、国際的な平和と安全を守って、国と国との協力や理解を深めるために、月やそのほかの天体を含む宇宙空間を探査したり利用したりする活動をしていかなあかんのやで。
commentary:
  - 第3条は、条約の当事国が国際連合憲章を含む国際法に従って宇宙活動を行わなければならないことを定めた条文です。宇宙空間だからといって既存の国際法秩序の外に置かれるわけではなく、地球上の国家関係を律する国際法の原則が宇宙という新しい活動領域にもそのまま及ぶことを明確にしています。
  - 本条が特に国際連合憲章への言及を含んでいる点は重要です。憲章は武力による威嚇又は武力の行使を禁止し、国際紛争の平和的解決を求めていますが、これらの原則が宇宙活動にも適用されることで、宇宙が新たな軍拡や紛争の舞台となることを防ぐ枠組みが作られています。この考え方は、天体の非軍事化を定める第4条や、宇宙飛行士の相互救助を定める第5条など、条約全体を貫く平和利用の理念の基礎となっています。
  - 背景には、1950年代後半からの米ソ宇宙開発競争があります。1957年のスプートニク1号打上げは軍事技術としての大陸間弾道ミサイル開発と表裏一体であり、宇宙が新たな軍事的優位性の争奪の場になるという懸念が国際社会に広がりました。こうした懸念を受けて、1963年の国連決議1962号の段階から、宇宙活動は国際法とりわけ国連憲章の目的に沿って行われるべきだという原則が確認され、1967年発効の本条約に引き継がれました。
  - 例えば、ある国が軍事的な威嚇を目的として宇宙空間で挑発的な行動を取った場合、それは単に宇宙条約違反であるだけでなく、国連憲章が禁じる武力による威嚇にも該当しうることになります。このように第3条は、宇宙活動を国際法という大きな枠組みの中に位置づけることで、宇宙が「法の空白地帯」にならないようにする役割を果たしています。
commentaryOsaka:
  - 「宇宙にまで行ったら、もう地球のルールなんか関係あらへんのとちゃう？」て思う子もおるかもしれへんけど、それは大きな勘違いやで。第3条は、国際連合憲章を含む国際法が宇宙空間にもそのまま及ぶんやいうことを、はっきり宣言してるんや。
  - 国連憲章いうんは、武力で脅すことや武力を使うことを禁止して、争いごとは話し合いで解決しなさいて定めてる決まりや。この考え方が宇宙にもそのまま適用されるいうことは、宇宙が新しい軍拡競争や争いの舞台にならんようにする防波堤になってるいうことなんやな。
  - 例えばな、Vさんの国とUさんの国が地球上で仲が悪かったとして、Vさんの国が宇宙空間でUさんの国を脅すような行動を取ったとするやろ。それは宇宙条約違反であるだけやのうて、国連憲章が禁じてる武力による威嚇にも当てはまってまうんや。宇宙やからいうて、何をしても許されるわけとちゃうんやで。
  - この考え方は、1957年のスプートニク打上げが弾道ミサイル技術と表裏一体やったことへの警戒感から生まれたもんで、1963年の国連決議1962号の段階からずっと引き継がれて、1967年に効力を持ったこの条約に結実してるんや。宇宙が「法の効かへん無法地帯」にならんようにする、大事な土台やと覚えといてな。
