article: 13
title: 第13条
titleOsaka: ''
originalText:
  - この条約の規定は、月その他の天体を含む宇宙空間の探査及び利用における条約の当事国の活動に適用するものとし、それらの活動が条約の一の当事国により行われる場合であるか他の国家と共同で行われる場合（政府間国際機関の枠内で行われる場合を含む。）であるかを問わない。
  - 月その他の天体を含む宇宙空間の探査及び利用における政府間国際機関が行う活動に関連して生ずる実際的問題は、条約の当事国が、当該国際機関又はその加盟国でこの条約の当事国である一若しくは二以上の国と共同して解決するものとする。
osakaText:
  - この条約の決まりはな、月やほかの天体を含む宇宙空間の探査と利用における条約の当事国の活動に適用されるんやで。それが条約の一つの当事国だけでやる活動でも、ほかの国と共同でやる活動でも――政府間の国際機関の枠組みの中でやる場合も含めてな――どっちでも変わらへんのや。月やほかの天体を含む宇宙空間の探査と利用において政府間国際機関が行う活動に関連して生じる実際の問題については、条約の当事国が、その国際機関、またはその機関に加盟しとる国のうち条約の当事国である一国か二国以上の国と、共同で解決するもんやで。
commentary:
  - 第13条は、条約の適用範囲を明確にする条文です。この条約の規定は、当事国が単独で宇宙活動を行う場合だけでなく、他国と共同で行う場合や、政府間国際機関の枠内で活動が行われる場合にも適用されることを明記しています。宇宙開発は一国だけで完結する事業ではなく、複数国の共同プロジェクトや国際機関を通じた活動として行われることも多いため、こうした多様な活動形態のすべてに条約の規律が及ぶことを確認しておく必要がありました。
  - また本条は、政府間国際機関が宇宙活動を行う際に生じる実際的な問題について、条約の当事国が、当該国際機関自体、またはその加盟国のうち条約の当事国である一国以上の国と共同して解決することを定めています。これは第6条が定める国際機関の宇宙活動に関する遵守責任の規定と表裏一体の関係にあり、国際機関という国家とは異なる主体が関与する場合の責任分担や問題解決の枠組みを補完するものです。
  - この規定の背景には、条約起草当時からすでに、欧州の宇宙機関構想など複数国が共同で宇宙開発を進める枠組みが議論の俎上に上っていたことがあります。1960年代には各国が個別に宇宙開発を進めるだけでなく、資金や技術を分担する国際協力プロジェクトの必要性が認識され始めており、条約起草者たちはこうした将来の展開を見据えて本条を設けたと考えられます。
  - 例えば、複数の国が資金を出し合って共同の人工衛星プロジェクトを実施する場合や、国際的な宇宙機関が独自に探査機を打ち上げる場合であっても、その活動には宇宙条約の規定がそのまま適用されます。今日の国際宇宙ステーション計画のように、多数の国と国際的な枠組みが関与する大規模プロジェクトが円滑に運営されている背景には、こうした適用範囲の明確化があるといえます。
commentaryOsaka:
  - 第13条はな、この条約が誰の活動に適用されるんかを、はっきりさせるための条文やねん。一つの国だけでやる宇宙活動でも、複数の国が力を合わせてやる活動でも、この条約はちゃんと及ぶんやで。
  - 例えばな、くみこさんの国が単独で人工衛星を打ち上げる場合と、くみこさんの国ときよしさんの国が国際機関を作って共同で打ち上げる場合とを比べてみいひんか。どっちの場合でも、この条約の決まりは同じように適用されるんや。「国際機関を通したから条約の外や」なんて言い逃れはできへんようになっとるんやな。もし国際機関が絡む活動で実際に問題が起きたら、条約の当事国が、その機関自体か、機関に入っとる条約加盟国と一緒に解決していくことになっとるんやで。
  - この条文があるおかげで、宇宙開発が国際機関の傘の下に隠れて責任があいまいになる、いうことを防いどるんや。誰がどんな形でやっても、宇宙での約束事から逃げられへん、いう当たり前やけど大事な原則を、きちんと文字にしとるんやな。
