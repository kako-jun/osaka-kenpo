article: 6
title: 第6条
titleOsaka: ''
originalText:
  - 条約の当事国は、月その他の天体を含む宇宙空間における自国の活動について、それが政府機関によって行われるか非政府団体によって行われるかを問わず、国際責任を有し、自国の活動がこの条約の規定に従って行われることを確保する国際的責任を有する。月その他の天体を含む宇宙空間における非政府団体の活動は、条約の関係当事国の許可及び継続的監督を必要とするものとする。国際機関が、月その他の天体を含む宇宙空間において活動を行う場合には、当該国際機関及びこれに参加する条約当事国の双方がこの条約を遵守する責任を有する。
osakaText:
  - 条約に入ってる国はな、月やそのほかの天体を含む宇宙空間での自分の国の活動について、それが政府機関によるもんでも、政府とちゃう団体によるもんでも、どっちにしても国際的な責任を持つんや。自分の国の活動がこの条約の決まりに従うて行われるように確保する、国際的な責任があるんやで。
  - 月やそのほかの天体を含む宇宙空間での、政府とちゃう団体の活動には、関係する条約当事国の許可と、ずっと続く監督が必要になるんやねん。
  - 国際機関が月やそのほかの天体を含む宇宙空間で活動する場合には、その国際機関自身と、そこに参加してる条約当事国の両方が、この条約を守る責任を持つんやで。
commentary:
  - 第6条は、宇宙空間における国家活動について、当事国が国際的な責任を負うことを定めた条文です。重要なのは、その活動が政府機関によって行われるか、民間企業などの非政府団体によって行われるかを問わず、当事国が責任を負うとされている点です。つまり、たとえ活動主体が民間企業であっても、その国籍国は自国の法律や国際法に従ってその活動が行われるよう確保する義務を負います。
  - さらに本条は、非政府団体による宇宙活動には条約当事国の許可及び継続的な監督が必要であると定めています。これにより、民間企業が政府の関与なく自由に宇宙空間で活動することはできず、必ず国家による許認可制度を通す仕組みが作られています。また、国際機関が宇宙活動を行う場合には、当該国際機関自身とそこに参加する当事国の双方が条約遵守の責任を負うとされ、責任の所在が国家単位にとどまらず拡張されています。
  - この規定は、条約が国連総会で採択された1966年当時にはまだ想定の中心ではなかった民間宇宙開発の広がりを見据えた、先見性のある条文だったと評価されています。当時の宇宙開発は米ソ両国の国家プロジェクトが中心でしたが、将来的に民間企業が宇宙活動に参入する可能性を条文作成者たちは見越しており、この規定があったからこそ、後年の商業衛星打上げや民間有人宇宙船の運用も条約の枠組みの中に位置づけることができました。損害賠償責任を定める第7条とあわせて、宇宙活動の主体が誰であっても国家がその責任を最終的に引き受けるという構造を形作っています。
  - 例えば、ある国の民間企業がロケットを打ち上げて人工衛星を軌道に投入する場合、その企業の活動は当該国政府の許可と継続的な監督のもとで行われなければならず、万一その衛星が他国に損害を与えれば、企業だけでなく国籍国自体が国際的責任を問われることになります。今日のように多くの国で民間の宇宙ベンチャー企業が活発に活動している状況は、まさにこの第6条が前提として想定していた構図だといえます。
commentaryOsaka:
  - 部活動の遠征でも、顧問の先生の許可なしに、勝手に遠くまで行ったらあかんやろ。もし何かトラブルが起きたら、生徒個人だけやのうて学校自体が責任を問われることになる。国と、その国の中で活動する団体との関係も、実はそれとよう似てるんやで、いうのが第6条の考え方や。
  - 宇宙での活動が国の役所によるもんでも、民間の団体によるもんでも、その国籍を持つ国は国際的な責任を負わなあかん。しかも民間団体の場合は、打ち上げのときに一回きり許可をもらったらそれで終わり、やのうて、活動してる間ずっと国から監督を受け続けなあかんことになってる。「継続的」いう言葉がポイントで、最初だけチェックして、あとは放ったらかし、いうのはあかんのやで。
  - 条文にはもうひとつ、国際機関が宇宙で活動する場合の決まりもあってな、その機関自身と、そこに参加してる当事国の両方が、この条約を守る責任を持つことになってる。「国際機関がやったことやから、参加国は関係あらへん」いう言い逃れはでけへんのや。
  - 例えばな、ハルさんの国の大学の宇宙工学サークルが、手作りの超小型衛星を打ち上げたいと言い出したとするやろ。学生が趣味でやってるだけやから国とは無関係、そんな理屈は通用せえへんのや。ハルさんの国の政府が打ち上げを許可して、その後もちゃんと監督を続けなあかんし、もしその超小型衛星がキラさんの国の衛星にぶつかって壊してしもたら、サークルの学生個人やのうて、ハルさんの国自体が国際的な責任を問われることになるんやで。
