article: 12
title: 第12条
titleOsaka: ''
originalText:
  - 月その他の天体上のすべての基地、施設、装備及び宇宙機は、相互主義に基づいて、条約の他の当事国の代表者に開放される。これらの代表者は、適当な協議が行われるため及び訪問する施設等における安全を確保し、かつ、そこでの正常な作業に対する干渉を避けるように最大限の予防措置が執られるために、計画された訪問につき合理的な予告を行うものとする。
osakaText:
  - 月やほかの天体の上にあるすべての基地、施設、装備、それに宇宙機はな、お互い様の原則に基づいて、条約の他の当事国の代表者に開放されるんや。この代表者たちは、ちゃんとした協議ができるように、それから訪ねる先の施設なんかの安全を守り、そこでの普段の作業の邪魔にならんように最大限の予防措置がとれるように、あらかじめ訪問の予定を合理的な期間をもって知らせなあかんのやで。
commentary:
  - 第12条は、月その他の天体上にあるすべての基地、施設、装備及び宇宙機について、相互主義に基づき条約の他の当事国の代表者に開放することを定めた条文です。相互主義とは、自国の施設を他国に開放する見返りとして自国も他国の施設への立入りを認められるという関係を意味し、一方的な情報開示の強制ではなく、当事国同士の対等な関係を前提とした仕組みになっています。
  - 訪問を行う代表者は、適当な協議を行うことや、訪問先の安全確保と正常な作業への干渉を避けるために、計画された訪問について合理的な予告を行う義務も課されています。これにより、施設の開放が無秩序な立入りにつながらないよう配慮されています。この規定は、天体上での軍事基地設置等を禁じる第4条の実効性を担保する仕組みとしても機能しており、ある国が天体上にひそかに軍事施設を建設することがないか、他の当事国が現地で確認できる仕組みになっている点が重要です。
  - 歴史的には、冷戦下の米ソ両国が互いの宇宙開発や軍事動向に強い不信感を抱いていた時代背景があります。特に月面基地のような遠隔地の施設は、地球上の査察と異なり実態を把握することが難しいため、条約上の非軍事化義務が実際に守られているかを確認する手段として、相互訪問の権利を明文化しておく必要がありました。
  - 例えば、ある国が月面に科学研究基地を建設した場合、他の当事国は事前に合理的な予告を行った上で、その基地を訪問し施設の内容を確認することができます。これにより、月面の基地が条約で禁止されている軍事施設ではなく、平和的な科学目的のために使われていることを、当事国間の相互監視によって担保する仕組みが成立しています。
commentaryOsaka:
  - 第12条はな、月やほかの天体にある基地や施設を、お互いに見学し合えるようにするための決まりやねん。宇宙に基地を作ったからいうて、そこで何をしとるか完全に秘密にしてもええわけやないんや。
  - 例えばな、こういちさんの国が月面に観測基地を建てたとするやろ。そこにけんたさんの国が「見学させてほしい」言うてきたら、相互主義――つまりお互い様の原則――に基づいて、基地は開放されなあかんのや。ただし、けんたさんの国の代表がいきなり予告なしに押しかけるんはあかん。ちゃんと事前に「いつ頃訪ねます」と合理的な予告をして、こういちさんの国が安全対策や作業の調整をできるように配慮せなあかんのやで。
  - この条文が守ろうとしとるんは、「開かれた宇宙」と「現場の安全」の両立やねん。見せ合うことは大事やけど、いきなりの訪問で危険な作業に支障が出たら本末転倒や。お互いを尊重しながら透明性を保つっていう、教育の場でも大事な姿勢がここにも表れとるんやで。
