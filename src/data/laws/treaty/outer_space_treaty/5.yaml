article: 5
title: 第5条
titleOsaka: ''
originalText:
  - 条約の当事国は、宇宙飛行士を宇宙空間への人類の使節とみなし、事故、遭難又は他の当事国の領域若しくは公海における緊急着陸の場合には、その宇宙飛行士にすべての可能な援助を与えるものとする。宇宙飛行士は、そのような着陸を行ったときは、その宇宙飛行士の登録国へ安全かつ迅速に送還されるものとする。
  - いずれかの当事国の宇宙飛行士は、宇宙空間及び天体上において活動を行うときは、他の当事国の宇宙飛行士にすべての可能な援助を与えるものとする。
  - 条約の当事国は、宇宙飛行士の生命又は健康に危険となるおそれのある現象を、月その他の天体を含む宇宙空間において発見したときは、直ちに、これを条約の他の当事国又は国際連合事務総長に通報するものとする。
osakaText:
  - 条約に入ってる国はな、宇宙飛行士のことを宇宙空間に送り出された人類みんなの使者やとみなして、事故や遭難、またはほかの当事国の領域や公海に緊急着陸した場合には、その宇宙飛行士にできる限りの援助をせなあかんのや。
  - そういう着陸をした宇宙飛行士は、その人が登録されてる国まで、安全かつ速やかに送り届けられなあかんのやで。
  - どこの当事国の宇宙飛行士であっても、宇宙空間や天体の上で活動するときは、ほかの当事国の宇宙飛行士にできる限りの援助をせなあかんのやねん。
  - 条約に入ってる国はな、宇宙飛行士の命や健康を危なくするおそれのある現象を、月やそのほかの天体を含む宇宙空間で見つけたときは、すぐにほかの当事国か国際連合事務総長に知らせなあかんで。
commentary:
  - 第5条は、宇宙飛行士の地位と、事故や緊急着陸の際の各国の義務について定めた条文です。まず宇宙飛行士を「宇宙空間への人類の使節」と位置づけている点が特徴的で、宇宙飛行士が特定の国家の代表であるだけでなく、人類全体を代表する存在として扱われるべきだという理念を示しています。この理念に基づき、事故・遭難・緊急着陸が生じた場合には、着陸した場所がどの国の領域であっても、あるいは公海であっても、その国は宇宙飛行士に可能な限りの援助を与える義務を負います。
  - さらに、緊急着陸した宇宙飛行士は登録国へ安全かつ迅速に送還されなければならないこと、宇宙空間や天体上で活動する各国の宇宙飛行士同士も互いに援助を与え合うべきことが定められています。加えて、宇宙飛行士の生命や健康に危険を及ぼすおそれのある現象を発見した場合には、直ちに他の当事国や国際連合事務総長に通報する義務も課されています。これらは、宇宙という過酷な環境で活動する人間の安全を、国家間の対立を超えて確保しようとする国際協調の表れです。
  - 歴史的には、1961年4月12日にソ連のガガーリンが人類初の有人宇宙飛行に成功し、続いてアメリカも有人宇宙計画を本格化させる中で、宇宙飛行という極めて危険な活動に従事する人間をどう保護するかが現実の課題として浮上しました。冷戦下の米ソ対立という緊張関係のただ中にあっても、宇宙飛行士の生命に関わる緊急事態においては敵味方を問わず救助するという原則が確立された点に、本条の歴史的意義があります。
  - 例えば、ある国の宇宙船が予定と異なる海域に緊急着水した場合、その海域を管轄する国が当事国でなくても、条約に基づき可能な限りの救助活動を行うことが期待されます。実際に、米ソの宇宙開発が対立していた時代でも、着水地点付近の艦船が国籍を問わず救助にあたるべきだという国際的な了解が形成されており、この考え方は現在の国際宇宙ステーションにおける宇宙飛行士の相互協力にも受け継がれています。
commentaryOsaka:
  - 山で遭難した登山者を助けるとき、まず国籍を確認してから助けるかどうか決める、そんな登山家はおらへんやろ。第5条が宇宙飛行士について定めてるんは、まさにその発想を条約の言葉にしたもんなんや。宇宙飛行士を「宇宙に送り出された人類全体の使節」やと位置づけて、何よりもまず「助ける」を最優先にしてる条文やで。
  - 事故や遭難、予定外の緊急着陸があったときは、着陸した先がどこであっても、可能な限りの援助をせなあかんし、そのあとは登録国へ安全に、しかも急いで送り届けなあかん。宇宙空間で活動してる宇宙飛行士どうしも、国が違ても互いに助け合う義務がある。そしてもうひとつ、忘れたらあかんのが通報の義務や。命や健康を脅かすかもしれへん現象を見つけたときは、自分の国だけで抱え込まんと、ほかの当事国か国連事務総長に、すぐ知らせなあかんことになってるんやで。
  - 例えばな、ミナさんの国の観測衛星が、思いもよらん強烈な太陽フレアの兆候をキャッチしたとするやろ。もしそれが、いままさに宇宙空間で船外活動をしてるサクさんの国の宇宙飛行士の命に関わるかもしれへんのやったら、ミナさんの国は自分の国の情報として抱え込まんと、すぐさま国連事務総長やほかの当事国に知らせなあかんのや。国境も国籍も関係のう、命に関わる情報は共有せなあかん、いうのがこの条文の隠れた、でもめっちゃ大事なポイントやねんな。
  - この発想、今の時代でいうたら、人工衛星同士がぶつかりそうになったときに国同士で警告を送りあう仕組みにもつながってるんやで。宇宙には空港の管制塔みたいに、誰か一人がぜんぶ見張ってくれてる場所があらへんから、こういう「気づいた人が声をあげる」ルールが、めっちゃ大事な意味を持ってくるんや。
