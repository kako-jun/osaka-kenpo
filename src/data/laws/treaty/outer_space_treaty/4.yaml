article: 4
title: 第4条
titleOsaka: ''
originalText:
  - 条約の当事国は、核兵器及び他の種類の大量破壊兵器を運ぶ物体を地球を回る軌道に乗せないこと、これらの兵器を天体に設置しないこと並びに他のいかなる方法によってもこれらの兵器を宇宙空間に配置しないことを約束する。
  - 月その他の天体は、もっぱら平和目的のために、条約のすべての当事国によって利用されるものとする。天体上においては、軍事基地、軍事施設及び防備施設の設置、あらゆる型の兵器の実験並びに軍事演習の実施は、禁止する。科学的研究その他の平和的目的のために軍の要員を使用することは、禁止しない。月その他の天体の平和的探査のために必要なすべての装備又は施設を使用することも、また、禁止しない。
osakaText:
  - 条約に入ってる国はな、核兵器やそのほかの大量破壊兵器を積んだ物体を、地球のまわりを回る軌道に乗せへんこと、そういう兵器を天体に置かへんこと、ほかにどんなやり方をしようともそういう兵器を宇宙空間に配置せえへんことを約束するんやで。
  - 月やそのほかの天体は、もっぱら平和のためだけに、条約に入ってるすべての国が利用できるもんやねん。
  - 天体の上では、軍事基地や軍事施設、防備のための施設を作ることも、どんな型の兵器の実験も、軍事演習をすることも、みんな禁止や。
  - せやけど、科学研究やそのほかの平和目的のために軍に所属する人を使うことまでは、禁止してへんで。月やそのほかの天体を平和的に探査するために必要な装備や施設を使うことも、これまた禁止してへんのや。
commentary:
  - 第4条は、宇宙空間における軍事利用に一定の制限を課す、条約の中でも特に実務的な重要性が高い条文です。前段では、核兵器その他の大量破壊兵器を運ぶ物体を地球周回軌道に乗せること、天体に設置すること、その他いかなる方法でも宇宙空間に配置することを禁じています。これにより、地球を取り巻く宇宙空間が核兵器の新たな配備場所となることが法的に封じられました。
  - 後段ではさらに踏み込み、月その他の天体はもっぱら平和目的のためにのみ利用されるものとされ、天体上での軍事基地・軍事施設・防備施設の設置、あらゆる兵器の実験、軍事演習の実施を全面的に禁止しています。ただし、科学的研究その他の平和的目的のための軍の要員の使用や、平和的探査に必要な装備・施設の使用までは禁止していません。つまり、地球周回軌道については大量破壊兵器の配備のみを禁じる一方、天体上については軍事利用そのものをより広く禁じるという、二段構えの規制になっている点が特徴です。
  - この条文は、第3条が定める国際法遵守の原則を宇宙の軍事利用という具体的な場面で肉付けしたものであり、第9条が定める有害な干渉の回避義務とも関連しています。背景には、1957年のスプートニク打上げが弾道ミサイル技術の延長線上にあったことや、1960年代初頭に米ソ双方で宇宙空間を軍事拠点化する構想が検討されていたことがあります。こうした核軍拡競争が宇宙にまで及ぶことへの国際的な危機感が、本条の厳格な規定につながりました。
  - 例えば、ある国が月面に核兵器の発射基地を建設することは明確に条約違反となりますが、月面に気象観測用の無人施設や、宇宙飛行士の安全確保のための通信設備を置くことは平和的探査に必要な装備として認められます。また、軍に所属する宇宙飛行士が科学的なミッションに参加すること自体も禁止されていません。このように第4条は、軍事と平和的活動の境界線を具体的に引くことで、宇宙の非軍事化を実効性のある形で担保しています。
commentaryOsaka:
  - 学校の校庭を「みんなの遊び場」として貸してもろてるのに、こっそり武器を持ち込んで戦闘訓練場に変えてしもたら、そらあかんやろ。第4条が月やほかの天体に求めてるんは、まさにその「あかん」を法律にしたもんなんや。天体の上には軍事基地も、軍事施設も、防備施設も置いたらあかんし、どんな兵器の実験も、軍事演習そのものもいっさい禁止されてる。天体は、平和目的のためだけにみんなで使う場所やて決められてるんやで。
  - 条文の前段には、核兵器やほかの大量破壊兵器を運ぶ物体を、地球を回る軌道に乗せることも、天体に置くことも、どんな方法であれ宇宙に配備することもあかんて書かれてる。せやけど、ここで線を引かれてるんは「軍の人か、そうやないか」やのうて、「目的が平和的かどうか」やねん。せやから科学研究のために軍に所属する人が参加することや、探査に必要な装備・施設を使うことまでは禁止されてへんのやで。
  - ここでちょっと考えてみてほしいんやけど、「兵器の実験」と「防衛技術の実験」って、外から見て区別できると思う? 実際、自分の国の人工衛星をわざと壊してみせる実験が現実の世界でも行われたことがあってな、宇宙にぎょうさんのゴミを撒き散らして、国際的な批判を浴びたことがあったんや。第4条が「あらゆる型の兵器の実験」をまるごと禁止してるんは、こういう「これは防衛用です」いう言い訳を許さへんための、かなり踏み込んだ線引きなんやで。
  - 例えばな、ミオさんの国が「これは平和的な観測用や」言うて天体に無人施設を置くのは、なんの問題もあらへん。せやけど、もしその施設が実は遠隔操作できる兵器のプラットフォームやったとしたら、話は変わってくるやろ。同じ「無人施設」でも、目的次第で条約違反になるかならへんかが分かれてしまうんや。ダイキさんの国が「それ、ちょっと怪しないか」と声をあげられる余地を残しとくことも、この条文が守ろうとしてる大事な部分なんやで。
