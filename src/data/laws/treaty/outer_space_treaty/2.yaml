article: 2
title: 第2条
titleOsaka: ''
originalText:
  - 月その他の天体を含む宇宙空間は、主権の主張、使用若しくは占拠又はその他のいかなる手段によっても国家による取得の対象とはならない。
osakaText:
  - 月やそのほかの天体を含む宇宙空間はな、主権を主張したり、使用したり占拠したりしたからというて、それだけで国のもんになったりはせえへんのや。
  - ほかにどんな手段を使うたとしても、それは同じことで、国家がこの宇宙空間を取得することは認められへんのやで。
commentary:
  - 第2条は、月その他の天体を含む宇宙空間が、主権の主張、使用や占拠、その他いかなる手段によっても国家による取得の対象とならないことを定めた条文です。これは「宇宙の非専有原則」と呼ばれ、宇宙条約の中でもとりわけ重要な規定の一つとされています。地球上の陸地であれば、発見や実効支配、条約による割譲などを通じて国家が領有権を主張することが歴史的に行われてきましたが、宇宙空間や天体についてはこうした国家取得が一切認められません。
  - この規定は第1条が定める「全人類に認められる活動分野」という理念を法的に裏付けるものであり、両条文は一体として宇宙の国際公共性を支えています。仮にどこかの国が月に基地を建設したとしても、その事実だけを根拠に月の一部の領有権を主張することはできず、あくまで探査・利用の自由の範囲内での活動にとどまります。
  - 歴史的には、1957年のスプートニク打上げ以降、月や火星への到達が現実味を帯びる中で、大航海時代や植民地時代のように宇宙が国家間の領土争いの舞台になることへの強い警戒感がありました。1963年の国連決議1962号の段階ですでに非専有原則が盛り込まれており、1967年1月27日にワシントン、ロンドン、モスクワで同時に署名された本条約でこれが条約上の義務として確定しました。
  - 例えば、ある国が月面に国旗を立てたり有人探査の拠点を設けたりしても、それは科学的・平和的な利用活動として認められる一方で、その土地を自国領土として登記したり他国の立入りを排除したりすることは第2条によって禁止されます。近年、民間企業による資源採掘構想が議論されることがありますが、国家による領有そのものを禁じるこの原則は現在も宇宙法の土台であり続けています。
commentaryOsaka:
  - 地球の上やったら、昔から「先に見つけた者勝ち」「住み着いた者勝ち」で、新しい土地を自分の国のもんにしてきた歴史があるやろ。せやけど月やほかの天体については、そのやり方はいっさい通用せえへんいうことを、この第2条ははっきり書いてんねん。
  - 主権を主張しても、基地を作って使うても、占拠したかて、それだけでは国のもんにはならへん。ほかにどんな手段を思いついたかて同じことで、国家による取得そのものが認められへんのが、宇宙の非専有原則いうやつや。
  - 例えばな、Xさんの国が月に立派な観測基地を建てて、何年もそこで研究を続けたとするやろ。それでもXさんの国が「ここはうちの領土や」て地図に線を引くことはでけへんし、Wさんの国がそこに立ち入るのを断ることもでけへんのや。基地を持ってても、土地そのものは誰のもんでもないままなんやで。
  - この原則の土台は、1963年12月13日に国連総会で採択された決議1962号にすでにあって、1967年1月27日にワシントン・ロンドン・モスクワで同時に署名されたこの条約で、正式な国際約束として固められたんや。大航海時代みたいに宇宙が国同士の奪い合いの舞台になるんを防ぐための、大事な歯止めやと思うといてな。
