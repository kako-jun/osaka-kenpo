article: 17
title: 第17条
titleOsaka: ''
originalText:
  - この条約は、英語、ロシア語、フランス語、スペイン語及び中国語による本文をひとしく正文とし、寄託国政府に寄託するものとする。この条約の認証謄本は、寄託国政府が署名国及び加入国の政府に寄託するものとする。
osakaText:
  - この条約はな、英語、ロシア語、フランス語、スペイン語、それに中国語で書かれた本文をどれも同じように正文として、寄託国政府に寄託するもんや。この条約の認証謄本は、寄託国政府が署名国と加入国の政府に送り届けるんやで。
commentary:
  - 第17条は、条約の正文の言語と、認証謄本の取扱いについて定めた、条約の末尾を締めくくる形式的ながら重要な条文です。この条約は英語、ロシア語、フランス語、スペイン語及び中国語による本文をひとしく正文とし、これらの言語版のいずれもが等しく権威を持つ公式なテキストとして扱われます。特定の言語版のみが優先されるわけではなく、複数の言語で条約の解釈に食い違いが生じた場合には、これら5つの正文を照らし合わせて解釈することが想定されています。
  - これらの正文は寄託国政府、すなわちアメリカ合衆国、イギリス、ソヴィエト社会主義共和国連邦の政府に寄託され、条約の認証謄本は寄託国政府から署名国及び加入国の政府に送付されることになっています。第14条が定める批准書・加入書の寄託手続と並んで、条約という国際的な法文書が、どの言語で、どこに、どのような形で正式に保管されるかという実務上の枠組みを定める役割を果たしています。
  - 正文として採用された5つの言語は、いずれも当時の国際連合における公用語の一部と重なっており、条約が特定の国や地域の言語だけに基づくのではなく、国際社会全体に開かれた文書であることを象徴しています。1967年当時、国連の公用語は英語・フランス語・ロシア語・スペイン語・中国語の5つであり、本条約の正文の選定にもこうした国連の言語体制が反映されています。
  - 例えば、日本のようにこれら5つの正文のいずれをも公用語としない国が条約を批准する場合、日本語訳はあくまで国内での参考訳という位置づけになり、条約の解釈上の争いが生じた際には英語やロシア語など正文とされた言語のテキストに基づいて判断されることになります。このように第17条は、多言語・多文化にまたがる国際条約が共通の基盤の上で運用されるための、地味ながら不可欠な取り決めだといえます。
commentaryOsaka:
  - 第17条はな、この条約がどんな言葉で書かれた文書を「正式なもの」とするか、そしてその原本をどう扱うかを定めた、条約の締めくくりの条文やねん。
  - 例えばな、ひろとさんが英語版の条約を読んで、ふうかさんがロシア語版の条約を読んだとするやろ。この条文のおかげで、英語、ロシア語、フランス語、スペイン語、中国語のどの言葉で書かれた本文であっても、法律的な重みはまったく同じ「正文」として扱われるんや。どれか一つが「本物」で、ほかが「訳」やっていう上下関係はあらへん。この原本は寄託国政府に大事に保管されて、そこから作られた認証謄本――つまり公式に「これは原本と同じですよ」と証明されたコピーやな――が、署名した国や加入した国の政府に届けられることになっとるんやで。
  - 5つも言語があるのに優劣をつけへん、いうのは実はけっこう大変な工夫やねん。もし英語版だけが「本物」やったら、他の言語を使う国は常に翻訳を通してしか条約を読めへんことになってしまう。どの言葉を話す国も対等に条約と向き合えるようにする、そんな配慮がこの最後の条文にぎゅっと詰まっとるんやで。
