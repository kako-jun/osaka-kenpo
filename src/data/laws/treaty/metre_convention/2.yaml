article: 2
title: 第2条
titleOsaka: ''
originalText:
  - The French Government shall take all the necessary measures to facilitate the purchase, or, if expedient, the construction, of a building which shall be especially devoted to this purpose, subject to the conditions stated in the regulations which are subjoined to this convention.
osakaText: []
commentary:
  - この条文は、第1条で設立が約束された国際度量衡局のために、専用の建物を購入または必要であれば建設することを、フランス政府の責務として定めたものです。国際機関としての中立性を保ちながらも、その物理的な設置場所を確保する実務は、条約の主催国であるフランスが担うという役割分担を示しています。
  - この条文に基づいて実際に用意されたのが、パリ近郊セーヴルにあるブルトゥイユ館です。17世紀に建てられたこの館を、フランス政府が国際度量衡局のために提供し、以後は国際的な事業のために使用される特別な区画として扱われてきました。1875年の条約締結からほどなくして整備が進められ、国際メートル原器や国際キログラム原器を保管する施設として機能するようになりました。
  - 例えば、もしこの条文がなく、各国が資金を出し合うだけで実際の建物の手配を誰も引き受けなかったとしたら、国際度量衡局は絵に描いた餅で終わっていたかもしれません。フランスという開催国が「土地と建物の確保」という具体的な実務を引き受けたからこそ、条約が机上の合意にとどまらず、実際に機能する常設機関として動き出すことができたのです。
  - なお、建設・整備にかかる費用そのものは、フランスが単独で負担するのではなく、第9条の定めにより締約国全体の分担金でまかなわれます。この条文はあくまで「手配・実務」をフランスに委ねる規定であり、費用負担の仕組みは別の条文で切り分けられている点に、条約の設計の緻密さがうかがえます。
