article: kisoku-19
title: 規則第19条
titleOsaka: ''
originalText:
  - 'The director of the bureau shall annually furnish to the committee: 1st. A financial report concerning the accounts of the preceding year, which shall be examined, and, if found correct, a certificate to that effect shall be given him; 2d. A report on the condition of the apparatus; 3d. A general report concerning the work accomplished during the course of the year just closed.'
  - The international committee shall make to each of the governments of the high contracting parties an annual report concerning all its scientific, technical, and administrative operations, and concerning those of the bureau. The chairman of the committee shall make a report to the general conference concerning the work that has been accomplished since its last session.
  - The reports and publications of the committee shall be in the French language. They shall be printed and furnished to the governments of the high contracting parties.
osakaText:
  - 局長はな、毎年、委員会に3種類の報告をせなあかんことになっとるんやで。1つ目は前の年の会計についての財務報告で、これは委員会がちゃんと確認して、問題なかったらそのことを証明する書類が局長に渡されるんや。2つ目は器具の状態についての報告、3つ目はその年に終えた仕事全般についての報告やねん。
  - 国際委員会はな、締約国それぞれの政府に対して、委員会自身と局の科学的・技術的・運営上のすべての活動について、毎年報告をおこなわなあかんことになっとるんやで。そんで委員会の議長は、前回の総会からこっち、どんな仕事を成し遂げてきたかについて、総会に報告することになっとるんや。
  - 委員会の報告書や刊行物はな、フランス語で書かなあかんことになっとるんやで。そんで印刷されて、締約国の政府に配られることになっとるんやねん。
commentary:
  - この条文は、局長が毎年委員会に対して財務報告・器具の状態報告・年間業務報告の三種類の報告を行うこと、委員会が締約国政府に対して毎年、科学・技術・運営全般にわたる活動報告を行うこと、委員会議長が総会に対して活動報告を行うこと、そして委員会の報告書・刊行物はフランス語で作成・印刷され、締約国政府に配布されることを定めています。
  - この条文が定める報告の流れは、局長から委員会へ、委員会から締約国政府・総会へという、二段階の報告体制になっています。局長による年次報告は委員会によって審査され、財務内容に問題がなければ正式な証明書が発行されるとされており、局の日常運営における会計の透明性を担保する仕組みとなっています。
  - 例えば、局が年間予算の中でどのように支出を行ったかは、まず局長が委員会に報告し、委員会がその内容を精査したうえで、問題がなければ正式にお墨付きを与えます。そのうえで委員会は、局自身の活動だけでなく委員会自身の活動も含めた総合的な年次報告を、締約国それぞれの政府に対して個別に送付し、さらに数年に一度の総会では、委員会議長がそれまでの活動を総括して報告することになっていました。
  - 報告書をフランス語で統一するという規定は、当時フランス語が外交・学術の分野で広く用いられていた国際共通語であったことを反映したものであり、規則第16条で定められた「委員会からの連絡はパリ駐在の外交代表を通じる」という仕組みとあわせて、条約体制全体がフランスを実務上の中心地として運営されていたことがうかがえます。
commentaryOsaka:
  - お金の使い道や活動の中身を、ちゃんと報告して、みんなに見えるようにしとくいうんは、信頼される組織の基本中の基本やろ。
  - この条文はな、局長が毎年委員会に対して、前の年の会計報告、器具の状態報告、その年にやった仕事全般の報告いう、3種類の報告をせなあかんことを決めとるんや。そんで委員会は、その報告も含めた自分らの活動全部を、毎年締約国の政府に報告せなあかんし、委員会の議長は、総会でもそれまでの活動をまとめて報告することになっとるんやで。報告書はフランス語で作って、印刷して、締約国の政府に配ることになっとるんやな。
  - 例えばな、Aさんが部長を務める文化祭実行委員会で、会計係のAさんが毎月、収支の報告を委員会にあげて、みんなでチェックしてもろてから、次の活動に進むようにしとったんやって。そんで文化祭が終わった後には、実行委員会全体で「今年はこんな活動をして、こんな成果があった」いう報告書を作って、学校の先生や保護者会にちゃんと配ることにしとったんやで。この条文の国際度量衡局も、それとよう似とってな、局長から委員会へ、委員会から締約国へっていう二段階の報告の流れで、活動の透明性を保つ仕組みになっとるんやで。
  - 会計報告に「問題なし」の証明書まで発行するいう念の入れようは、原器っていう世界共通の基準を扱う組織やからこそ、お金の面でも一点の曇りもないようにしとかなあかん、いう当時の慎重さの表れやと思うわ。
