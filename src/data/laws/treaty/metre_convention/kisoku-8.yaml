article: kisoku-8
title: 規則第8条
titleOsaka: ''
originalText:
  - The international committee mentioned in article 3 of the convention shall be composed of fourteen members, who shall belong to different states.
  - It shall consist, at first, of the twelve members of the former permanent committee of the international commission of 1872, and of the two delegates who, at the time of the appointment of that permanent committee, received the largest number of votes next to the members who were elected.
  - At the time of the renewal of one-half of the international committee, the retiring members shall be, first, those who, in cases of vacancy, may have been elected provisionally during the interval occurring between two sessions of the conference. The others shall be designated by lot.
  - The retiring members shall be re-eligible.
osakaText:
  - 条約第3条に出てくる国際委員会はな、14人のメンバーで構成されることになっとって、そのメンバーはみんな別々の国の出身やないとあかんのやで。
  - 最初はな、1872年の国際委員会の常任委員会におった12人のメンバーと、その常任委員会が任命されたときに、選ばれたメンバーに次いで多くの票を集めた2人の代表を合わせた顔ぶれで構成されることになっとるんや。
  - 委員会のメンバーの半分を入れ替えるときはな、まず、総会と総会の間の期間に欠員が出て暫定的に選ばれたメンバーから先に退任することになっとって、残りは、くじ引きで決めることになっとるんやで。
  - 退任したメンバーも、また選ばれることができることになっとるんや。
commentary:
  - この条文は、条約本文第3条で言及されている国際委員会について、14人の委員は互いに異なる国の出身者で構成されること、当初の顔ぶれは1872年の国際委員会常任委員会の12名と、次点で票を集めた2名の代表とすること、半数改選の際には暫定選出だった委員が優先的に退任し、残りはくじ引きで決めること、退任者も再選され得ることを定めています。
  - 14人という具体的な人数と、各委員が異なる国に属さなければならないという条件は、特定の国や地域の利害が委員会運営を支配することを防ぐための工夫です。1872年の国際委員会常任委員会という既存の実績ある専門家集団をそのまま引き継ぐことで、条約発効直後から一定の科学的な信頼性を備えた委員会をただちに稼働させることができました。
  - 例えば、半数改選の際に、任期途中の欠員を通信選挙(規則第14条)で暫定的に埋めていた委員がいた場合、その委員は正式な任期を終えていないにもかかわらず、次の半数改選の対象として優先的に退任することになります。残りの改選対象者はくじ引きで機械的に決めることで、特定の委員を恣意的に排除するような政治的な駆け引きが入り込む余地を減らしています。
  - 退任した委員が再び選ばれる余地を残している点は、経験豊富な専門家が委員会から完全に失われることを防ぎ、科学的な継続性を維持するための配慮であり、規則第7条で定められた総会による半数改選の仕組みと合わせて、委員会の新陳代謝と専門性の維持とを両立させる制度設計になっています。
commentaryOsaka:
  - 新しい組織を一から立ち上げるより、すでに実績のあるメンバーをそのまま引き継いだほうが、スタートダッシュが切りやすいことってあるやろ。
  - この条文はな、条約に出てくる国際委員会いう組織の中身を決めとるんや。委員会は14人で構成されて、それぞれ違う国の出身やないとあかんことになっとる。最初のメンバーは、1872年からあった常任委員会の12人と、そのとき次点やった代表2人を合わせた顔ぶれでスタートするんやで。そんで、委員会のメンバーを半分入れ替えるときは、まず、途中で欠員が出て暫定的に選ばれた人から先に辞めてもらって、残りはくじ引きで決めることになっとるんや。辞めた人も、また選ばれることはできるんやで。
  - 例えばな、Aさんが所属する地域のボランティア団体で、新しく発足するときに、以前あった別の団体で活動しとった経験豊富なメンバーをそのまま何人か引き継ぐことにしてん。ゼロから人を集めるより、実績のある人らが最初からおったほうが、すぐにちゃんと活動を始められるからやな。そんでメンバーを入れ替えるときも、まず期間限定で臨時に入ってもろてた人から先に退いてもらって、残りはくじ引きで公平に決めることにしとったんやって。この条文の国際委員会も、それとよう似とってな、いきなり全員入れ替えるんやのうて、実績あるメンバーを引き継ぎつつ、少しずつ公平に入れ替えていく仕組みになっとるんやで。
  - くじ引きで機械的に決めるいうんは、一見テキトーに見えるかもしれへんけど、誰かの好き嫌いで人を選ばれへんようにする、実はよう考えられた公平のための工夫なんやで。
