article: kisoku-2
title: 規則第2条
titleOsaka: ''
originalText:
  - It shall be the duty of the international committee to acquire and fit up the aforesaid building and to set in operation the work for which it was designed.
  - In case of the committee's inability to obtain a suitable building, one shall be built under its direction and in accordance with its plans.
osakaText:
  - 前の条文で決めた建物を実際に手に入れて、中を整えて、目的どおりに使えるようにするんはな、国際委員会の仕事やで。もしちょうどええ建物が見つからへんかったら、委員会が自分で指揮をとって、自分らの計画にそって新しく建てることになるんやねん。
commentary:
  - この条文は、規則第1条で定められた要件を満たす建物を実際に取得し、内部を整備し、稼働させる責任が国際委員会にあることを定めています。あわせて、適当な既存の建物が見つからない場合には、委員会自身の指揮のもとで新築することも認めています。
  - 条約本文第2条ではフランス政府が建物の購入・建設の便宜を図る義務を負う一方、この規則第2条は、その建物を実際に運用可能な状態に整えるという、より実務的な責任を国際委員会に課しています。建物の手配というハード面をフランス政府が、その建物を機能させるソフト面を国際委員会がそれぞれ担うという、役割分担が読み取れます。
  - 例えば、フランス政府が候補となる建物を見つけて委員会に提示しても、その内部が金庫室や実験室として使える状態でなければ意味がありません。この条文により、内装の改修や設備の据え付けといった実務は委員会の責任と判断で進められることになり、既存の建物が見つからない場合には、委員会が自ら設計方針を定めて新築するという選択肢も確保されています。
  - この規定は、後に条約本文第9条・規則第20条で定められる分担金の使途とも密接に関わっており、建物の取得・整備にかかる費用も、締約国全体で負担する共通経費の一部として扱われることになります。
commentaryOsaka:
  - 「ここ使こてええで」いう場所が決まっても、実際に住めるように整えるんは、また別の仕事やんな。
  - この条文はな、規則第1条で決めた建物を、実際に手に入れて、使えるように整えて、動かし始めるいう一連の仕事を、国際委員会の責任にしとるんや。フランス政府が「この建物どうや」いうて候補を出す役やとしたら、委員会はそれを受け取って実際に稼働させる役、いう分担になっとるんやな。もし、ちょうどええ建物がどうしても見つからへんかったら、委員会が自分で指揮をとって、新しく建物を建てることまでできることになっとるで。
  - 例えばな、Aさんの通う吹奏楽部が、市の施設から古い倉庫を練習場として借りられることになってん。でも借りられただけでは楽器も置かれへんし、防音もされてへん状態やった。そこで部長のAさんが、部員たちと相談しながら防音パネルを取り付けたり、楽器を置く棚を組んだりして、実際に練習できる状態に整えていったんや。もし借りられる倉庫がどこにも見つからへんかったら、顧問の先生に頼んで、新しく部室を建ててもらうことも考えとったんやって。この条文の国際委員会の役目も、ちょうどこんな感じでな、建物を手に入れるだけやのうて、実際に使える状態まで責任持って整える、いうことなんやで。
  - 建物を「用意する係」と「使えるように整える係」を分けとくいうのは、それぞれの得意分野に集中できるいう意味でも、理にかなった仕組みやねんな。
