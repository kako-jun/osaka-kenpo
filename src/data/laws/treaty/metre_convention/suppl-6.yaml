article: suppl-6
title: 附則第6条
titleOsaka: ''
originalText:
  - The immediate formation of the international committee is authorized, and that body, when formed, is hereby empowered to make all necessary preparatory examinations for the carrying into effect of the convention, without, however, incurring any expense before the exchange of the ratifications of the said convention.
osakaText:
  - 国際委員会をすぐに発足させることが認められとるんやで。そんで発足した委員会はな、この条約を実際に発効させるために必要な準備段階の検討を、全部おこなう権限を持つことになっとるんや。ただし、条約の批准書が交換されるまでは、どんな費用も発生させたらあかんことになっとるんやねん。
commentary:
  - この条文は、経過規定の最後の条文として、国際委員会の即時発足を認めるとともに、発足した委員会が条約発効のために必要な準備的検討を行う権限を持つこと、ただし条約の批准書交換が完了するまでは一切の費用を発生させてはならないことを定めています。
  - 条約第14条により、条約は各締約国の批准と批准書の交換を経て初めて正式に効力を持ちますが、この手続きには一定の時間を要します。この条文は、その正式発効を待たずに国際委員会を先行して発足させ、発効後すぐに実務が始められるよう準備を整えておくことを認めるものです。同時に、まだ正式に法的拘束力を持たない段階で締約国に金銭的な負担を負わせることのないよう、費用発生のタイミングには明確な制約を設けています。
  - 例えば、条約が署名されてから批准書の交換が完了するまでの数か月の間に、国際委員会はすでに活動を始め、規則の細部を検討したり、原器製作の技術的な準備を進めたりすることができました。しかし、建物の取得や職員の雇用といった実際に費用が発生する行為は、批准書の交換によって条約が確実に効力を持つことが確定するまで、差し控える必要がありました。
  - この条文は、附則第1条から第5条までで整理されてきた、1872年委員会からの科学的・実務的な引き継ぎを土台としつつ、条約という新しい法的枠組みが正式に始動するまでの過渡期を、準備は前倒しで進めながらも財政的リスクは負わないという形で乗り切るための規定であり、経過規定全体を締めくくるにふさわしい実務的な知恵を示しています。
commentaryOsaka:
  - 正式にスタートする前から準備だけは進めときたいけど、お金を使うんはまだ早い、っちゅう場面、よくあるやろ。
  - この条文はな、経過規定のいちばん最後の条文でな、国際委員会をすぐにでも発足させてええことを認めとるんや。そんで発足した委員会は、条約を実際に発効させるために必要な準備の検討を、なんでもできる権限を持つことになる。ただし、条約の批准書がちゃんと交換されるまでは、どんな費用も使こたらあかんことになっとるんやで。
  - 例えばな、Aさんが所属するバンドが、正式にライブハウスとの出演契約を結ぶ前から、メンバー集めや曲決め、練習スケジュールの調整なんかは先に始めとったんやって。でも、機材のレンタル料や会場費みたいな実際にお金がかかることは、契約書にちゃんとサインするまでは手を出さんようにしとったんや。契約が正式に決まる前に無駄なお金を使こてしもたら、もし話が流れたときに困るからやな。この条文の国際委員会も、それとよう似とってな、活動の準備は前倒しで始めてもええけど、お金が絡む部分は、条約が確実に効力を持つと分かるまで待つ、いう慎重な線引きがされとるんやで。
  - 準備を急ぎつつも、お金の面ではきっちり歯止めをかけとく。この最後の条文が、経過規定全体の「先走りすぎず、でも無駄なく引き継ぐ」いう姿勢を象徴しとるように思うわ。
