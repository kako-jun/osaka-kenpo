article: kisoku-15
title: 規則第15条
titleOsaka: ''
originalText:
  - The international committee shall prepare detailed regulations for the organization and the labors of the bureau, and shall fix the amounts to be paid for the performance of the extraordinary duties provided for in article 6 of this convention.
  - Such amounts shall be applied to the improvement of the scientific apparatus of the bureau.
osakaText:
  - 国際委員会はな、局の組織や仕事のやり方について、もっと細かい規則を作らなあかんことになっとるんやで。そんで、条約第6条に書いてある特別な仕事をやってもらったときに払う金額も、委員会が決めることになっとるんや。
  - そうやって集めたお金はな、局の科学的な器具を良くするために使わなあかんことになっとるんやねん。
commentary:
  - この条文は、国際委員会が局の組織運営や業務内容についてのより詳細な内規を自ら定めること、そして条約本文第6条で列挙された特別業務(国家標準の検定や測地測量用測定棒の検定など)の対価となる料金を委員会が設定すること、さらにその料金収入を局の科学機器の改善に充てることを定めています。
  - 条約本文第6条は、国際度量衡局の業務として、新原器の比較検定という締約国共通の基本業務に加えて、締約国や科学団体、さらには民間の技術者や科学者からの依頼にも応じて標準器の比較検定を行うことを認めています。この条文は、そうした「特別な依頼業務」に対して局がどのように対価を得るかを規律するものです。
  - 例えば、ある国の科学者が個人的に自分の測定器具を国際標準と比較検定してほしいと依頼した場合、局はこの条文に基づいて委員会が定めた料金を徴収して検定作業を行うことができました。そしてその料金収入は、締約国が負担する分担金とは別の財源として、局の科学機器のさらなる改善に再投資されることとされており、局が外部からの依頼業務を通じて自律的に設備を充実させていく仕組みが作られています。
  - この規定はまた、国際委員会に対して、条約や本規則で定められた大枠のルールを補う、より実務的な内規を自ら制定する権限を与えるものでもあり、規則第22条で「これらの規則は条約と同じ効力を持つ」と定められていることと合わせて、条約体制が委員会による自律的な運営を大幅に認めていたことがうかがえます。
commentaryOsaka:
  - 頼まれ仕事を引き受けたときに、それをタダでやるんか、ちゃんと料金を取るんか、それをどう使うんか、っていうルールがあらかじめ決まっとったら、みんな安心して頼めるようになるやろ。
  - この条文はな、国際委員会が局の組織や仕事の進め方について、もっと細かい内規を自分で作らなあかんことと、条約に書いてある特別な依頼業務をやったときにもらう料金を、委員会が決めることを定めとるんや。そんで、そうやってもろた料金は、局の科学的な器具をより良くするために使わなあかんことになっとるんやで。
  - 例えばな、Aさんが得意なイラストを、友達から「うちの部活のポスターを描いてほしい」って頼まれることがあってん。ふだんの部活動の絵は無料で描いとったけど、こういう特別な頼まれ仕事のときは、ちゃんと材料費くらいはもらうことにしとって、もろたお金は新しいペンやタブレットを買うために貯めることにしとったんやって。この条文の国際度量衡局も、それとよう似とってな、みんなで共同運営する基本の仕事とは別に、個別の頼まれ仕事には料金を取って、それを設備の充実にまわす仕組みになっとるんやで。
  - 頼まれ仕事の料金が、ちゃんと局自身の設備向上に還元される仕組みになっとるんは、外部からの依頼が増えれば増えるほど、局の科学的な実力も上がっていく、ええ循環になっとったんやろな。
