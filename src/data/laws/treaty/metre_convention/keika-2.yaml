article: keika-2
title: 経過規定第2条
titleOsaka: ''
originalText:
  - The principal object of the first meeting of the general conference of weights and measures shall be to sanction these new prototypes, and to distribute them among the states which shall have expressed a desire to receive them.
  - In consequence, the delegates of all the governments which were represented in the international commission of 1872, as likewise the members of the French section, shall, of right, form part of this first meeting for the sanction of the prototypes.
osakaText:
  - 度量衡総会の最初の会合はな、これらの新しい原器を正式に承認して、受け取りたいと希望しとる国々に配分することを、いちばんの目的とすることになっとるんやで。
  - そういうわけでな、1872年の国際委員会に代表を送っとった全部の政府の代表、それにフランス人部会のメンバーもみんな、原器を承認するこの最初の会合に、当然の権利として参加できることになっとるんやねん。
commentary:
  - この条文は、条約発効後に開催される国際度量衡総会の第一回会合の主目的が、新原器を正式に承認し、それを希望する各国に配分することであると定め、そのために1872年の国際委員会に参加していた各国代表とフランス人部会のメンバーが、当然の権利として第一回会合に参加できることを定めています。
  - 通常、規則第7条で定める総会は締約国政府の正式な代表によって構成されますが、この条文は、条約発効前から原器製作プロジェクトに関わってきた1872年委員会の代表たちにも、第一回会合への参加資格を特別に認めています。これは、新原器という条約体制の最も重要な成果物の承認という節目に、その製作に実際に携わってきた専門家たちの知見と正当性を反映させるための経過措置です。
  - 例えば、1872年の国際委員会に参加していたある国の代表は、その後その国が正式に条約を批准していなくても、新原器が正式に承認される歴史的な第一回総会には、当然の権利として出席できました。この条文があることで、原器製作という長期プロジェクトの当事者たちが、その成果を自らの目で見届け、承認の議論に加わることができたのです。
  - この条文は、経過規定第1条で保護された1872年参加国の既得権を、単に原器を受け取る権利にとどまらず、その原器を正式に承認する歴史的な会議への参加権にまで広げるものであり、条約体制が、それ以前の科学的な取り組みの継続性と正当性を、細部にわたって尊重する設計になっていたことを示しています。
commentaryOsaka:
  - 長い時間をかけて作り上げてきたもんの完成披露の場には、それを実際に作ってきた人らにも、ちゃんと立ち会ってほしいもんやろ。
  - この条文はな、条約ができた後に開かれる度量衡総会の、いちばん最初の会合の目的を決めとるんや。その目的いうんは、新しい原器を正式に認めて、欲しいいう国々に配ることやねん。そんで、この記念すべき最初の会合には、1872年からの国際委員会に参加しとった国の代表や、フランス人部会のメンバーも、当然の権利として参加できることになっとるんやで。
  - 例えばな、Aさんが何年もかけて地域の伝統工芸の復元プロジェクトに携わってきて、いよいよ完成披露のお披露目会が開かれることになってん。お披露目会は正式には地域の文化保存会が主催するんやけど、実際に長年制作に関わってきたAさんたち職人も、当然のように招待されて、その場に立ち会うことができたんやって。この条文の第一回総会も、それとよう似とってな、原器を実際に作ってきた1872年委員会のメンバーが、その完成披露の場に、権利として参加できるようになっとるんやで。
  - 成果物を正式に承認する場に、それを作った当事者を欠かさず招くいう発想は、原器という科学的な信頼性がいちばん大事なものを扱ううえで、とても筋の通ったやり方やと思うわ。
