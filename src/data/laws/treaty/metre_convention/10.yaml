article: 10
title: 第10条
titleOsaka: ''
originalText:
  - The amounts representing the contributions of each of the contracting states shall be paid at the beginning of each year, through the ministry of foreign affairs of France, into the Caisse des dépôts et consignations at Paris, whence they may be drawn as occasion may require, upon the order of the director of the bureau.
osakaText:
  - 締約国それぞれが負担する分担金の額はな、毎年のはじめに、フランスの外務省を通じてパリにある供託金庫(カイス・デ・デポ・エ・コンシニャシオン)に払い込まれるんやで。そこに積み立てられたお金は、局長からの指図があったときに、必要に応じて引き出せるようになっとるんや。
commentary:
  - この条文は、各締約国が負担する分担金の具体的な納付方法を定めたもので、各国は毎年の年初に、フランス外務省を経由して、パリの供託金庫(Caisse des dépôts et consignations)へ分担金を払い込むこと、そしてその資金は局長の指図に応じて必要な都度引き出されることを規定しています。
  - 供託金庫は、フランス国内の公的な資金管理機関であり、国庫に準じる高い信頼性を持つ機関として19世紀から機能してきました。国際度量衡局という多国籍の資金を扱う機関の会計処理を、特定の一国だけの裁量に委ねてしまうと不透明さが生じかねませんが、フランスの公的な供託機関を経由させることで、資金の流れを可視化し、不正の入り込む余地を減らす仕組みになっています。
  - 例えば、ある年にドイツが自国の分担金をフランス外務省経由で供託金庫に払い込んだとすると、その資金は国際度量衡局の帳簿上では他国からの拠出金とあわせて一括管理され、局長が新しい測定機器を購入する必要が生じた際などに、必要な分だけ引き出されて使われることになります。
  - この納付の仕組みは、第9条で定められた人口比例による分担金の算定方法と一体で機能するものであり、算定方式と納付方式をそれぞれ別の条文に分けて規定している点に、条約起草者の実務的な配慮がうかがえます。
commentaryOsaka:
  - お金の集め方と使い方の話やけど、みんなの家でもお小遣い帳とか積立とかあるやろ？この条文はな、国どうしのお金の管理についての決まりごとなんや。
  - 各国が出す分担金は、毎年のはじめにフランスの外務省を通じてパリの供託金庫にいったん集められるんやで。局長が「これに使うで」って指図したときだけ、必要な分が引き出される仕組みになっとるんや。誰かが勝手に持ち出したりできんように、ちゃんと手続きを踏むようになっとるんやな。
  - 例えばな、けんたろうくんの入っとるクラブでは、みんなで出し合った活動費を担任の先生がいったん学校の金庫に預けて、道具を買うときだけ先生の許可をもらって引き出すようにしてるんやって。この条約の仕組みもそれとよう似とってな、加盟国が出したお金は一旦パリの金庫にまとめて預けられて、局長の指図があったときだけ引き出されるんやで。
  - ここでおもろいのはな、フランスが窓口になってるところやねん。国際的な組織やのに、事務のやりとりは全部フランス外務省を通す、いうのがこの条約の特徴の一つなんやで。お金の流れがはっきりしてるさかい、あとで揉めごとが起きにくい仕組みになっとるんやな。
