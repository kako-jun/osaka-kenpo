article: kisoku-9
title: 規則第9条
titleOsaka: ''
originalText:
  - The international committee shall direct the work connected with the verification of the new prototypes, and, in general, all the metrological labors, as the high contracting parties may decide to have performed at the common expense.
  - It shall, moreover, exercise supervision over the safe-keeping of the international prototypes.
osakaText:
  - 国際委員会はな、新しい原器を検定する作業や、締約国がみんなで費用を出し合うて実施を決めた計量に関する仕事全般を、指揮する役目を持っとるんやで。
  - それに加えて、国際原器がちゃんと安全に保管されとるかどうかを監督する役目も、国際委員会が持っとるんやねん。
commentary:
  - この条文は、国際委員会の職務として、新原器の検定作業をはじめとする、締約国が共同経費で実施を決めた計量学上の作業全般を指揮すること、および国際原器の安全な保管について監督することを定めています。
  - 国際委員会は、規則第8条で定められた14人の専門家集団として、日々の科学的な作業を実際に指揮する立場にあります。単に方針を決めるだけでなく、新原器の検定という具体的な技術作業から、締約国が別途依頼する計量学上の様々な業務まで、幅広く実務の指揮を担う点が、この条文の特徴です。
  - 例えば、ある締約国が自国の国家原器と国際原器との比較検定を依頼した場合、その作業がどのような手順・精度で行われるべきかを判断し、指揮するのは国際委員会の役割です。また、国際原器そのものの保管状態についても、単に局の職員任せにするのではなく、委員会が監督責任を負うとされており、この監督責任は、規則第18条で定められる「局長でも委員会の決議と委員2名の立会いがなければ保管場所に立ち入れない」という厳格なアクセス制限の根拠にもなっています。
  - この条文は、条約本文第6条で列挙された国際度量衡局の業務内容(新原器の比較検定、国際原器の保管、国家標準の定期比較など)を、実際に誰が指揮・監督するのかという運営責任の所在を明確にするものであり、局が単なる作業機関ではなく、国際委員会の監督下で運営される機関であることを示しています。
commentaryOsaka:
  - どんなに立派な作業計画があっても、それを実際に指揮して監督する人がおらんかったら、絵に描いた餅になってまうもんやろ。
  - この条文はな、国際委員会の仕事の中身を決めとるんや。新しい原器を検定する作業や、締約国がお金を出し合うてやろうと決めた計量に関する仕事は、全部この委員会が指揮することになっとる。そんでそれだけやのうて、いちばん大事な国際原器がちゃんと安全に守られとるかどうかも、この委員会が監督する役目を持っとるんやで。
  - 例えばな、Aさんが所属する合唱部で、コンクールに向けた練習メニューを実際に指揮するのは指導係のAさんの役目やってん。曲の解釈も、パート練習の進め方も、Aさんが判断して部員に指示を出しとった。そんでAさんは、練習だけやのうて、部で大事に使こてる楽譜の原本がちゃんと保管されとるかどうかまで、責任持って気にかけとったんやって。この条文の国際委員会も、それとよう似とってな、日々の技術作業を指揮するだけやのうて、いちばん大事な国際原器の保管状況まで、ちゃんと目を配る役目を持っとるんやで。
  - 「実際にやる作業」と「それを見守る監督」を、同じ委員会が両方担うことで、責任の所在がはっきりして、原器の管理にすきまができへんようになっとるんやな。
