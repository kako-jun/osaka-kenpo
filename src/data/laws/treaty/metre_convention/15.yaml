article: 15
title: 第15条（付属規則）
titleOsaka: ''
originalText:
  - The international committee for weights and measures shall provisionally fill such vacancies as may occur in it; these elections shall take place by correspondence, each of the members being called upon to take part therein.
osakaText:
  - 国際度量衡委員会に欠員が出たときはな、委員会自身が暫定的にその欠員を補充するんやで。この選挙は、書面でのやりとり、いわゆる通信の方法でおこなわれてな、委員全員が参加するように呼びかけられるんやねん。
commentary:
  - この条文は、国際度量衡委員会(CIPM)に欠員が生じた場合、委員会が暫定的にその欠員を補充することを定めたものです。補充のための選挙は書面による通信の方法で行われ、委員会の全メンバーがこの選挙に参加するよう求められています。
  - 国際度量衡委員会は、各国の代表というよりも、個人の科学的な資格に基づいて選ばれる専門家集団としての性格を持つ機関でした。委員が死去や引退などにより欠けた場合、その都度、総会を招集して後任を選出するのでは時間と手間がかかりすぎるため、この条文は通信による選挙という簡便な方法をあらかじめ用意しておくことで、委員会の機能を継続的に維持できるようにしています。
  - 例えば、ある委員が任期途中で死去した場合、委員会は総会の次回開催を待つことなく、残りの委員全員に対して書面で後任候補を照会し、投票によって暫定的な後任を選出することができました。「暫定的」とされているのは、正式な人事の確定はあくまで次の総会の場で追認される必要があったためで、緊急の欠員補充と、正式な承認手続きとを組み合わせた、実務上バランスの取れた仕組みになっています。
  - この通信による選挙という方法は、局長・次長の選任について秘密投票で行うと定めた第17条とは異なる手続きであり、委員会自身のメンバー補充と、局の職員人事とが、条約の中で明確に書き分けられていることがわかります。
commentaryOsaka:
  - 委員会のメンバーが急にいてへんようになったら、次の総会まで何年も待つんかいな？って思うやろ。
  - この条文はな、委員会のメンバーに欠員が出たときの対応を決めとるんや。わざわざ大がかりな会議を開いて選び直すんやのうて、委員会自身が暫定的に欠員を埋める権限を持っとるんやで。しかも、その選挙のやり方が特徴的でな、みんなが一堂に会するんやのうて、手紙とか書面でのやりとり、つまり通信の方法でおこなわれるんや。もちろん、勝手に一部の人だけで決めるんやのうて、委員全員に声をかけて参加してもらうことになっとるんやで。
  - 例えばな、さくらさんが入っとる合唱団で、役員の一人が引っ越しで急に辞めることになってん。次の定期総会まではまだ半年もあるし、それまで役員が欠けたままいうわけにもいかへんやろ。そこで団の代表が、全員に手紙で候補者の名前を送って、返信で投票してもらうことにしてん。集まった投票をもとに、暫定の役員が決まってん。この条文の委員会の欠員補充も、まさにこんな感じで、通信、つまり手紙のやりとりで全委員が参加して決める仕組みになっとるんやで。
  - 当時はまだ手紙でのやりとりが基本の時代やったから、わざわざ委員を全員集めんでも、書面だけで選挙ができる、いう仕組みはほんまに理にかなっとったんやで。委員会がいつでも欠けることなく機能し続けられるように、ちゃんと工夫されとるんやな。
