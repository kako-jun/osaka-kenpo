article: 8
title: 第8条
titleOsaka: ''
originalText:
  - The international prototypes of the meter and of the kilogram, together with the test copies of the same, shall be deposited in the bureau, and access to them shall be allowed to the international committee only.
osakaText:
  - メートルとキログラムの国際原器、それからその試験用複製は、局の中に保管されることになっとるんや。そんで、それらに近づけるんは国際度量衡委員会だけに限られとるんやで。
commentary:
  - この条文は、メートルとキログラムの国際原器、およびその検定用複製(試験用副原器)が国際度量衡局に保管されること、そしてこれらへのアクセスが国際度量衡委員会(CIPM)にのみ許されることを定めています。度量衡の絶対的な基準となる原器を、誰でも自由に取り扱えるようにしてしまえば、摩耗や損傷、あるいは不正な改変によって基準そのものの信頼性が損なわれてしまうため、極めて厳格な管理体制が必要とされたのです。
  - 国際メートル原器と国際キログラム原器は、白金90%・イリジウム10%の合金で製作された、腐食や摩耗に強い特別な器物です。1889年の第1回国際度量衡総会で各国に配布された国家原器とは異なり、この国際原器そのものは唯一無二の存在としてパリ近郊セーヴルの国際度量衡局に厳重に保管され続けました。
  - 例えば、ある国が「自国の国家原器が国際原器と一致しているか確認したい」と考えても、国際原器そのものに直接触れることは許されません。局が定期的に実施する比較作業を通じて、間接的にその整合性を確認する仕組みになっています。この徹底したアクセス制限があったからこそ、国際原器は100年以上にわたってほとんど変化のない状態で保存され、世界共通の基準としての権威を保つことができました。
  - なお、この厳格な管理体制は第18条でさらに具体化されており、保管場所は3本の鍵によってのみ開けられること、局長が保管場所に立ち入るには委員会の決議と委員2名の立会いが必要であることが定められています。
commentaryOsaka:
  - ほんまに大事なもんは、誰でも自由に触れる場所には置いとかへんやろ。鍵のかかる場所にしまって、開けられる人を限定するもんやんな。第8条は、メートルとキログラムの「本物の原器」を、どれだけ厳重に守るんかを定めとる条文やねん。
  - 例えばな、ケンゴの通う学校に、創立百周年の記念に作られた「学校の宝」いう置物があるとするやろ。これは複製もいくつか作られて、各教室に飾られとるんやけど、本物はぜったいに校長室の金庫に保管されとって、鍵を持っとるんは校長先生と教頭先生の二人だけやねん。複製やったら誰でも見て触れるけど、本物にはめったなことでは近づけへんようになっとる。第8条が定めとるんもまさにこれと同じ考え方でな、メートルとキログラムの国際原器、それとその試験用の複製は局の中に保管されるんやけど、それに近づけるんは国際度量衡委員会だけに限られとるんやで。
  - 第6条で局の仕事として「国際原器の保管」が挙げられとったけど、第8条はその保管をもう一歩具体的にして、「誰がアクセスできるんか」いうアクセス権の話にまで踏み込んどるんや。基準そのものが誰かに勝手に触られて狂ってしもたら、世界中の長さや重さの土台が揺らいでしまうさかい、ここまで厳重にする必要があったんやろな。
