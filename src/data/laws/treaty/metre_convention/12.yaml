article: 12
title: 第12条
titleOsaka: ''
originalText:
  - The high contracting parties reserve to themselves the power of introducing into the present convention, by common consent, any modifications the propriety of which may have been shown by experience.
osakaText: []
commentary:
  - この条文は、締約国が全会一致の合意によって、経験を通じてその妥当性が示された修正を条約に加えることができる権利を留保する規定です。条約という国家間の正式な合意であっても、将来にわたって一切変更できない硬直的なものにはせず、実際の運用経験を踏まえた見直しの余地をあらかじめ残しておく、柔軟な立法姿勢を示しています。
  - 19世紀の国際条約の中には、いったん締結すると改正の手続きが極めて煩雑で、事実上運用が硬直化してしまうものも少なくありませんでした。メートル条約がこの条文をあらかじめ設けていたことは、条約起草者が科学技術の進歩や国際情勢の変化を見越し、条約そのものの寿命を長く保つための工夫をしていたことを示しています。
  - 例えば、条約締結から数十年後、科学技術の進歩によってメートルやキログラムの定義をより精密な方法で表現する必要が生じた場合でも、この条文があることで、全締約国の合意さえ得られれば条約の枠組みの中で対応できる余地が確保されていました。実際、20世紀に入るとメートルの定義は国際原器を基準とするものから、光の波長や光速を基準とする定義へと段階的に見直されていきますが、こうした変更を可能にする制度的な土台の一つが、この第12条の存在だったといえます。
  - なお、条約そのものを一方的に離脱する権利については、次の第13条で別途定められており、この第12条の「共通の合意による改正」とは性質の異なる規定として区別されています。
