article: 6
title: 第6条
titleOsaka: ''
originalText:
  - 'The international bureau of weights and measures shall be charged with the following duties:'
  - 1st. All comparisons and verifications of the new prototypes of the meter and kilogram.
  - 2d. The custody of the international prototypes.
  - 3d. The periodical comparison of the national standards with the international prototypes and with their test copies, as well as comparisons of the standard thermometers.
  - 4th. The comparison of the prototypes with the fundamental standards of non-metrical weights and measures used in different countries for scientific purposes.
  - 5th. The sealing and comparison of geodesic measuring-bars.
  - 6th. The comparison of standards and scales of precision, the verification of which may be requested by governments or by scientific societies, or even by constructors or men of science.
osakaText:
  - 国際度量衡局には、次のような仕事が任されとるで。
  - 一つ目は、メートルとキログラムの新しい原器について、比較と検定を残らず行うことや。
  - 二つ目は、国際原器を大事に保管すること。
  - 三つ目は、各国の国家標準器を国際原器やその試験用複製と定期的に比較して、標準温度計の比較もすることやねん。
  - 四つ目は、いろんな国で科学のために使われとる、メートル法とちゃう単位の基本標準器と原器を比較することや。
  - 五つ目は、測地用の測定桿に封印をして比較すること。
  - 六つ目は、政府や学会、それに製作者や研究者から頼まれることのある、精密な標準器や目盛りの検定・比較をすることやで。
commentary:
  - この条文は、国際度量衡局が担うべき具体的な業務を6項目にわたって列挙したものです。新しいメートル原器・キログラム原器の比較と検定、国際原器の保管、各国の国家標準と国際原器との定期的な比較、非メートル系の基準との科学的比較、測地用計量桿の封印と比較、そして政府・学術団体・技術者などから依頼された標準器の比較検定が、それぞれ局の任務として明記されています。
  - これらの業務のうち、特に重要だったのが最初の項目、すなわち新しい原器の比較検定です。メートル条約締結後、国際度量衡局では白金イリジウム合金による新しい国際メートル原器と国際キログラム原器が製作され、既存の基準との厳密な比較検証が行われました。この作業の成果として、1889年に開催された第1回国際度量衡総会において、各締約国に国際原器の複製(国家原器)を配布することが決定されます。
  - 例えば、日本も1885年にこの条約に加盟しており、1889年の配布決定を受けて、翌1890年にフランスから「日本国メートル原器」(No.22)と「日本国キログラム原器」(No.6)が到着しました。これらは中央度量衡器検定所(現・産業技術総合研究所)で保管され、日本国内における長さと質量の基準として、以後長らく用いられました。局はこうした国家原器についても、定期的に国際原器と比較する任務を負っており、経年変化がないかを継続的に監視しています。
  - なお、こうした比較検定の作業に必要な人員体制については第7条で、国際原器そのものの保管・アクセス制限については第8条で、それぞれ具体的に定められています。
commentaryOsaka:
  - 一つの組織にいろんな仕事を任せる時は、その中身をちゃんと箇条書きにしとかんと、あとで「それ誰の仕事やったっけ」ってなってまうやろ。第6条は、国際度量衡局が実際に何をする場所なんかを、六つの項目に分けて具体的に書き出しとる条文やねん。
  - 例えばな、ダイキが所属するオーケストラ部で、演奏会の前にはかならず「基準の音叉」を使って、全員の楽器の音程を合わせる作業をするんや。バイオリン担当もフルート担当も、まずはこの一本の音叉を基準にして、自分の楽器をチューニングし直す。時々は楽器そのものの精度も確認せなあかんし、新しく入った一年生の楽器と先輩の楽器を見比べることもある。基準がぶれてしもたら、演奏全体が台無しになってまうからな。第6条が局に任せとる六つの仕事も、これと似た発想でな、新しい原器同士の比較・検定、原器の保管、各国の標準器との定期比較、メートル法とちゃう単位の基準との比較、測地用の道具の封印と比較、それに頼まれた標準器の検定と、とにかく「基準がずれてへんか、常にチェックし続ける」いう役目を担っとるんやで。
  - 実は日本も無関係やないんやで。明治政府がこの条約に加わったあと、フランスからはるばる海を渡って、日本専用の原器が届いたことがあってん。メートルの原器には「No.22」、キログラムの原器には「No.6」いう、まるで工業製品みたいな管理番号までついとって、これが長いこと日本国内の長さと重さのお手本として大事に使われてきたんや。第6条にある「国家標準の比較」いう仕事があったからこそ、海の向こうの物差しと日本の物差しが、ちゃんと同じ目盛りでつながっとるいうわけやねん。遠いヨーロッパの話に見えて、実は日本の暮らしとも地続きの条文なんやで。
