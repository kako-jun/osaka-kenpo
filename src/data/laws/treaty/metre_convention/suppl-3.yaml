article: suppl-3
title: 附則第3条
titleOsaka: ''
originalText:
  - It shall be the duty of the international committee mentioned in article 3 of the convention, and composed as provided in article 8 of the regulations, to receive and compare the new prototypes one with the other, in accordance with the scientific decisions of the international commission of 1872, and of its permanent committee.
  - Such modifications may, however, be made as may in future be suggested by experience.
osakaText:
  - 条約第3条に出てくる国際委員会、つまり規則第8条にしたがって構成される委員会はな、新しい原器を受け取って、それぞれを比較する仕事を担うことになっとるんやで。その作業は、1872年の国際委員会とその常任委員会が下した科学的な決定にしたがっておこなわれることになっとるんや。
  - ただし、今後の経験によって提案されるような見直しは、おこなうことができることになっとるんやねん。
commentary:
  - この条文は、条約本文第3条・規則第8条で定められた国際委員会に対して、新原器を受け取り相互に比較する作業を、1872年の国際委員会とその常任委員会がすでに下していた科学的決定にしたがって実施する義務を課すとともに、今後の経験にもとづく見直しの余地も認めています。
  - この条文は、条約発効によって新たに発足する国際委員会が、白紙の状態から原器の比較検定方法を一から決め直すのではなく、1872年委員会がすでに積み重ねてきた科学的な知見と決定を、そのまま引き継いで作業を進めることを義務づけるものです。これにより、条約体制への移行によって、それまでの科学的な蓄積が失われることを防いでいます。
  - 例えば、原器の材質や合金の配合比率、測定精度の基準などについて、1872年委員会がすでに科学的な検討を重ねて一定の方針を固めていた場合、新設された国際委員会はその方針を尊重しつつ比較検定作業を進める必要がありました。ただし、実際に作業を進める中で新たな知見が得られたり、想定していなかった問題が見つかったりした場合には、当初の方針に固執せず、経験にもとづいて柔軟に見直すことも認められています。
  - この「継続を原則としつつ、経験による見直しも許容する」という姿勢は、附則第1条・第2条で確認された1872年委員会からの継続性の尊重と、規則第9条で定められた国際委員会自身による検定作業の指揮権限とをつなぐ、実務上の橋渡しの規定になっています。
commentaryOsaka:
  - 前の担当者が積み上げてきたノウハウを、引き継いだ後の担当者がゼロから作り直しとったら、時間も労力ももったいないもんやろ。
  - この条文はな、条約によって新しくできる国際委員会に対して、新しい原器を受け取って比較する仕事を、1872年からあった国際委員会とその常任委員会がすでに決めとった科学的な方針にしたがって進めなあかんことを決めとるんや。ただし、実際にやってみて経験から気づいたことがあれば、見直すこともできることになっとるんやで。
  - 例えばな、Aさんが所属する料理研究会が、先輩たちが何年もかけて磨き上げてきたレシピと調理手順を引き継いで、新しく発足した後輩チームがそのレシピどおりに調理を続けることになってん。ゼロから自己流のやり方に変えてしまうんやのうて、まずは先輩たちの積み重ねてきたノウハウを尊重して進めることにしとったんや。せやけど、実際に作ってみて「この工程はこう変えたほうがもっとおいしくなる」って気づいたことがあれば、経験にもとづいて少しずつ改良していくことも認められとったんやって。この条文の国際委員会も、それとよう似とってな、前の委員会の科学的な蓄積を尊重しつつ、経験による柔軟な見直しも許されとるんやで。
  - 過去の蓄積を尊重しながらも、頑固に守り続けるだけやのうて、経験から学んで見直す余地も残しとる。このバランス感覚が、科学的な作業を長く続けていくうえで大事なんやろな。
