article: 4
title: 第4条
titleOsaka: ''
originalText:
  - The general conference for weights and measures shall be presided over by the president for the time being of the Paris Academy of Sciences.
osakaText:
  - 国際度量衡総会の議長は、そのときどきのパリ科学アカデミー会長さんが務めるんやて。
commentary:
  - この条文は、国際度量衡総会(CGPM)の議長を、その時々のパリ科学アカデミー(Académie des Sciences)の会長が務めることを定めた規定です。国際的な条約機関の議長職を、特定の国の学術機関の長に固定的に結び付けている点が特徴的です。
  - パリ科学アカデミーは、メートル法そのものの生みの親と言える存在です。メートル法は1790年代のフランス革命期に、地球子午線の長さを基準として制定されましたが、その基準の設定や測量事業を主導したのがこのアカデミーの科学者たちでした。メートル条約が締結された1875年の時点でも、度量衡に関する科学的権威としてパリ科学アカデミーの存在感は大きく、国際度量衡局をパリに置く決定とあわせて、総会議長をアカデミー会長が務めるという規定が置かれたのは自然な流れでした。
  - 例えば、ある年の総会で単位の定義変更が議題になったとき、その議事進行を取り仕切るのは、その年のパリ科学アカデミー会長です。会長は特定の政治的立場を代表するのではなく、フランスの学術界における最高権威という立場から、中立的に会議を進行する役割を期待されています。
  - このように議長職をフランスの学術機関に委ねる仕組みは、国際度量衡局の所在地をパリと定めた第1条、その建物の確保をフランス政府の責務とした第2条とあわせて、フランスがこの条約体制において特別な役割を担っていることを示す一連の規定の一部となっています。
commentaryOsaka:
  - 大事な会議のトップに誰を据えるかで、その会議の重みって結構変わってくるもんやで。第4条は、国際度量衡総会いう会議を、誰が仕切るんかを決めとる、実はシンプルな条文やねん。
  - 例えばな、アヤカの通う中学校で、毎年恒例の球技大会があるとするやろ。この大会の実行委員長は、いつも決まって体育の先生が務めることになっとるんや。誰か特定の人の名前で決まっとるんやのうて、「その年の体育主任」いう役職で決まっとるから、担当の先生が変わっても大会の格式は保たれるんやな。第4条もこれと同じ発想でな、総会の議長を「その時々のパリ科学アカデミー会長」いう役職で指定しとるから、会長が代替わりしても議長の座は自動的に引き継がれていくことになるんやで。
  - なんでほかのどこでもなくパリ科学アカデミーやったんか、ちょっと考えてみてほしいんやけど、答えは「そもそもメートルを作った張本人やから」っちゅうことなんや。フランス革命の頃、地球の子午線をもとに新しい単位を割り出す大仕事をやってのけたんが、まさにこのアカデミーの科学者たちやってん。生みの親に議長役を任せる、いうんは筋の通った話やろ。第3条で出てきた総会いう組織に、第4条で「誰がトップに立つんか」いう具体的な人事の話を付け加えとる、いう構成になっとるんやで。
