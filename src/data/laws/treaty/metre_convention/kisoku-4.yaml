article: kisoku-4
title: 規則第4条
titleOsaka: ''
originalText:
  - The international committee shall cause the necessary instruments to be constructed, such as comparators for the standards of line and end measures, apparatus for the determination of absolute dilatations, balances for weighing in air and in vacuo, comparators for geodetic measuring-bars, &c.
osakaText:
  - 国際委員会はな、必要な測定器具を作らせなあかんことになっとるんやで。線度器や端度器の標準を比べる比較器、熱で物がどれくらい伸び縮みするかを調べる装置、空気中や真空中で重さを量る天秤、測量に使う長い棒を比べる比較器なんかが、その例として挙げられとるんや。
commentary:
  - この条文は、国際度量衡局が原器の比較・検定作業を行うために必要な各種測定機器の製作を、国際委員会の責任で進めることを定めたものです。線度標準・端度標準用の比較器、絶対膨張率測定装置、真空中・空気中両用の精密天秤、測地測量用の比較器などが具体例として挙げられています。
  - メートル原器には、両端の面と面の間の距離を基準とする「端度器」と、目盛り線と線の間の距離を基準とする「線度器」の二種類の測定方式があり、それぞれに対応した専用の比較器が必要でした。また、温度変化による金属の膨張率を精密に把握することは、異なる温度環境で測定された値を同一基準に補正するために不可欠であり、真空中と空気中の両方で重さを測れる天秤は、空気の浮力による誤差を排除した精密な質量比較を可能にするものでした。
  - 例えば、ある国で測地測量に使われている測定棒を国際基準と比較検定する場合、専用の測地測量用比較器がなければ、そもそも精密な比較自体が成立しません。この条文が具体的な機器の種類を列挙しているのは、国際度量衡局が単に原器を保管するだけの倉庫ではなく、実際に高精度の科学的検定作業を行う研究機関として機能することを、条約の段階から明確に想定していたことを示しています。
  - こうした機器の製作・据え付けにかかる費用は、次の規則第5条で定められる建物と機器を合わせた総額の上限規定の対象となっており、限られた予算の中で、原器管理に真に必要な機器から優先的に整備が進められました。
commentaryOsaka:
  - 「物差し」いうても、それを正しいかどうか確かめるための「物差しを測る道具」がまた別に要るんやで。ちょっとややこしい話やけど、大事なことやねん。
  - この条文はな、国際度量衡局が原器を比べたり検定したりするために必要な、専用の測定器具をちゃんと作らせることを、国際委員会の仕事として決めとるんや。線度器や端度器を比べる比較器、熱で物がどれくらい膨張するかを調べる装置、空気中と真空中の両方で使える精密な天秤、測量用の長い棒を比べる比較器なんかが、具体的な例として挙げられとるんやで。
  - 例えばな、Aさんが所属する陸上部が、新しく買うたストップウォッチが正確かどうかを確かめたいと思ったとするやろ。ただ目で見て「たぶん合ってるやろ」って済ますわけにはいかへんから、公式に時間の基準となる時計と並べて、どれくらいズレがあるかをちゃんと測る専用の道具が必要になるんや。この条文の国際委員会も、それとよう似とってな、原器そのものだけやのうて、その原器を正確に比べたり検定したりするための専用の器具まで、ちゃんと用意させることになっとるんやで。
  - どんなに立派な原器を作っても、それを正しく測る道具がなかったら宝の持ち腐れになってまう。この条文は、原器を「守る」だけやのうて「使いこなす」ための道具立てまで、ちゃんと視野に入れとるところがポイントやねん。
