article: kisoku-1
title: 規則第1条
titleOsaka: ''
originalText:
  - The international bureau of weights and measures shall be established in a special building, possessing all the necessary safeguards of stillness and stability.
  - It shall comprise, in addition to the vault, which shall be devoted to the safe-keeping of the prototypes, rooms for mounting the comparators and balances; a laboratory, a library, a room for the archives, work-rooms for the employés, and lodgings for the watchmen and attendants.
osakaText:
  - 国際度量衡局はな、揺れたり傾いたりせえへんように、しっかり対策された専用の建物に置かなあかんことになっとるんやで。建物の中には、原器を安全に保管する金庫室のほかに、比較器や天秤を組み立てる部屋、実験室、図書室、記録を保存する部屋、職員の作業部屋、それに警備員や係員の住まいまで揃えなあかんのやねん。
commentary:
  - この条文は、国際度量衡局を設置する建物について、静けさと安定性を備えた特別な建物とすること、そしてその建物には原器保管用の金庫室のほか、比較作業用の部屋・実験室・図書室・記録保管室・職員用の作業部屋・警備員や係員の住まいまで含めることを定めています。
  - メートルとキログラムの国際原器は、わずかな振動や温度変化でも計測値に誤差が生じかねない、極めて精密な測定の基準です。そのため、単なる事務所ではなく、地盤の揺れや交通振動から隔離された「静けさと安定性」を備えた専用施設であることが、条約の段階からあらかじめ要求されていました。
  - 例えば、原器の比較作業には温度変化にきわめて敏感な精密天秤や比較器が用いられるため、人通りの多い市街地の建物では、わずかな地面の振動すら測定誤差の原因になりかねません。この条文が単なる「事務所」ではなく金庫室・実験室・図書室・住み込みの警備員用の部屋までを備えた総合施設を求めているのは、原器の管理と科学的な測定作業を一つの建物内で完結させ、外部からの影響を最小限に抑えるためです。
  - 実際にこの規定に基づいて用意されたのが、条約第2条でフランス政府に整備が委ねられた建物であり、後にパリ近郊セーヴルのブルトゥイユ館が国際度量衡局の本拠地として選ばれることになります。
commentaryOsaka:
  - 大事な物差しをしまう場所やのに、ただの倉庫でええわけないよな。ちょっとの振動でも狂ってしまうような繊細な代物やったら、なおさらのことやろ。
  - この条文はな、国際度量衡局を入れる建物そのものについての決まりやねん。地震とか交通の振動とかで揺れたりせえへん、しっかり安定した特別な建物にせなあかんのやで。そんで、ただ原器をしまう金庫室があったらええいうわけやのうて、比較器や天秤を組み立てる部屋、実験室、図書室、記録をしまう部屋、職員が働く部屋、それに警備員が住み込みで働けるような部屋まで、ぜんぶ揃えなあかんことになっとるんや。
  - 例えばな、Aさんが通う学校に、天体観測用の高性能望遠鏡が新しく入ることになってん。でも設置場所が、廊下の突き当たりの物置みたいなとこやったら、生徒が通るたびの振動でレンズがずれてしまうし、湿気で機材も傷んでまうやろ。そこで学校は、校舎から少し離れた、人通りが少なくて地盤もしっかりした場所に、専用の観測小屋を建てることにしてん。この条文の国際度量衡局も、まさにこの観測小屋とおんなじ発想でな、繊細な原器を守るために、専用でしっかりした建物をあらかじめ用意しとくことになっとるんやで。
  - 建物の中身まで細かく決めとるいうんは、それだけ原器の管理が神経質な仕事やったいうことの表れやねん。金庫室だけやのうて、実験室や図書室、職員の生活の場まで含めた「一つの拠点」として設計されとるんが、この条文のポイントやで。
