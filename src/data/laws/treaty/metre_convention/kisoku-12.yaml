article: kisoku-12
title: 規則第12条
titleOsaka: ''
originalText:
  - Questions upon which a vote is taken in the committee shall be decided by a majority of the votes cast. In case of a tie, the vote of the chairman shall decide. No resolution shall be considered to have been duly adopted unless the number of members present be at least equal to a majority of the members composing the committee.
  - This condition being fulfilled, absent members shall have the right to authorize members who are present to vote for them, and the members thus authorized shall furnish proper evidence of their authorization. The same shall be the case in elections by secret ballot.
osakaText:
  - 委員会で投票にかけられた問題はな、投じられた票の多数決で決まることになっとるんやで。もし票が同数になったときは、議長の一票で決まるんや。そんで、委員会を構成するメンバーの過半数が出席してへんかったら、そもそも決議が正式に成立したとは見なされへんことになっとるんやで。
  - この出席の条件さえ満たされとったらな、欠席しとるメンバーは、出席しとるメンバーに自分の代わりに投票してもらう権利を持っとるんや。そうやって代理を頼まれたメンバーは、ちゃんと委任されたことを証明する書類を用意せなあかんのやで。これは秘密投票による選挙のときも、同じ扱いになるんやねん。
commentary:
  - この条文は、国際委員会の議決方法について、投票の多数決で決定すること、同数の場合は議長の一票で決すること、決議の成立には委員の過半数の出席が必要であること、そして出席条件が満たされていれば、欠席委員が出席委員に投票を委任できることを定めています。
  - 委員会の決議に一定数以上の出席を求める定足数の規定は、少数の出席者だけで重要な決定が下されてしまうことを防ぐための基本的な仕組みです。一方で、遠隔地に住む委員が毎回必ず出席することが難しいという現実的な事情にも配慮し、委任による代理投票を認めることで、定足数を満たしつつ、より多くの委員の意思を決議に反映できるようにしています。
  - 例えば、14人の委員のうち出席者が7人にとどまり、ちょうど過半数という条件をぎりぎり満たしている場合、その場にいない残りの委員のうち何人かが、出席している委員に自分の票を託すことで、実質的により多くの委員の意向を決議に反映させることができました。委任にあたっては、正式な委任の証拠を示すことが求められており、なりすましや無断代理を防ぐ配慮もなされています。
  - この代理投票の仕組みは、秘密投票による選挙にも適用されるとされており、規則第10条で定める議長・書記の選出や、規則第17条で定める局長・次長の選出といった重要な人事決定においても、遠隔地の委員の意思が反映される道が確保されていることがわかります。
commentaryOsaka:
  - 会議で大事なことを決めるとき、その場におる人だけで多数決してもうて、ほんまにみんなの意見を反映できとるんかな、って思うことあるやろ。
  - この条文はな、委員会での投票の決め方を定めとるんや。基本は多数決で、票が同数やったら議長の一票で決まる。そんで、委員会のメンバーの半分以上が出席してへんかったら、そもそも決議として成立せえへんことになっとるんやで。この出席の条件さえ満たしとったら、欠席したメンバーは、出席しとる誰かに「自分の代わりに投票して」って頼む権利があって、頼まれた人はちゃんとその証拠を示さなあかんことになっとるんや。これは秘密投票の選挙のときも同じやねんな。
  - 例えばな、Aさんが所属するマンションの管理組合の総会で、遠方に引っ越した住民が、どうしても総会に出席でけへんことがあってん。でも意見を全く反映できへんのは不公平やから、管理組合の規約では、出席でけへん住民が、他の出席する住民に「自分の代わりに賛成か反対か投票してほしい」って委任できることになっとったんや。委任するときは、ちゃんと委任状を書いて渡さなあかんかったんやって。この条文の国際委員会も、それとよう似とってな、出席でけへん委員の意見も、委任を通じてちゃんと決議に反映できる仕組みになっとるんやで。
  - 過半数の出席いう最低限のハードルを守りつつ、遠くの委員の声も委任で拾い上げる。この両方のバランスを取っとるところが、この条文のよう考えられたところやと思うわ。
