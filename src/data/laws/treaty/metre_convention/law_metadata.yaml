name: メートル条約
shortName: メートル条約
badge: メートルが同じ！
year: 1875
source: Convention du Mètre (1875年5月20日署名) - 英語版は米国政府公式文書より
sourceUrl: https://en.wikisource.org/wiki/Metre_Convention
description: 長さと重さの測定単位を国際的に統一するための条約。メートル法の国際標準を確立し、国際度量衡局（BIPM）を設立。今も60カ国以上が加盟し、世界中で「1メートル」「1キログラム」が同じ長さ・重さを表す基盤となっている。原文は3部構成（条約本文14条、付属規則22条、経過規定6条）の全42条からなり、当サイトはこれを全条収録。条約本文（第1〜14条）に続き、運営組織や原器管理の実務を定めた付属規則（規則第1〜22条）、条約発効前後の引き継ぎ措置を定めた経過規定（附則第1〜6条）を収録している。
