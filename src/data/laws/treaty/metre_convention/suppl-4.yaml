article: suppl-4
title: 附則第4条
titleOsaka: ''
originalText:
  - The French section of the international commission of 1872 shall continue to have charge of the labors intrusted to it in the construction of the new prototypes, with the co-operation of the international committee.
osakaText:
  - 1872年の国際委員会のフランス人部会はな、新しい原器を作る仕事について、それまで任されとった作業を、引き続き担当することになっとるんやで。そのときは、国際委員会と協力しながら進めることになっとるんやねん。
commentary:
  - この条文は、1872年の国際メートル委員会に設けられていたフランス人部会が、新原器の製作作業について、条約発効後も国際委員会と協力しながら引き続き担当することを定めています。
  - 新原器の製作は、白金とイリジウムの合金を精密に鋳造・加工するという、当時の最先端の冶金技術を要する作業でした。フランス人部会は、条約成立以前からこの製作作業に直接携わり、必要な技術や設備、職人的な経験を蓄積してきた実働部隊であり、条約が発効したからといって、その実務能力をゼロから別の主体に引き継がせることは非効率でした。
  - 例えば、原器に使う合金の配合比率の調整や、鋳造後の精密な研磨作業といった、高度に専門的な工程は、フランス人部会がそれまで培ってきた技術によって進められ、新設された国際委員会は、その作業結果を科学的に検証し、方針を協議する立場として協力する形が取られました。実務を担う部隊と、それを監督・検証する委員会という役割分担が、条約体制への移行後も維持されたのです。
  - この条文は、附則第3条で定められた「1872年委員会の科学的決定を引き継ぐ」という原則を、実際の製作作業を担う人材・組織のレベルにまで具体化したものであり、附則第5条で定められる製作費用の精算の仕組みとあわせて、原器製作という一大プロジェクトが、条約体制への移行期にも途切れることなく進められるよう配慮されていたことがわかります。
commentaryOsaka:
  - 難しい技術がいる作業は、それまで実際に手を動かしてきた人らに、そのまま続けてもらうのがいちばん確実やもんな。
  - この条文はな、1872年の国際委員会にあったフランス人部会について定めとるんや。新しい原器を作る仕事は、それまでフランス人部会が任されとった作業やってんけど、条約ができた後も、国際委員会と協力しながら、引き続きこのフランス人部会が担当することになっとるんやで。
  - 例えばな、Aさんが所属する陶芸サークルで、特別な技法を使う大皿の制作を、以前から担当しとった熟練の職人さんに任せとったんやって。サークルの運営体制が新しくなって、正式な会則を持つ団体に生まれ変わった後も、「この大皿の制作だけは、これまでどおり同じ職人さんに、新しい運営委員会と相談しながら続けてもらう」いう形を取ることにしてん。せっかく培われた技術と経験を、体制が変わったからいうて手放すんはもったいないからやな。この条文のフランス人部会も、それとよう似とってな、専門的な製作作業は、それまでの実働部隊にそのまま任せて、新しい委員会とは協力関係を築く形になっとるんやで。
  - 「決める仕事」と「実際に作る仕事」を分けて、それぞれに強みのある主体に任せる。この役割分担が、原器製作という難しいプロジェクトを成功に導いた一因やったんやろな。
