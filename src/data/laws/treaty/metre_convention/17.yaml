article: 17
title: 第17条（付属規則）
titleOsaka: ''
originalText:
  - The director of the bureau and the adjuncts shall be chosen by the international committee by secret ballot.
  - The employés shall be appointed by the director.
  - The director shall have a right to take part in the deliberations of the committee.
osakaText:
  - 局の局長と次長はな、国際委員会の秘密投票によって選ばれるんやで。局の職員については、局長が任命することになっとるんやねん。そんで局長には、委員会の審議に参加する権利が認められとるんやで。
commentary:
  - この条文は、国際度量衡局の局長と次長は国際度量衡委員会の秘密投票によって選出され、職員は局長が任命することを定めています。また、局長には委員会の審議に参加する権利が認められています。
  - 局長・次長という局の中枢を担う人事を、委員会による秘密投票という形式で決定することとしたのは、特定の国の政治的な圧力や駆け引きによって人選が左右されることを防ぎ、科学的な能力と中立性を重視した人事を行うための工夫だったと考えられます。一方で、日常的な職員の採用については局長の裁量に委ねることで、組織運営の実務的な機動性も確保されています。
  - 例えば、国際度量衡局の初代局長には、イタリア人物理学者のジルベルト・ゴーヴィ(Gilberto Govi)が委員会の秘密投票によって選出されました。局長は単に選ばれて業務を執行するだけの立場ではなく、自らを選んだ委員会の審議にも参加できるとされている点が特徴的で、実務の最前線にいる局長の知見が、委員会の意思決定にも反映される仕組みになっています。
  - この局長選出の手続きは、第7条で定められた局の人員構成(局長・次長2名・職員)や、第15条で定められた委員会自身の欠員補充の方法とあわせて、条約全体の人事に関する規定群を構成しています。
commentaryOsaka:
  - チームのキャプテンを選ぶとき、誰に投票したか周りにバレんように紙に書いて箱に入れる、いうやり方したことあるやろ？あれ、実は結構重要な意味があるんやで。
  - この条文はな、局のトップを決める方法と、そのあとの人事の権限を分けて書いとるんや。局長と次長は、委員会が秘密投票で選ぶことになっとる。誰がどっちに入れたか分からへんようにするんは、投票する人らが余計な気ぃ遣わんと、ほんまにこの人がええ思う人に投票できるようにするためやねんな。そんで、局長が決まったら、今度はその下で働く職員を選ぶ権限は局長自身に任されるんやで。おもろいのはここからでな、局長は委員会に選ばれる側の立場やのに、選んだあとの委員会の話し合いにも、ちゃんと参加する権利を持っとるんや。
  - 例えばな、しんじくんが入っとる野球チームで、キャプテンを秘密投票で選ぶことになってん。投票の結果、しんじくんがキャプテンに選ばれてん。キャプテンに決まったあと、副キャプテンとか道具係とかの役割は、しんじくんが自分でメンバーに声をかけて決めることになってん。そんでしんじくんはキャプテンやから、ふだんは監督やコーチだけの作戦会議にも、特別に参加させてもらえることになってん。この条文の局長の立場も、それとよう似とってな、委員会に選ばれる側でありながら、委員会の話し合いにも加わる、いう二つの顔を持っとるんやで。
  - ちなみに、しんじくんの話は架空やけど、局長選びの方は実話でな、イタリア人の物理学者はんが記念すべき初代局長の座に投票で選ばれとるんや。秘密投票で選ばれたトップが、自分のチームを作りつつ委員会の一員としても発言できる、いうこの仕組みは、組織を機能させるためのようできた工夫やと思うわ。
