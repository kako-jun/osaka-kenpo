article: 14
title: 第14条
titleOsaka: ''
originalText:
  - This Convention shall be ratified according to the constitutional laws of each state, and the ratifications shall be exchanged in Paris within six months, or sooner, if possible.
  - It shall take effect on the first day of January, 1876.
osakaText:
  - この条約はな、それぞれの国の憲法上の手続きにしたがって批准されなあかんのや。批准書は、できればもっと早く、遅くとも6か月以内にパリで交換されるんやねん。この条約は、1876年1月1日から効力を持つことになるんやで。
commentary:
  - この条文は、メートル条約の批准手続きと発効日を定めたものです。条約は各締約国の憲法上の手続きに従って批准され、批准書はパリにおいて6か月以内、可能であればそれより早く交換されることとされ、条約自体は1876年1月1日に効力を生じると規定されています。
  - メートル条約は1875年5月20日にパリで署名されましたが、署名それ自体は各国の代表者による合意の意思表示にすぎず、実際に条約が法的拘束力を持つためには、各国の国内手続きに従った批准と、批准書の交換という追加の手続きが必要でした。この条文が「6か月以内」という比較的短い期間を区切っていたことは、署名から半年余りで発効させるという、当時としてはスピーディーな条約発効を意図していたことをうかがわせます。
  - 例えば、ある締約国の議会が条約の批准を審議し、承認する手続きには数か月を要することもありましたが、この条文の定めによって、遅くとも1875年11月頃までにはパリで批准書の交換を済ませることが求められました。実際に条約は予定通り1876年1月1日に発効し、この日付が国際度量衡局の活動開始の起点となっています。
  - このように発効日を明確に固定したことで、第9条以下で定められた分担金の年次払い込みや、第13条で定められた12年間の離脱猶予期間の起算点も、すべてこの1876年1月1日を基準として計算されることになります。
commentaryOsaka:
  - 約束事ってな、決めた日にすぐ始まるとは限らへんやろ？これ、来月から始めます、いうこと、よくあるがな。
  - この条文はな、条約が実際に効き始めるまでの手続きを決めとるんや。それぞれの国にはそれぞれの憲法上のやり方があるから、まずは自分の国のルールにしたがって条約を認める手続き、つまり批准をせなあかんのやで。そんで、批准したいう証拠になる書類を、パリに集まって交換するんや。これは6か月以内、できるんやったらもっと早めにするんが望ましいとされとるんやで。そうやって手続きが整った上で、1876年1月1日から、この条約は実際に効力を持つことになるんやな。
  - 例えばな、たけしくんが住んどる町内会で、新しいゴミ出しのルールを決めることになってん。会長さんが案を出して、みんな、ええな、とは思っとるんやけど、実際にスタートさせるには、まず各班の班会でそれぞれ了承をとって、その結果を町内会館に報告せなあかんのや。そんで、全部の班からの了承が集まって、あらかじめ決めといた4月1日になったら、いっせいに新しいルールが始まるんやで。この条約の批准と発効の関係も、それとよう似とってな、各国がそれぞれのやり方で認めて、その証拠をパリで集めて、決まった日に一斉に効力を持つようになっとるんや。
  - 批准するタイミングは国によってばらばらでも、効力が始まる日はちゃんと1876年1月1日とはっきり決まっとる。これのおかげで、どの国が早く手続きしても遅く手続きしても、みんな同じ日からスタートを切れるようになっとるんやで。
