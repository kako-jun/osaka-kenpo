article: 9
title: 第9条
titleOsaka: ''
originalText:
  - The entire expense of the construction and outfit of the international bureau of weights and measures, together with the annual cost of its maintenance and the expenses of the committee, shall be defrayed by contributions from the contracting states, the amount of which shall be computed in proportion to the actual population of each.
osakaText:
  - 国際度量衡局の建設と設備にかかる費用は全部、それに毎年の維持費や委員会の経費も合わせて、締約国からの分担金でまかなわれることになっとる。その金額は、それぞれの国の実際の人口に応じて計算されるんやな。
commentary:
  - この条文は、国際度量衡局の建設・設備にかかる全費用、および局の年間維持費と委員会の経費を、締約国からの分担金でまかなうことを定めたものです。分担金の額は、各国の実際の人口に比例して算出されるという、当時としては合理的かつ公平性を重視した基準が採用されています。
  - 人口比例という分担方式は、国力や経済規模ではなく人口という客観的で測定しやすい指標を用いています。国によって経済発展の度合いに大きな差があった当時、国内総生産のような経済指標を基準にすると算定や合意が難しかったであろうことを考えると、人口という指標は各国が比較的納得しやすい落とし所だったと考えられます。
  - 例えば、原署名国のうちフランスやドイツ、ロシアのように人口の多い国は相応に大きな分担金を負担し、逆に人口の少ない国は少ない負担で条約に参加できました。この仕組みによって、大国だけが局を独占的に運営するのではなく、参加国すべてが応分の負担のもとで対等に関与できる国際機関としての性格が保たれたのです。
  - 分担金の具体的な納付方法については第10条で、新たに条約に加盟する国の分担金については第11条で、それぞれ続けて定められています。
commentaryOsaka:
  - 何人かでお金を出し合う時、みんな同じ額を払うのが公平とは限らへんやろ。人数が多いとこと少ないとこが、同じ金額を払わされたら、それはそれで不満が出てきそうやんな。第9条は、国際度量衡局にかかるお金を、締約国みんなでどうやって分担するんかを定めとる条文やねん。
  - 例えばな、マンションの何軒かの世帯で、共用の庭の水やり用ホースを新しく買い替えることになったとするやろ。一人暮らしのマナミの部屋も、家族五人で住んどるソウタの家も、みんな同じ金額をきっちり均等に払うんは、なんや不公平な感じがせえへんか。そこでマンションの管理組合が、各世帯の人数に応じて負担額を決めることにしたんや。人数の多い世帯はちょっと多めに、少ない世帯はちょっと少なめに、いう按分方式やな。第9条が定めとる分担金の考え方もこれと同じでな、局の建設費や設備費、それに毎年の維持費や委員会の経費まで含めて、締約国それぞれの実際の人口に比例させて金額を計算することになっとるんやで。
  - 人口が多い国ほど、それだけ度量衡の恩恵を受ける国民の数も多いはずやから、負担も多めに、いう考え方は筋が通っとるように思うわ。第1条で「共同の費用で」言うてたふわっとした約束を、第9条でここまで具体的な計算方法にまで落とし込んどる、いう意味では、この条文は9条全体のいわば締めくくりにあたる部分とも言えるんやで。
