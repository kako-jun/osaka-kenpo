article: 1
title: 第1条
titleOsaka: ''
originalText:
  - The high contracting parties engage to establish and maintain, at their common expense, a scientific and permanent international bureau of weights and measures, the location of which shall be at Paris.
osakaText: []
commentary:
  - この条文は、メートル条約の出発点となる規定で、締約国が共同の費用によって、科学的かつ恒久的な国際度量衡機関をパリに設立し、維持することを約束するものです。ここで定められた機関が、のちの国際度量衡局(BIPM, Bureau International des Poids et Mesures)であり、現在に至るまで国際単位系(SI)の基準を管理する中心機関となっています。
  - この条約は1875年5月20日にパリで署名されました。フランス、アメリカ、ドイツ、ロシアなど17カ国が原署名国となりましたが、日本はこの時点では署名しておらず、日本がメートル条約に加盟したのは10年後の1885年のことです。条約は第14条の定めにより、1876年1月1日に発効しました。産業革命以降、国際貿易や科学研究が急速に発展する中で、国ごとにばらばらの度量衡が使われている状態を放置できなくなったことが、この条約が生まれた背景にあります。
  - 例えば、19世紀当時、フランスはメートル法を採用していましたが、イギリスはヤード・ポンド法、ドイツやロシアには独自の伝統的な単位が残っていました。同じ「1フィート」でも国によって長さが微妙に異なるということも珍しくなく、国際的な科学実験の再現や貿易における取引量の確認に支障が出ていたのです。国際度量衡局という共通の物差しを管理する機関を設けることで、どの国の科学者や商人であっても、同じ基準で長さや質量を扱えるようにしたのがこの条文の狙いです。
  - なお、条文には所在地を「パリ」と定めていますが、実際に建設された国際度量衡局の庁舎は、パリ中心部ではなく、パリ近郊のセーヴル(Sèvres)にあるブルトゥイユ館(Pavillon de Breteuil)です。この建物をどのように確保するかについては、次の第2条でフランス政府の責務として具体的に定められています。
