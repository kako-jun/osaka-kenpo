article: kisoku-5
title: 規則第5条
titleOsaka: ''
originalText:
  - The entire expense incurred in the purchase or construction of the building, and in the purchase and placing of the instruments and apparatus, shall not exceed 400,000 francs.
osakaText:
  - 建物を買うたり建てたりする費用と、器具や装置を買うて据え付ける費用、これを全部合わせても、40万フランを超えたらあかんことになっとるんやで。
commentary:
  - この条文は、規則第1条から第4条までで定められた建物の取得・整備、および測定機器の製作・据え付けにかかる費用の総額について、40万フランという上限を設けたものです。
  - 国際度量衡局は締約国が共同で費用を負担する国際機関であるため、初期投資にかかる費用に歯止めをかけておくことは、多くの国に条約への参加を促すうえで重要な意味を持ちました。上限をあらかじめ明示しておくことで、各締約国は将来の分担金の見通しを立てやすくなり、予算の青天井な膨張に対する不安を取り除くことができます。
  - 例えば、建物の取得に予想以上の費用がかかった場合でも、機器の整備にまわせる予算がその分減ってしまうことになり、限られた40万フランの枠内でやりくりする必要がありました。この上限規定があることで、国際委員会は建物と機器のどちらを優先するかという判断を、常にこの予算制約の中で行わなければならず、無計画な支出の拡大が防がれる仕組みになっています。
  - この初期投資の上限とは別に、規則第6条では局の運営にかかる年間経費の見積もりと上限が定められており、初期の設備投資と、その後の継続的な運営費とが、条文上明確に区別して規律されていることがわかります。
commentaryOsaka:
  - どんなにええもん揃えたいと思っても、財布の中身には限りがあるもんやろ。この条文は、まさにその「上限」を先に決めとるんやで。
  - この条文はな、国際度量衡局の建物を用意したり、測定器具を揃えたりするのにかかる費用を全部合わせて、40万フランまでしか使うたらあかん、いう上限を決めとるんや。建物にお金をかけすぎたら器具の予算が減るし、器具にお金をかけすぎたら建物の予算が減る。そうやって全体の枠の中でやりくりせなあかんようになっとるんやで。
  - 例えばな、Aさんの家族が新しいマイホームを建てることになってん。土地代と建物代と家具代を全部合わせて、予算は3000万円までって家族会議で決めてん。ええ土地が見つかって予算をぎょうさん使いすぎたら、その分、家具にまわせるお金が減ってまうから、Aさんの家族は「どこにお金をかけるか」をよう相談しながら決めていったんやって。この条文の国際度量衡局の予算も、それとよう似とってな、建物と器具、両方合わせた総額の上限があらかじめ決まっとるから、優先順位をつけて計画的に使わなあかんようになっとるんやで。
  - 上限をあらかじめ決めとくいうんは、後になって「お金が全然足りひん」いうことにならんための、地味やけどほんまに大事な工夫やねん。締約国側からしても、いくらまでなら負担することになるんかが最初から分かっとったら、安心して条約に加われるいうもんやで。
