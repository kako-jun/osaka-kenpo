article: kisoku-20
title: 規則第20条
titleOsaka: ''
originalText:
  - The contributions referred to in article 9 of the convention shall be paid according to the following scale: The number representing the population, expressed in millions, shall be multiplied by the coefficient three for states in which the use of the metrical system is obligatory; by the coefficient two for those in which it is optional; by the coefficient one for other states.
  - The sum of the products thus obtained will furnish the number of units by which the total expense is to be divided. The quotient will give the amount of the unit of expense.
osakaText:
  - 条約第9条に出てくる分担金はな、次のような計算方法で決めることになっとるんやで。人口を百万人単位の数で表してな、メートル法を使うことが義務になっとる国は3倍、使うかどうか自由に選べる国は2倍、それ以外の国は1倍を、それぞれ掛け合わせることになっとるんや。
  - こうやって出した数字を全部の国で足し合わせると、全体の費用を割るための単位数が出てくるんやで。その全体の費用をこの単位数で割ったら、単位あたりの費用の金額が出てくることになっとるんやねん。
commentary:
  - この条文は、条約本文第9条で定められた締約国の分担金について、人口(百万人単位)にメートル法の採用状況に応じた係数(義務採用は3、任意採用は2、その他は1)を掛けて算出される各国の「単位数」を合計し、局の総経費をその合計単位数で割った「単位あたり費用」を基準に配分するという、具体的な計算方式を定めています。
  - この分担金方式の特徴は、単純な人口比例ではなく、メートル法の採用状況という政策的な要素を係数として組み込んでいる点にあります。メートル法をすでに義務的に採用している国は、条約の恩恵をより直接的に受ける立場にあるとみなされ、人口が同じでも未採用国の3倍の負担係数が課されることになります。
  - 例えば、人口2000万人でメートル法を義務採用している国は、2(百万人)×10×3=60単位を負担する計算になるのに対し、同じ人口でメートル法を採用していない国は2×10×1=20単位で済むことになります。この方式により、条約から受ける実利が大きい国ほど多くの費用を負担するという、応益負担の考え方が制度に組み込まれていました。
  - この分担金の計算単位は、規則第21条で定める国際原器・標準器の製作費用の負担割合や、規則第6条で定める局の年間運営予算の財源としても用いられており、条約体制の財政基盤全体を支える共通の物差しとして機能しています。
commentaryOsaka:
  - みんなで一つのもんを維持していくお金を出し合うとき、人数で単純に割るだけやのうて、「どれだけ恩恵を受けとるか」も考慮したほうが、みんな納得しやすいことがあるやろ。
  - この条文はな、締約国が払う分担金の計算方法を細かく決めとるんや。それぞれの国の人口を百万人単位の数字にしてな、メートル法を使うことが義務になっとる国は3倍、自由に選べる国は2倍、それ以外の国は1倍を掛け合わせる。そうやって出した数字を全部の国で合計して、局の総経費をその合計数で割ったら、単位あたりの費用が出てくる、いう計算方式やねんな。
  - 例えばな、Aさんが所属するマンションの管理組合で、修繕費の負担割合を単純に「世帯数で均等割り」にせんと、部屋の広さや、共用施設をよう使う住民かどうかも加味して決めることにしてん。広い部屋に住んどる人や、エレベーターをようけ使う上層階の住民は、少し多めに負担してもらう、いう具合や。人数だけで機械的に割るよりも、実際の使用状況に近い形で負担を決めたほうが、みんな納得しやすかったんやって。この条文の分担金計算も、それとよう似とってな、人口だけやのうて、メートル法をどれだけ活用しとるかいう実際の恩恵の大きさも加味して、負担を決めとるんやで。
  - 100年以上前の条約が、こういう「使う度合いに応じた負担」いう発想をすでに取り入れとったんは、なかなか先進的な工夫やったと思うわ。
