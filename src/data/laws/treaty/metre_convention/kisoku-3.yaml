article: kisoku-3
title: 規則第3条
titleOsaka: ''
originalText:
  - The French Government shall, at the request of the international committee, take the necessary measures to cause the bureau to be recognized as an establishment of public utility.
osakaText:
  - フランス政府はな、国際委員会から頼まれたら、国際度量衡局を「公益団体」として認めてもらうために必要な手続きをとらなあかんことになっとるんやで。
commentary:
  - この条文は、国際委員会の要請があった場合に、フランス政府が国際度量衡局をフランス国内法上の「公益団体(établissement d'utilité publique)」として認定するための措置を講じる義務を定めたものです。
  - 国際度量衡局は各国が共同で設立した国際機関ですが、実際の所在地はフランス国内にあり、建物や土地の権利関係、税制上の扱い、契約の締結能力など、日常的な運営の多くはフランス国内法の枠組みの中で処理する必要がありました。フランス国内法上の「公益団体」として認定されることで、法人としての権利能力や税制上の優遇措置など、組織運営に必要な法的基盤が整えられます。
  - 例えば、国際度量衡局が実験機材を購入したり、職員を雇用したり、建物の維持管理契約を結んだりする際、法的な主体として認められていなければ、契約の当事者になることすら難しくなります。公益団体としての認定を受けることで、国際度量衡局はフランス国内において独立した法的主体として活動できるようになり、国際機関としての実務的な安定性が確保されます。
  - この条文は、規則第1条・第2条で定められた建物の取得・整備という物理的な基盤づくりに続いて、国際度量衡局が組織として法的に活動できる基盤を整えるものであり、条約が単なる理念の表明にとどまらず、実際に機能する国際機関を作り上げるための細部にまで配慮していたことがうかがえます。
commentaryOsaka:
  - 国と国が集まって作った組織でも、実際に活動する国では、その国のルールにも乗っからなあかんことがあるんやで。
  - この条文はな、国際度量衡局が、フランスの中で正式な「公益団体」として認めてもらうための手続きを、フランス政府が引き受けなあかんことを決めとるんや。委員会から「頼むで」いう要請があったら、フランス政府はそのための必要な手続きをとらなあかんことになっとるんやな。
  - 例えばな、Aさんたちが近所の子どもらのために無料の学習支援サークルを立ち上げたとするやろ。でも、ただの仲良しグループのままやと、公民館の一室を正式に借りたり、寄付を受け取ったりするんが難しいことがあるんや。そこでAさんたちは、市役所に相談して、正式な「非営利団体」として登録してもらうことにしてん。そうすることで、施設を借りたり、周りから信頼してもらいやすくなったりしたんやって。この条文の国際度量衡局も、それとよう似とってな、国際的な組織ではあるけど、実際に活動するフランスの中でちゃんとした法的な立場を持てるように、公益団体として認めてもらう手続きを定めとるんやで。
  - どれだけ立派な理念で作られた組織でも、実際に活動する国での法的な立場がふらふらしとったら、契約一つ結ぶのも一苦労になってまう。この条文は、そういう地味やけど大事な足場を固める役目を果たしとるんやな。
