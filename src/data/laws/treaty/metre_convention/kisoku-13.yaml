article: kisoku-13
title: 規則第13条
titleOsaka: ''
originalText:
  - During the interval occurring between two sessions, the committee shall have the right to discuss questions by correspondence.
  - In such cases, in order that its resolutions may be considered to have been adopted in due form, it shall be necessary for all the members of the committee to have been called upon to express their opinions.
osakaText:
  - 総会と総会の間の期間でもな、委員会は書面でのやりとり、つまり通信の方法で問題を話し合う権利を持っとるんやで。
  - そういうときは、決議がちゃんと正式な形で採択されたと見なされるためにはな、委員会の全メンバーに対して、意見を述べるように呼びかけとかなあかんことになっとるんや。
commentary:
  - この条文は、国際委員会が会合と会合の間の期間においても、書面による通信の方法で議案を審議できること、そしてその場合には、委員会の全メンバーに意見表明の機会が与えられていることが、決議を正式に成立させるための条件であることを定めています。
  - 規則第11条で定められているとおり、委員会の会合は年一回、あるいは二年に一回程度しか開かれません。しかし、原器の管理や局の運営に関わる問題は、次の会合まで何か月も判断を先送りにできない場合もあります。この条文は、そうした会合の間隔の長さを補うために、書面による審議という代替手段をあらかじめ用意しています。
  - 例えば、局の運営上、緊急に判断を要する事案が会合と会合の間に発生した場合、委員会は臨時に全員を集めることが難しくても、書面でのやりとりによって審議を進めることができました。ただし、この方法で決議が正式なものと認められるためには、一部の委員だけで話を進めるのではなく、必ず全メンバーに対して意見を求める手続きを踏む必要があり、遠隔地にいる委員が議論から排除されることのないよう配慮されています。
  - この通信による審議の仕組みは、規則第14条で定める委員の欠員補充のための通信選挙とも共通する発想であり、対面での会合が難しい当時の通信事情の中で、委員会が機能を止めることなく意思決定を続けられるよう、条約全体を通じて整えられた実務的な工夫の一つです。
commentaryOsaka:
  - 次の集まりまで何か月も待っとったら手遅れになってまう、いう問題も世の中にはあるもんやろ。
  - この条文はな、総会と総会の間、つまり委員会が実際に集まってへん期間でも、書面でのやりとりで問題を話し合うてええことを決めとるんや。ただし、そうやって書面で決めたことが正式な決議として認められるためには、委員会のメンバー全員にちゃんと意見を聞くように呼びかけとかなあかんことになっとるんやで。一部の人だけでこっそり決めてしまうんは、あかんいうことやな。
  - 例えばな、Aさんが所属する町内会の役員会が、次の定例会議まで一か月も先やのに、急いで決めなあかん用事が出てきたことがあってん。そこで役員会は、みんなを無理に集めるんやのうて、グループチャットで議題を共有して、全員から意見をもらうことにしたんや。誰か一人だけに聞いて済ませるんやのうて、必ず役員全員に「どう思う?」って呼びかけて、返事をもらってから決めることにしとったんやって。この条文の国際委員会も、それとよう似とってな、会合の間の期間でも、全員に意見を聞いたうえでなら、書面でのやりとりで正式な決定ができる仕組みになっとるんやで。
  - 全員に呼びかけるいう手続きを踏まなあかんことで、一部の委員だけで話を進めてしまう、いう抜け道をふさいどるんやな。地味やけど、公平さを保つための大事な条件やと思うわ。
