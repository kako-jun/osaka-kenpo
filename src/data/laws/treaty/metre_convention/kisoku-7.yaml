article: kisoku-7
title: 規則第7条
titleOsaka: ''
originalText:
  - The general conference mentioned in article 3 of this convention shall be at Paris, upon the summons of the international committee, at least once every six years.
  - It shall be its duty to discuss and initiate measures necessary for the dissemination and improvement of the metrical system, and to pass upon such new fundamental metrological determinations as may have been made during the time when it was not in session. It shall receive the report of the international committee concerning the work that has been accomplished, and shall replace one-half of the international committee by secret ballot.
  - The voting in the general conference shall be by states; each state shall be entitled to one vote.
  - Each of the members of the international committee shall be entitled to a seat at the meetings of the conference. They may at the same time be delegates of their governments.
osakaText:
  - 条約第3条に出てくる総会はな、国際委員会が招集して、少なくとも6年に一回はパリで開かれることになっとるんやで。
  - 総会の仕事は、メートル法を広めたり改良したりするために必要な対策を話し合うて始めることと、総会が開かれてへん間に新しく決まった基本的な計量上の決定事項を承認することやねん。そんで、国際委員会がそれまでにやってきた仕事の報告を受け取って、委員会のメンバーの半分を秘密投票で入れ替えることにもなっとるんやで。
  - 総会での投票は国ごとにおこなわれてな、それぞれの国が一票ずつ持つことになっとるんや。
  - 国際委員会のメンバーは、みんな総会の会議に出席する権利があるんやで。しかもその人らは、同時に自分の国の代表としても出席できることになっとるんやねん。
commentary:
  - この条文は、条約本文第3条で言及されている国際度量衡総会について、国際委員会の招集により少なくとも6年に一度パリで開催されること、その職務としてメートル法の普及・改良策の審議、休会中の新たな計量学上の決定の承認、国際委員会からの活動報告の受領、委員会の半数の秘密投票による改選を行うこと、投票は各国一票の国別方式であること、そして委員会メンバーが総会にも出席でき、同時に自国の代表を兼ねることもできることを定めています。
  - 国際度量衡総会は、条約に加盟するすべての締約国が対等な立場で参加する、条約体制における最高意思決定機関としての性格を持ちます。日常的な運営や科学的な判断は少数精鋭の国際委員会に委ねる一方で、6年に一度は全締約国が集まり、大きな方針を確認し、委員会の半数を入れ替えることで、特定の委員による長期の権限独占を防ぐ仕組みになっています。
  - 例えば、ある国が独自の重要な計量学上の発見をした場合、その成果は総会が開かれるまで正式には承認されず、次回総会の場で締約国全体の合意という形で公式に取り入れられることになります。また、大国であっても小国であっても総会では平等に一票を持つとされている点は、資金拠出額に応じて委員会構成が調整される規則第20条の分担金規定とは異なる、総会における政治的な対等性を示すものです。
  - この6年ごとの定期開催という仕組みは、条約発効から現在に至るまで国際度量衡総会(CGPM)として継続しており、国際単位系(SI)の定義見直しなど、現代の計量学における重要な意思決定も、この条文が定めた枠組みの延長線上で行われています。
commentaryOsaka:
  - どんな組織でも、日々の実務を回す少人数のチームと、たまに集まって大きな方針を確認する全体会議と、両方が要るもんやんな。
  - この条文はな、条約に出てくる「総会」いう会議について、詳しいルールを決めとるんや。総会は国際委員会が招集して、少なくとも6年に一回はパリで開かなあかんことになっとる。総会の仕事は、メートル法を広めたり良くしたりする対策を話し合うことと、総会が開かれてへん間に新しく決まった科学的な決定を正式に認めることや。そんで、委員会からの報告を受け取って、委員会メンバーの半分を秘密投票で入れ替えることにもなっとるんやで。投票は国ごとに一票ずつやし、委員会のメンバーは総会にも出席できて、同時に自分の国の代表も兼ねられることになっとるんや。
  - 例えばな、Aさんが所属するテニス部で、普段の練習メニューや大会への出場選手は、部長と副部長からなる少人数の運営チームが日々決めとるんやって。でも、年に一回だけ、部員全員が集まる総会があってな、そこでは一年間の活動報告を聞いたり、来年の方針を話し合うたり、運営チームのメンバーを入れ替えたりするんや。総会での投票は一人一票で、誰であっても平等やねん。この条文の総会も、それとよう似とってな、普段の運営は少人数の国際委員会に任せつつ、数年に一回は全締約国が集まって大きな方針を確認し、メンバーを入れ替える仕組みになっとるんやで。
  - 6年に一回だけの会議やのに、国際単位系の土台となる重要な決定がこの総会を通じて積み重ねられてきたんやから、地味に見えてめっちゃ大事な仕組みやねんな。
