article: kisoku-10
title: 規則第10条
titleOsaka: ''
originalText:
  - The international committee shall choose its chairman and secretary by secret ballot. The governments of the high contracting parties shall be notified of the result of such elections.
  - The chairman and secretary of the committee, and the director of the bureau, must belong to different countries.
  - After having been formed, the committee shall hold no new elections and make no appointments until three months after notice thereof shall have been given to all the members by the bureau of the committee.
osakaText:
  - 国際委員会はな、議長と書記を秘密投票で選ぶことになっとるんやで。その選挙の結果は、締約国の政府にちゃんと知らされることになっとるんや。
  - 委員会の議長と書記、それに局の局長は、それぞれ違う国の出身やないとあかんことになっとるんやねん。
  - 委員会が発足した後はな、委員会の事務局が全メンバーに通知してから3か月経つまでは、新しい選挙も、新しい任命もできへんことになっとるんやで。
commentary:
  - この条文は、国際委員会が議長・書記を秘密投票で選出し、その結果を締約国政府に通知すること、議長・書記・局長の三者はそれぞれ異なる国の出身者でなければならないこと、そして委員会発足後は、全メンバーへの事前通知から3か月が経過するまで新たな選挙・任命を行えないことを定めています。
  - 議長・書記・局長という組織の中枢を担う三つの役職を、あえて異なる国の出身者で占めるよう義務づけているのは、特定の一国が国際度量衡局の運営を実質的に支配することを防ぐための工夫です。規則第8条で委員14人が異なる国に属さなければならないと定められているのと同じ発想が、より中枢に近い役職についても徹底されています。
  - 例えば、ある国の出身者がすでに委員会の議長を務めている場合、その同じ国の出身者が書記や局長に選ばれることは、この条文によって認められません。また、委員会が発足したばかりの段階でただちに新たな選挙や人事を行うことを禁じ、全メンバーへの事前通知から3か月という猶予期間を設けているのは、遠隔地にいる委員も含めて、拙速な決定にならないよう十分な準備期間を確保するためです。
  - この3か月という猶予期間の規定は、規則第13条で定められた「休会中の通信による意見聴取」の仕組みとも通じるものであり、委員会が対面で頻繁に集まれない当時の事情の中でも、性急な決定を避けて手続きの正当性を確保しようとする、条約全体に共通する慎重な姿勢を示しています。
commentaryOsaka:
  - トップの役職を、みんな同じ出身の人で固めてしもたら、周りから公平に見えへんようになってまうことってあるやろ。
  - この条文はな、国際委員会が議長と書記を秘密投票で選ぶこと、その結果を締約国政府に知らせることを決めとるんや。そんで、議長と書記、それに局長の三つの役職は、それぞれ違う国の出身者やないとあかんことになっとるんやで。委員会が発足したすぐ後は、全メンバーに知らせてから3か月経つまでは、新しい選挙も任命もできへんことになっとるんやな。
  - 例えばな、Aさんが所属する生徒会で、会長・副会長・書記のポストを、うっかり同じクラスの仲良しグループだけで固めてしもたら、他のクラスの生徒から「あそこだけで決めとる」って不満が出てまうかもしれへんやろ。せやから生徒会の規約では、会長・副会長・書記は必ず違うクラスから選ぶことになっとるんやって。そんで、新しく生徒会が発足したばっかりの時期に、いきなり役員を入れ替えたりせんように、あらかじめ「発足から一定期間は新しい選挙をせえへん」いうルールも決めとったんやで。この条文の国際委員会も、それとよう似とってな、トップの役職を分散させて、拙速な決定を避けるための工夫がされとるんやで。
  - 3か月っちゅう猶予期間を置くんは、遠くに住んどるメンバーにもちゃんと考える時間を与えるためやろな。急いで決めた話ほど、後になってからガタガタ揉めることが多いもんやで。
