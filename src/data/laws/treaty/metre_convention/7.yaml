article: 7
title: 第7条
titleOsaka: ''
originalText:
  - The persons composing the bureau shall be a director, two assistants, and the necessary number of employés. When the comparisons of the new prototypes shall have been finished, and when these prototypes shall have been distributed among the different states, the number of persons composing the bureau shall be reduced so far as may be deemed expedient.
  - The governments of the high contracting parties will be informed by the international committee of the appointment of the persons composing this bureau.
osakaText: []
commentary:
  - この条文は、国際度量衡局を構成する人員体制について定めたもので、局長1名、次長2名、および必要な数の職員を置くこと、そして新しい原器の比較作業が完了し各国への配布が済んだ段階では、事情に応じて人員を縮小できることを規定しています。
  - 条約締結直後の国際度量衡局は、白金イリジウム合金製の新しい国際原器を製作し、各国の既存標準と比較検定するという大規模な立ち上げ業務を抱えていました。この作業が最も忙しかったのは1880年代後半、1889年の第1回国際度量衡総会に向けて各国への原器配布を準備していた時期です。この条文が「比較が終わり、原器が配布された後は人員を縮小してよい」とあらかじめ定めていたのは、立ち上げ期の一時的な繁忙と、その後の定常的な維持業務とでは必要な人員規模が異なることを見越した、合理的な制度設計だったといえます。
  - 例えば、局の設立当初は各国から預かった多数の標準器を一つひとつ精密に比較する作業のために多くの職員が必要でしたが、原器配布が一段落した1890年代以降は、定期的な保守・比較業務が中心となり、実際に局の規模は当初の想定より抑えられた運営がなされました。
  - また、この条文は局の人員任命について、締約国政府への通知を国際度量衡委員会が行うことも定めています。これは第3条で定められた委員会による局の指揮・監督という統治構造を、人事の面から具体化したものであり、局長や次長の具体的な選任手続きについては、さらに第17条で詳しく定められています。
