article: suppl-5
title: 附則第5条
titleOsaka: ''
originalText:
  - The cost of manufacturing the metrical standards prepared by the French section shall be reimbursed by the governments interested, according to the cost-price per unit which shall be fixed by the said section.
osakaText:
  - フランス人部会が用意するメートル法の標準器を作る費用はな、その部会が決めた単価にもとづいて、関係する国の政府が支払って精算することになっとるんやで。
commentary:
  - この条文は、附則第4条で定められたフランス人部会が製作するメートル法の標準器について、その製作費用を、フランス人部会自身が定める単価にもとづいて、標準器の交付を受ける関係国政府が精算(実費弁償)することを定めています。
  - 規則第20条・第21条で定められた分担金は、局の運営費や国際原器そのものの製作費用を締約国全体で分かち合う仕組みですが、この条文が対象とするのは、各国がそれぞれ個別に必要とする国家標準器の製作費用であり、性質の異なる費用として区別されています。国際原器は一つしか存在しない共有の基準であるのに対し、国家標準器は各国がそれぞれ自国用に必要とする複製であるため、その製作費用は、恩恵を受ける当該国が個別に負担するのが合理的とされたのです。
  - 例えば、ある国が自国用の国家標準器の製作をフランス人部会に依頼した場合、その国は、フランス人部会が算定した単価にもとづいて製作費用を支払うことになります。単価をフランス人部会自身が決定する権限を持つとされているのは、実際に製作を担う専門部隊が、材料費や加工の手間を最もよく把握している立場にあるためです。
  - この条文は、附則第4条で定めたフランス人部会の実務的な役割を財政面から補完するものであり、条約体制への移行期における原器・標準器製作という大規模プロジェクトが、共通経費(規則第20条・第21条)と個別実費(この条文)とを組み合わせた、きめ細かい財政設計のもとで進められていたことを示しています。
commentaryOsaka:
  - みんなで使うもんの費用はみんなで割り勘、自分専用に作ってもらうもんの費用は自分で払う。これって、当たり前やけど大事な区別やんな。
  - この条文はな、フランス人部会が作る国家用の標準器について、その製作費用をどう精算するかを決めとるんや。費用は、フランス人部会自身が決めた単価にもとづいて、その標準器を受け取る関係国の政府が支払うことになっとるんやで。国際原器そのものはみんなで共有する基準やから分担金でまかなうけど、各国が自分の国のために欲しい複製は、その国が個別に費用を持つ、いう区別がされとるんやな。
  - 例えばな、Aさんが所属する陶芸サークルで、サークル共用の大きな窯を新調するときはメンバー全員で会費から出し合うたんやけど、Aさんが個人的に欲しい特注の茶碗を作ってもらうときは、Aさん自身が材料費と手間賃を職人さんに直接払うことにしとったんやって。みんなで使うもんと、自分だけが欲しいもんとで、お金の出どころをちゃんと分けとったんやな。この条文の標準器製作費用も、それとよう似とってな、共有の原器は分担金、個別の国家標準器は当該国の実費負担、いうふうに、きっちり線引きされとるんやで。
  - こういう費用の区別を条文にきっちり書いとくことで、後になって「なんでうちの国だけ追加で払わなあかんねん」いうトラブルを防げる、実務的な工夫やと思うわ。
