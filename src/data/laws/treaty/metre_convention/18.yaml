article: 18
title: 第18条（付属規則）
titleOsaka: ''
originalText:
  - The director of the bureau shall have access to the place of deposit of the international prototypes of the meter and the kilogram only in pursuance of a resolution of the committee and in the presence of two of its members.
  - The place of deposit of the prototypes shall be opened only by means of three keys, one of which shall be in possession of the director of the archives of France, the second in that of the chairman of the committee, and the third in that of the director of the bureau.
  - The standards of the class of national prototypes alone shall be used for the ordinary comparing work of the bureau.
osakaText:
  - 局長であってもな、メートルとキログラムの国際原器が保管されとる場所に立ち入れるんは、委員会の決議があって、なおかつ委員のうち二人が立ち会っとるときだけなんやで。原器の保管場所を開けるには、3本の鍵が必要でな、1本はフランスの古文書局長が、もう1本は委員会の議長が、残りの1本は局長自身が、それぞれ持っとることになっとるんや。そんで、局が日常的におこなう比較作業には、国家原器の等級にあたる標準器だけを使うことになっとるんやねん。
commentary:
  - この条文は、国際原器の保管場所へのアクセスに関する、条約中でも最も厳格な管理手続きを定めたものです。局長であっても、委員会の決議と委員2名の立会いがなければ保管場所に立ち入ることはできず、保管場所は3本の鍵によってのみ開けることができ、それぞれの鍵はフランス古文書局長、委員会議長、そして局長という3者がそれぞれ別々に保管することとされています。さらに、局の日常的な比較作業には国際原器そのものではなく、国家原器と同種の標準器のみが用いられることも定められています。
  - この三者・三鍵という仕組みは、いかなる一個人も単独では国際原器に近づけないようにするための、当時としては極めて厳重なセキュリティ設計でした。フランス古文書局長という、条約の運営には直接関与しないフランスの公的機関の長を鍵の保管者の一人に加えている点も注目に値します。これは国際原器の管理をフランス一国の裁量にも、国際度量衡局という運営組織の裁量にも、それぞれ単独では委ねないようにする、二重三重の抑制と均衡の工夫だったといえます。
  - 例えば、局の科学者が国際キログラム原器を実際に取り出して比較作業を行う必要が生じた場合、まず委員会で決議を得たうえで、フランス古文書局長・委員会議長・局長という3者がそれぞれの鍵を持ち寄り、さらに委員2名の立会いのもとでなければ、保管室を開けることすらできませんでした。日常的な標準器の比較検定作業は、この国際原器ではなく、国家原器に相当する標準器を使って行うこととされており、至高の基準である国際原器そのものの摩耗や損傷を最小限に抑える工夫がなされています。
  - この厳格なアクセス制限は、第8条で定められた「国際原器へのアクセスは委員会のみに許される」という原則を、鍵の管理という具体的なレベルにまで落とし込んだ規定であり、1889年の第1回国際度量衡総会で各国に国家原器の複製が配布された後も、大元となる唯一無二の国際原器がこうした厳重な管理のもとで守られ続けたことを示しています。
commentaryOsaka:
  - めっちゃ大事なもんをしまっとく金庫ってな、実は管理してる本人一人だけでは開けられんようになっとることがあるんやで。知ってた?
  - この条文はな、いちばん大事なメートル原器とキログラム原器を、どうやって守るかについての決まりやねん。局のトップである局長であっても、原器の保管場所に一人で入ることはできへんのやで。委員会がちゃんと決議して、しかも委員のうち二人が立ち会わへんかったら、扉すら開けられへんのや。しかも鍵は3本に分かれとって、フランスの古文書を管理する局長、委員会の議長、そして局長、いう三者がそれぞれ別々に持っとるんやで。誰か一人が鍵を全部持っとったら意味あらへんから、こうやって分散させとるんやな。そんで、日常のこまごました比較作業には、国際原器そのものやのうて、国家原器の等級の標準器を使うことになっとるんや。いちばん大事な原器を、無駄に出し入れせんで済むようにしとるんやで。
  - 例えばな、かずおさんが住んどる地域の神社に、お祭りで使う立派な神輿がしまってある蔵があってな、そこは宮司さん一人の判断では開けられへんことになってるんやって。祭りの実行委員会で開けよういう決定があって、しかも委員が二人立ち会わなあかんし、鍵も宮司さんと実行委員長と、地元の資料館の人がそれぞれ別に持っとってん。だからふだん神輿を見せる機会があるときは、写真とか模型を使うようにしてて、本物にはめったに触れへんようにしとるんやで。この条文のメートル原器の管理も、まさにこの神輿蔵とおんなじ発想でな、いちばん大事なもんはめったに触らんと、複数の人の目と鍵で守っとるんや。
  - 局長いう一番偉い立場の人でも、一人だけの判断で大事なもんに触れられへんようにしとる。この誰か一人に権限を集中させへんいう考え方は、たった一人のミスとか身勝手な判断で、世界中が頼りにしてる基準がダメになってしまわんように、ちゃんと守る仕組みになっとるんやで。
