article: kisoku-22
title: 規則第22条
titleOsaka: ''
originalText:
  - These regulations shall have the same force and value as the convention to which they are annexed.
osakaText:
  - この規則はな、それが付属しとる条約と、同じ効力と価値を持つことになっとるんやで。
commentary:
  - この条文は、規則第1条から第21条までのこの付属規則全体が、条約本文と同等の法的効力を持つことを定めた、規則全体の締めくくりとなる条文です。
  - 条約とその付属規則という二つの文書に分かれてはいるものの、この条文によって両者の法的な重みに差はないことが明確にされています。条約本文が国家間の基本的な約束事を定める一方、付属規則はその実施のための具体的な組織運営や手続きを定めるという役割分担がありますが、規則側が条約本文よりも軽い、単なる細則にすぎないという解釈がされないよう、あらかじめ釘を刺しているのがこの条文です。
  - 例えば、規則第8条で定める国際委員会の構成や、規則第18条で定める国際原器への三鍵によるアクセス制限といった規定は、条約本文には直接書かれていませんが、この条文により、条約本文の規定と全く同じ拘束力を持つものとして扱われます。締約国が規則の定めに違反した場合も、条約本文への違反と同様に扱われることになります。
  - この条文があることで、条約本文14条・付属規則22条という合計36条にわたる規定群全体が、単一の法的文書として一体的に機能することになり、条約の運用にあたって「これは規則だから拘束力が弱い」といった解釈の余地を残さない、条文構成上の重要な役割を果たしています。
commentaryOsaka:
  - 「本編」と「付録」に分かれとるからいうて、付録のほうを軽く見てもええ、いうわけやないやんな。
  - この条文はな、これまでの規則第1条から第21条までの内容全部が、条約の本文と全く同じ効力と価値を持つことを、はっきり宣言しとるんやで。条約本文とは別の文書として付属されとる規則やけど、法律としての重みは全く変わらへんいうことを、この最後の一条で念押ししとるんや。
  - 例えばな、Aさんが所属する学校の校則で、「校則本編」とは別に「細則」いう文書があって、制服の着こなし方や部活動の細かいルールが書かれとったとするやろ。生徒の中には「細則やから、本編の校則ほど厳密に守らんでもええんちゃう?」って思う人もおったんやけど、実は学校側は「細則も校則の一部として、同じように守ってもらいます」って、はっきり生徒手帳に明記しとったんやって。この条文の規則も、それとよう似とってな、「付属規則」いう名前やからいうて軽く扱ってええわけやのうて、条約本文と全く同じ重みを持つルールなんやで、いうことをはっきりさせとるんや。
  - 条約全体の締めくくりとして、この一条が置かれとることで、本文14条と規則22条を合わせた36条すべてが、一つの揺るぎないルールとして機能するようになっとるんやで。
