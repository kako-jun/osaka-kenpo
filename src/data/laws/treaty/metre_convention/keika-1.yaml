article: keika-1
title: 経過規定第1条
titleOsaka: ''
originalText:
  - All states which were represented at the international meter commission which met at Paris, in 1872, whether they are contracting parties to the present convention or not, shall receive the prototypes that they may have ordered, which shall be delivered to them in the condition guaranteed by the said international commission.
osakaText:
  - 1872年にパリで開かれた国際メートル委員会に代表を送っとった国はな、この条約の締約国であってもなくても、注文しとった原器を受け取れることになっとるんやで。その原器は、その国際委員会が保証しとった状態のまま、ちゃんと届けられることになっとるんやねん。
commentary:
  - この条文は、経過規定の最初の条文として、1872年にパリで開催された国際メートル委員会に代表を送っていた国は、たとえこの条約の締約国でなくても、当時注文していた原器を、その国際委員会が保証した品質のまま受け取ることができることを定めています。
  - メートル条約は1875年に成立しましたが、その基盤となる新原器の製作プロジェクトは、1872年の国際メートル委員会という、条約に先立つ準備段階から進められていました。この条文は、条約成立前から進んでいた原器製作プロジェクトへの参加国の既得権を、条約発効後も引き継いで保護するためのものです。
  - 例えば、1872年の委員会には参加していたものの、その後1875年の条約への署名を見送った国があったとしても、この条文により、その国はすでに注文していた原器を受け取る権利を失うことはありませんでした。条約という新しい法的枠組みが発効したことで、それ以前の準備段階での約束が反故にされることのないよう、既得権を明確に保護している点が、この条文の趣旨です。
  - この規定は、経過規定第3条・第4条で定められる、1872年委員会やそのフランス人部会が担っていた原器製作の実務作業が、新設された国際委員会に引き継がれていく一連の経過措置の出発点となるものであり、条約体制への移行が、それ以前の科学的な取り組みを無駄にしない形で設計されていたことを示しています。
commentaryOsaka:
  - 新しいルールができたからいうて、それより前からあった約束が、いきなりチャラになってしもたら困るやろ。
  - この条文はな、1875年のこの条約ができる前、1872年にパリで開かれとった国際メートル委員会に参加しとった国について定めとるんや。その国が、この条約に正式に加わっとってもおらんでも、当時注文しとった原器はちゃんと受け取れることになっとる。しかも、その原器は当時の委員会が保証しとった状態のまま届けられることになっとるんやで。
  - 例えばな、Aさんが所属する合唱団が、以前の準備委員会で新しい制服を全員分注文しとったんやって。その後、団の運営組織が正式な規約を持つ新しい体制に変わったんやけど、「注文しとった制服はちゃんと届けます」いう約束は、体制が変わってもそのまま引き継がれたんやで。もし体制が変わったからいうて注文が無効になってしもたら、それまでの準備が全部無駄になってまうやろ。この条文の原器も、それとよう似とってな、条約という新しい体制ができても、それ以前の注文はちゃんと守られる仕組みになっとるんやで。
  - 新しい枠組みへの移行期に、こういう「以前の約束はちゃんと引き継ぎます」いう経過措置を用意しとくんは、混乱を防ぐためのとても実務的な工夫やねんな。
