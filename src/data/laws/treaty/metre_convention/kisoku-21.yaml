article: kisoku-21
title: 規則第21条
titleOsaka: ''
originalText:
  - The expense of constructing the international prototypes, and the standards and test copies which are to accompany them, shall be defrayed by the high contracting parties in accordance with the scale fixed in the foregoing article.
  - The amounts to be paid for the comparison and verification of standards required by states not represented at this convention shall be regulated by the committee in conformity with the rates fixed in virtue of article 15 of the regulations.
osakaText:
  - 国際原器や、それに付随する標準器・試験用の複製を作るのにかかる費用はな、前の条文で決めた分担割合にしたがって、締約国が負担することになっとるんやで。
  - この条約に加わってへん国から標準器の比較や検定を頼まれたときに払ってもらう金額はな、規則第15条にもとづいて決められた料金にしたがって、委員会が定めることになっとるんやねん。
commentary:
  - この条文は、国際原器と、それに付随する各種標準器・試験用複製を製作する費用は、規則第20条で定められた分担金の計算式にしたがって締約国が負担すること、また、条約に加盟していない国から標準器の比較・検定の依頼があった場合の料金は、規則第15条にもとづいて委員会が定める料率に準じて設定することを定めています。
  - この条文は、締約国内部での費用負担(前段)と、条約外の国からの依頼業務における料金設定(後段)という、二つの異なる場面を一つの条文で規律しています。締約国は規則第20条の分担金方式によって原器製作費用を分かち合う一方、条約に加盟していない国は、その枠組みの外にいるため、個別に料金を支払って検定サービスを受けるという、扱いの違いが明確にされています。
  - 例えば、ある国がまだ条約に加盟していない段階で、自国の標準器を国際原器と比較検定してもらいたいと考えた場合、その国は分担金を納めていないため、規則第20条の恩恵は受けられませんが、この条文にもとづき、規則第15条で定められた特別業務の料率に準じた対価を個別に支払うことで、検定サービスを受けることができました。
  - この仕組みは、条約に加盟していない国であっても国際度量衡局の科学的サービスを有償で利用できる道を残しており、将来的にその国が条約に正式加盟する際の実務的な接点にもなっていたと考えられます。実際、日本を含む多くの国が、原条約の署名から遅れて条約に加盟しており、こうした個別の技術的な関わりが、後の正式加盟への足がかりとなった可能性があります。
commentaryOsaka:
  - まだ正式なメンバーやない人にも、有料でサービスを提供する窓口を残しとくいうのは、後々仲間になってもらうきっかけにもなるかもしれへんな。
  - この条文はな、国際原器やそれに付随する標準器・複製を作る費用は、前の条文で決めた分担金の計算方法にしたがって締約国が負担することを決めとるんや。そんで、条約にまだ加わってへん国から標準器の比較や検定を頼まれたときの料金は、規則第15条で決められとる料率をもとに、委員会が定めることになっとるんやで。
  - 例えばな、Aさんが所属するテニスクラブが、会員だけやのうて、まだ入会してへん人にも、レッスンを有料で受けられるようにしとったんやって。会員は月会費の中でレッスンを受けられるけど、非会員の人は一回ごとに料金を払うことで参加できる仕組みやったんや。そうすることで、興味を持ってくれた人に実際にクラブの雰囲気を体験してもらって、いずれ正式に入会してもらうきっかけにもなっとったんやで。この条文の国際度量衡局も、それとよう似とってな、締約国は分担金でまかなうけど、条約外の国にも有料で検定サービスを開いとくことで、実務的なつながりを持てるようにしとるんやで。
  - お金の流れを「内輪の分担」と「外部への有償サービス」にきっちり分けとるところが、この条文の実務的なうまさやと思うわ。
