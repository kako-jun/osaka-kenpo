article: 5
title: 第5条
titleOsaka: ''
originalText:
  - The organization of the bureau, as well as the formation and the powers of the international committee, and of the general conference for weights and measures, are established by the regulations subjoined to this convention.
osakaText:
  - 局の組織のあり方、それに国際度量衡委員会と総会がどう構成されて、どんな権限を持つんかについては、この条約に付属する規則で定めることになっとるねん。
commentary:
  - この条文は、国際度量衡局の組織のあり方や、国際度量衡委員会(CIPM)および国際度量衡総会(CGPM)の構成・権限について、条約本文ではなく条約に付属する規則(règlement annexé)で定めることを規定したものです。
  - 条約という国家間の正式な合意文書は、本来であれば頻繁に改正することが難しい性質を持っています。しかし、国際機関の実務的な組織運営に関する細部は、時代の変化や運営上の必要に応じて柔軟に見直せるようにしておく必要があります。そこでメートル条約では、根幹となる原則は条約本文に、具体的な組織運営のルールは付属規則に、という形で書き分ける立法技術が採用されました。これは19世紀の国際条約としては先進的な工夫でした。
  - 例えば、委員会の委員定数を何名にするか、総会の開催頻度をどう定めるかといった事項は、条約本体を各国が改めて批准し直さなくても、規則の改正という比較的簡便な手続きで対応できるようになっています。これにより、国際度量衡局は150年近くにわたって存続しながら、時代に応じて柔軟に組織を調整することができました。
  - 第3条で示された総会・委員会・局の三層構造、第4条で定められた総会議長の選出方法は、いずれもこの第5条が指し示す付属規則によって、より詳細な運用ルールへと落とし込まれる関係にあります。
commentaryOsaka:
  - ルールって、全部を一つの分厚い冊子に詰め込んだらええいうもんでもないんやで。頻繁に変わりそうな細かい話は、後から直しやすい別紙にしといた方が、実は都合がええ場合があるんや。第5条は、そういう「本体と付け足しの使い分け」を宣言しとる条文やねん。
  - 例えばな、タクミが仲間内でボードゲームサークルを立ち上げたとするやろ。サークルの目的や活動方針みたいな根っこの部分は「規約」いう一枚の紙にまとめて、めったに書き換えへんようにしとくねん。でも、対戦のこまごまとしたルールとか、大会の点数計算のやり方みたいな細かい話は、別に「競技細則」いう紙を用意して、そっちは必要になったらちょこちょこ直せるようにしとるんや。第5条が言うとるんもこれと同じ理屈でな、局の組織や、委員会・総会の構成・権限いう細かい制度設計は、条約の本文やのうて、後ろに付いとる「規則」いう別紙の方で定めることにしとるんやで。
  - 条約の本文を直すには締約国全部の合意がいるさかい、そう簡単には変えられへんのやけど、付属の規則やったら、もうちょっと柔軟に見直しがきくようになっとるんや。第1条から第4条までで「何を作るんか」「誰が仕切るんか」いう大枠を決めて、第5条でその大枠の下にある細部の置き場所を指定する、いう役割分担になっとるんやな。硬い部分と柔らかい部分を分けて設計しとる、なかなか賢いやり方やと思わへん?
