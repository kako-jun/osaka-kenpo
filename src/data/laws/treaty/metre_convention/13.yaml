article: 13
title: 第13条
titleOsaka: ''
originalText:
  - At the expiration of twelve years this convention may be abrogated by any one of the high contracting parties, so far as it is concerned.
  - Any government which may avail itself of the right of terminating this convention, so far as it is concerned, shall be required to give notice of its intentions one year in advance, and by so doing shall renounce all rights of joint ownership in the international prototypes and in the bureau.
osakaText: []
commentary:
  - この条文は、条約発効から12年が経過した後は、締約国のいずれか一国であっても、自国について条約を廃棄できることを定めたものです。ただし廃棄を望む政府は、その意思を1年前に予告しなければならず、また廃棄することによって国際原器および国際度量衡局に対する共有権のすべてを放棄することになるとも規定されています。
  - 条約は第14条により1876年1月1日に発効しているため、この第13条に定める12年の期間が満了するのは1888年ということになります。もっとも、実際にこの離脱条項を行使してメートル条約から脱退した国はほとんど知られておらず、むしろ条約はその後も加盟国を増やし続け、現在に至るまで存続しています。この条文は、いわば「いつでも抜けられる」という安心材料を各国に与えることで、逆説的に多くの国が安心して条約に参加し続ける動機付けとなったとも考えられます。
  - 例えば、ある国が条約発効から15年後に、財政上の理由や政治的な事情から条約から離脱したいと考えた場合、1年前に予告さえすれば離脱は認められますが、その代わりにパリの国際度量衡局や国際原器に対して有していた共有者としての権利はすべて失われます。単なる脱退ではなく、これまで積み立ててきた分担金によって築かれた共有財産への関与も同時に手放すことになる、重い決断だったのです。
  - このように離脱に一定の対価を伴わせる設計は、第9条から第11条で定められた分担金による共同出資の仕組みと表裏一体になっており、条約への参加が単なる約束ではなく、実質的な共有財産への投資であったことを裏付けています。
