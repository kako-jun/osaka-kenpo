article: 11
title: 第11条
titleOsaka: ''
originalText:
  - Those governments which may take advantage of the privilege, open to every state, of acceding to this convention, shall be required to pay a contribution, the amount of which shall be fixed by the committee on the basis established in article 9, and which shall be devoted to the improvement of the scientific apparatus of the bureau.
osakaText: []
commentary:
  - この条文は、メートル条約に新たに加盟する国が支払うべき分担金について定めたものです。条約はすべての国に開かれた加入の権利を認めており、新規加盟国は第9条で定められた人口比例の基準をもとに委員会が算定する分担金を納付する必要があり、その資金は局の科学設備の充実にあてられることとされています。
  - この条文が重要なのは、メートル条約が最初から17カ国だけの閉じた条約として設計されたのではなく、将来的な加盟国の拡大を制度上あらかじめ想定していた点です。実際に条約はその後も加盟国を増やし続け、日本は1885年に加盟しました。新規加盟国からの分担金を「局の科学設備の充実」という目的に明確に限定している点も特徴的で、既存の運営費(第9条の分担金)とは区別された、いわば追加投資としての性格を持たせています。
  - 例えば、日本が1885年に加盟した際には、既存の締約国と同じ人口比例の基準にもとづいて分担金の額が算定されました。この分担金は単に既存の運営費の穴埋めに使われるのではなく、原則として国際度量衡局の測定機器や実験設備をより高度なものへ更新するための資金として活用されることが想定されていました。新規加盟国の参加が、既存の枠組みを維持するだけでなく、局全体の科学的能力を底上げする方向に働く仕組みになっていたのです。
  - このように加盟国が段階的に増えていく制度設計は、1890年に日本へ国家原器(第6条参照)が届いたこととも地続きになっており、条約への参加が単なる形式ではなく、実質的な基準器の共有を伴うものであったことを示しています。
