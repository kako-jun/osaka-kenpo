article: 16
title: 第16条（付属規則）
titleOsaka: ''
originalText:
  - All communications from the international committee to the governments of the high contracting parties shall take place through the diplomatic representatives of such countries at Paris.
  - For all matters requiring the attention of the French authorities, the committees shall have recourse to the ministry of foreign affairs of France.
osakaText: []
commentary:
  - この条文は、国際度量衡委員会から締約国政府への連絡は、すべてパリに駐在する各国の外交代表者を通じて行われること、また、フランス当局の対応が必要な事項については、委員会がフランス外務省に働きかけることを定めたものです。
  - 国際度量衡局とその委員会はパリ近郊に置かれた国際的な学術機関でしたが、外交上の正式な連絡ルートとしては、各国が独自に個別の担当窓口を設けるのではなく、既存の外交チャンネル、すなわちパリ駐在の大使館や公使館を経由するという、当時の国際関係の慣行に沿った実務的な仕組みが採用されています。
  - 例えば、委員会が新しい原器の配布計画についてある締約国政府に正式に通知する必要が生じた場合、委員会が直接その国の内政機関に連絡するのではなく、パリに駐在するその国の外交代表(大使や公使)を通じて連絡が行われました。同様に、委員会がフランス国内で建物の使用許可や税制上の取り扱いなど、フランス政府の権限に属する事項について調整が必要な場合には、フランス外務省を窓口として交渉が行われることになっていました。
  - この条文が定める外交ルート経由の連絡方式は、第10条で定められた分担金の納付がフランス外務省を経由して行われる仕組みとも共通しており、条約全体を通じてフランス外務省が国際度量衡局と各国政府とを結ぶ結節点としての役割を担っていたことがうかがえます。
