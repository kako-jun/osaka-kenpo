article: kisoku-11
title: 規則第11条
titleOsaka: ''
originalText:
  - Until the new prototypes shall have been finished and distributed, the committee shall meet at least once a year. After that time its meetings shall be held at least biennially.
osakaText:
  - 新しい原器が完成して各国に配られるまでの間はな、委員会は少なくとも年に一回は集まらなあかんことになっとるんやで。それが終わったら、少なくとも2年に一回は集まることになるんやねん。
commentary:
  - この条文は、国際委員会の開催頻度について、新原器の製作・配布が完了するまでは少なくとも年一回、完了後は少なくとも二年に一回とすることを定めています。
  - 新原器の製作・比較検定という作業は、多くの国から寄せられる原器候補を精密に比較し、最終的にどれを国際原器・国家原器として採用するかを決定する、条約発効直後の最重要かつ集中的な作業でした。この時期には、規則第6条で定められた予算面でも大きな人員体制(局長・次長二名・助手四名)が組まれており、委員会自体も頻繁に集まって進捗を確認し、判断を下す必要がありました。
  - 例えば、原器の製作が佳境を迎えている時期に、委員会が数年に一度しか集まらなければ、比較検定の結果に問題が見つかっても迅速に対応できず、プロジェクト全体が停滞しかねません。年一回という頻度は、こうした集中的な作業段階に対応するための最低限の会合頻度として定められています。一方、原器の配布が完了した後は、日常的な運営や定期的な比較検定が中心となるため、二年に一回程度の頻度でも十分に機能を維持できると想定されていました。
  - この開催頻度の切り替えは、規則第6条の予算規模の切り替え(第一期・第二期)とちょうど対応しており、局の体制・予算・委員会の開催頻度のすべてが、新原器の製作・配布という一つの節目を基準に、段階的に縮小していく設計になっていることがわかります。
commentaryOsaka:
  - 立ち上げたばかりのプロジェクトは頻繁に打ち合わせが要るけど、軌道に乗ってきたら、そんなに毎回集まらんでもよくなってくるもんやろ。
  - この条文はな、国際委員会がどれくらいの頻度で集まらなあかんかを決めとるんや。新しい原器が完成して各国に配られるまでの、いちばん忙しい時期は、少なくとも年に一回は集まらなあかんことになっとる。そんで、原器の配布が終わって落ち着いてきたら、少なくとも2年に一回でええことになるんやで。
  - 例えばな、Aさんが立ち上げた地域のお祭り実行委員会が、初年度は準備することがぎょうさんあるから、毎月集まって細かい打ち合わせを重ねとったんやって。会場の手配、出店の調整、警備の計画と、決めなあかんことが山積みやったからやな。でも、お祭りが無事に開催されて、二年目、三年目と運営が軌道に乗ってきたら、集まる頻度を数か月に一回くらいに減らして、必要なときだけ臨時で集まるようにしたんやで。この条文の国際委員会も、それとよう似とってな、忙しい立ち上げ期は頻繁に、落ち着いてからは間隔を空けて、状況に応じて集まる頻度を変えとるんやで。
  - 「少なくとも」いう言い方になっとるから、これはあくまで最低限の頻度でな、必要があればもっと頻繁に集まることも、もちろんできたんやで。
