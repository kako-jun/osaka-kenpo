article: 6
title: Article 6
titleOsaka: 第6条
originalText:
  - That the raising or keeping a standing army within the kingdom in time of peace, unless it be with consent of Parliament, is against law;
osakaText:
  - 平和なときに、議会の同意もなく、この国の中で常備軍を新しく作ったり維持したりするんは、法律に反することやねん。
commentary:
  - 第6条は、平時において、議会の同意なしに常備軍を招集または維持することを法に反すると定めた条文です。国王が独自の判断で軍隊を保持できてしまえば、その軍事力を背景に議会や国民を威圧し、専制政治を進めることが可能になってしまいます。この条文は、軍事力に対する議会のコントロールを確立する重要な意味を持っています。
  - ジェームズ2世は、1685年に起きたモンマス公の反乱を鎮圧した後も軍の規模を縮小せず、むしろ常備軍を大幅に増強しました。さらに審査法に違反する形で、免除権を用いてカトリック教徒の士官を多数任命し、軍をロンドン近郊に駐屯させ続けたことは、議会や国民の強い不安と反発を招きました。イングランドでは、かねてよりオリバー・クロムウェルによる軍事独裁の記憶から常備軍そのものに対する根強い不信感があり、この条文はそうした歴史的な警戒心を反映したものです。
  - 例えば、政府が国会の議決を経ずに軍隊の規模を自由に拡大できるとしたら、その軍事力を使って議会そのものを威圧することも可能になってしまいます。第6条は、平時の軍事力の保持を議会のコントロール下に置くことで、文民統制の考え方の先駆けとなりました。この原則は、第7条が定める国民の武装権や、第4条が定める財政の議会統制とも密接に関連しています。
commentaryOsaka:
  - 軍隊っちゅうのは国を守るためのもんやけど、それが国王一人の道具になってしもたら、逆に国民を脅かす存在になりかねへんのや。第6条は、平時に議会の同意なく常備軍を持つことを禁止しとるんやで。
  - 例えばな、マンションの管理会社が住民の同意なしに勝手に警備員をぎょうさん雇い入れて、しかもその警備員が管理会社の言うことしか聞かへんかったら、住民のKさんは不安になるやろ。本来は住民を守るはずの警備が、逆に住民を監視する道具になるかもしれへんからな。ジェームズ2世は在位中に常備軍をどんどん増やして、しかもカトリック教徒の将校をぎょうさん任命したんや。Lさんのようなプロテスタントの国民からしたら、これは自分らを弾圧するための軍隊やないかっちゅう恐怖につながったんやで。
  - 軍事力は使い方次第で国民を守るもんにも、国民を脅かすもんにもなるんや。せやからこそ、その力を持つかどうかを国王一人やなくて議会が判断する。これが第6条の考え方やねん。
