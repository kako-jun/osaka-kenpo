article: 11
title: Article 11
titleOsaka: 第11条
originalText:
  - That jurors ought to be duly impanelled and returned, and jurors which pass upon men in trials for high treason ought to be freeholders;
osakaText: []
commentary:
  - 第11条は、陪審員が正当な手続きに従って選任され召喚されるべきこと、そして大逆罪の裁判を担当する陪審員は自由土地保有者でなければならないことを定めた条文です。陪審制度は、国王や権力者の一存ではなく、国民の中から選ばれた陪審員が事実認定を行うことで公正な裁判を担保する仕組みであり、その選任過程が恣意的に操作されてしまえば制度の意味が失われてしまいます。
  - ジェームズ2世の治世下では、国王に忠実な人物を意図的に陪審員に選任する、いわゆる陪審の「お手盛り」が行われていたことが問題視されていました。特に大逆罪のような国王への反逆を裁く重大な裁判では、公正であるべき陪審が国王の意向に沿うように操作されると、無実の人物であっても有罪とされかねません。土地を所有する自由土地保有者に限定したのは、一定の社会的地位と独立性を持つ人物であれば、国王からの圧力に屈しにくいと考えられていたためです。
  - 例えば、政府に都合の良い人物ばかりを裁判員に選べるとしたら、政府に批判的な人物を無実の罪で有罪にすることも容易にできてしまいます。第11条は、陪審員の選任手続きを適正化することで、こうした裁判の恣意的な運用を防ごうとしたものであり、第3条が定める特別裁判所の禁止や、第10条が定める過酷な刑罰の禁止とあわせて、公正な刑事手続き全体を支える条文の一つとなっています。
