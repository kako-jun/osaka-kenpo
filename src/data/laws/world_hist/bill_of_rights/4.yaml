article: 4
title: Article 4
titleOsaka: 第4条
originalText:
  - That levying money for or to the use of the Crown by pretence of prerogative, without grant of Parliament, for longer time, or in other manner than the same is or shall be granted, is illegal;
osakaText:
  - 国王が特権を口実にして、議会の承認もなしに、しかも議会が認めた期間より長かったり認めたやり方と違うやり方で、国王のためにお金を集めることは違法やねん。
commentary:
  - 第4条は、国王大権を口実にして、議会の承認なしに、あるいは議会が認めた期間や方法を超えて、国王のために金銭を徴収することを違法と定めた条文です。課税という国民の財産に直接関わる重大な決定は、必ず国民の代表からなる議会の同意を経なければならないという「議会の同意なき課税なし」の原則を明確にしています。
  - この原則の背景には、ジェームズ2世の父にあたるチャールズ1世の時代にさかのぼる長い対立の歴史があります。チャールズ1世は1630年代に議会を招集せずに「船舶税」という名目で全国から税を徴収し、これに異議を唱えたジョン・ハムデンが裁判で争った「ハムデン事件」は、当時大きな論争を呼びました。ジェームズ2世もまた、関税収入などを議会の承認なく継続的に徴収しようとしたため、国王による財政の私物化に対する議会の警戒感が、この第4条という形で明文化されることになりました。
  - 例えば、政府が国会の議決を経ずに独自の判断で新しい税金を作ったり、期限が切れた税を勝手に延長したりできるとしたら、国民の財産は国王の思うがままになってしまいます。第4条は、財政に関する決定権を国民の代表である議会に集中させることで、後の近代的な予算制度や租税法律主義の礎となった条文といえます。
commentaryOsaka:
  - 税金を払うんは誰でも気が重いもんやけど、せめて「どうやって決まったんか」には納得したいもんやんな。第4条は、議会の承認なしに国王が勝手に税金を取り立てることを禁止しとるんや。
  - 例えばな、まなぶさんの住んどるマンションで、管理組合の総会で決めてへん修繕費を、管理人さんが勝手に「今月から追加で集めます」って言い出したら、住民のひろこさんは納得できひんやろ。誰がどんな根拠で決めたんか分からへん出費なんて、払いとうないのが普通やんな。イングランドでは17世紀に「船舶税」っちゅう税金が問題になったんや。国王チャールズ1世が議会を通さんと沿岸都市に課税しようとして、これに反発したジョン・ハムデンという人が裁判で争ったんやで。この一件が、税金は必ず議会が承認せなあかんっちゅう考え方を強めていったんや。
  - 税金を取る側と使う側を、国民の代表である議会がちゃんとチェックする。これが第4条の核心やねん。決める過程にみんなの代表が関わっとるかどうかで、同じ税金でも納得感は全然ちゃうもんやで。
