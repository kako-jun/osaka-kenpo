article: 9
title: Article 9
titleOsaka: 第9条
originalText:
  - That the freedom of speech and debates or proceedings in Parliament ought not to be impeached or questioned in any court or place out of Parliament;
osakaText:
  - 議会の中での発言の自由や、議論、議事の進め方については、議会の外にあるどんな裁判所や場所であっても、責められたり問いただされたりしたらあかんねん。
commentary:
  - 第9条は、議会内における言論の自由、討論や議事手続きが、議会の外にあるいかなる裁判所や場所においても、非難されたり問題にされたりしてはならないと定めた条文です。議員が議会の中で自由に発言できなければ、国王の意に沿わない政策への批判や監視という議会本来の機能が働かなくなってしまいます。
  - この原則の背景には、チャールズ1世の時代にさかのぼる歴史があります。1629年、下院議員サー・ジョン・エリオットは、議会内での発言や決議への関与を理由に国王によって投獄されました。この処分の違法性は長く議論の対象となり、後に貴族院によって当時の判断が誤りであったと確認されたことで、議会内の発言を理由に議員を処罰してはならないという原則が確立されていきました。第9条はこの先例を法律として明文化し、議会の独立性を制度的に確立したものです。
  - 例えば、議員が国会の質疑で政府の不正を追及したことを理由に、後から裁判所に訴えられて処罰されるようなことがあれば、誰も安心して政府を批判できなくなってしまいます。第9条が定めるこの議会内発言の免責特権は、現代のイギリスをはじめ多くの議会制民主主義国家においても、議員が自由に発言し政府を監視するための基盤となる考え方として受け継がれています。
commentaryOsaka:
  - 議会の中で自由にものを言えへんかったら、誰も本音で議論できひんくなってまうやろ。第9条は、議会内での発言や議事を、議会の外にある裁判所などで責められへんようにする「議会内発言の免責特権」を定めとるんやで。
  - 例えばな、Fさんが会議で会社の方針に堂々と反対意見を言うたら、後日そのことを理由に人事部に呼び出されて処分されたとするやろ。そんなことが続いたら、誰も会議で本音を言えへんくなってまうよな。1629年、サー・ジョン・エリオットという下院議員は、議会で国王の政策を厳しく批判する演説をしたんや。せやのに、その発言を理由に逮捕されてロンドン塔に投獄されて、結局そこで亡くなってしもたんやで。Gさんのような議員仲間からしたら、これは議会で発言すること自体が命がけになってしまう出来事やったんや。
  - 議会っちゅうのは、国のことをあれこれ議論する場所やからこそ、そこでの発言は外の裁判所から守られなあかんのや。第9条は、議員が萎縮せんと本音で議論できる環境を守るための条文やねん。
