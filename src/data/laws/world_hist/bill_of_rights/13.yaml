article: 13
title: Article 13
titleOsaka: 第13条
originalText:
  - And that for redress of all grievances, and for the amending, strengthening and preserving of the laws, Parliaments ought to be held frequently.
osakaText:
  - それと、みんなの不満を解消して、法律をより良うしたり、強めたり、守り続けたりするために、議会は頻繁に開かれなあかんのや。
commentary:
  - 第13条は、あらゆる不満の是正のため、そして法律の改善・強化・維持のために、議会がしばしば開催されるべきであると定めた条文です。国王が議会を招集しなければ、国民の声を代弁する議会の機能そのものが停止してしまうため、この条文は議会が定期的に開かれることを国王の義務として位置づけています。
  - ジェームズ2世とその兄チャールズ2世は、いずれも自分たちに批判的な議会の開催をできるだけ避けようとした国王でした。チャールズ2世は治世末期の1681年から1685年の崩御まで、実に4年近くにわたって一度も議会を招集しませんでした。ジェームズ2世もまた、審査法の廃止に協力的な議会が得られないとみるや、招集した議会をすぐに停会・解散させることを繰り返しました。第13条は、こうした国王による議会軽視への反省から生まれた条文です。
  - 例えば、政府にとって都合の悪い議論をする議会をなるべく開かないようにすれば、国民の意見が政治に反映される機会そのものを奪うことができてしまいます。第13条はそうした事態を防ぐため、議会の定期的な開催を明文化しました。この理念は、権利章典の制定から5年後の1694年に制定された三年議会法によってさらに具体化され、議会は少なくとも3年に一度は招集されなければならないと定められることになります。権利章典の13か条は、国王大権の限界（第1〜4条）、国民の権利（第5〜7条）、議会の独立性（第8〜9条）、公正な裁判（第10〜12条）という順に積み上げられ、最後にこの第13条で議会そのものの継続性を保障するという構成になっています。
commentaryOsaka:
  - どんなにええ法律を作っても、それを見直したり直したりする場が定期的に開かれへんかったら、時代に合わへんもんになってまうやろ。第13条は、議会を頻繁に開くべきやと定めとるんやで。
  - 例えばな、Iさんの町内会が何年も総会を開かへんかったら、住民のJさんが困りごとを相談したくても、相談する場そのものがあらへんくなってまうよな。チャールズ2世は在位の最後の数年間、議会をほとんど開かんと国を治めたんや。次のジェームズ2世も同じように議会を軽視する傾向があったから、国民の不満を解消する場が長いこと失われとったんやで。この反省から、後の1694年には三年ごとに議会を開くことを義務づける三年議会法が作られたんや。
  - 議会は、法律を作るだけやのうて、みんなの不満を聞いて直していく場でもあるんや。第13条は、その場を絶やさんと定期的に開き続けることの大切さを教えてくれとるんやで。
