article: 1
title: Article 1
titleOsaka: 第1条
originalText:
  - That the pretended power of suspending the laws or the execution of laws by regal authority without consent of Parliament is illegal;
osakaText: []
commentary:
  - 第1条は、国王が議会の同意を得ずに法律またはその執行を停止する権限（停止権）を持つと主張することを違法と定めた条文です。ここでいう「停止権」とは、特定の法律の効力そのものを丸ごと止めてしまう国王大権を指します。国王が一存で法律を無効化できてしまえば、議会が制定した法律の意味が失われてしまうため、この条文は法の支配と議会主権の原則を確立する第一歩となりました。
  - この条文が生まれた直接のきっかけは、ジェームズ2世が1687年と1688年の2度にわたって発した「信教自由宣言（Declaration of Indulgence）」でした。ジェームズ2世はカトリック教徒であり、議会の同意を得ないまま停止権を用いて、カトリック教徒や非国教徒を処罰する既存の刑罰法規の適用を一方的に停止し、要職への登用を進めようとしました。これに対する議会や国民の強い反発が、1688年から1689年にかけての名誉革命、そしてジェームズ2世の亡命とウィリアム3世・メアリー2世の即位につながっていきます。
  - 例えば、現代の日本で例えるなら、国会が可決した法律を内閣が「今回は適用しません」と一存で全国的に停止してしまうようなものです。これでは立法府である国会の存在意義が失われてしまいます。第1条は、法律の停止という重大な決定は必ず議会の関与のもとで行わなければならないという原則を明文化した点で、後の権利章典全体を貫く基本理念の出発点となっています。
  - 権利章典は1689年2月13日に「権利宣言」として提示され、ウィリアム3世とメアリー2世がこれを受け入れる形で王位に就いた後、同年12月16日に正式な法律として制定されました。第1条はその冒頭に置かれ、次条の「特定停止権（免除権）」を扱う第2条とあわせて、国王大権の限界を明確にする役割を果たしています。
