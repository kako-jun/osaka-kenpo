article: 3
title: Article 3
titleOsaka: 第3条
originalText:
  - That the commission for erecting the late Court of Commissioners for Ecclesiastical Causes, and all other commissions and courts of like nature, are illegal and pernicious;
osakaText:
  - 宗教に関わる事件を裁くために作られたあの特別な裁判所――高等宗務裁判所を立てるための委任状は、違法で害のあるもんなんや。それと似たような性質を持つ他の委任状や裁判所も、みんな同じように違法で害があるんやで。
commentary:
  - 第3条は、「宗教問題担当委員裁判所」を設置した委任状、およびこれと同種の性質を持つ他のあらゆる委員会・裁判所を違法かつ有害なものと定めた条文です。通常の裁判手続きを経ずに国王の意のままに運用される特別裁判所を否定し、聖職者を含むすべての人が通常の法の手続きのもとで裁かれるべきだという原則を確認しています。
  - この宗教問題担当委員会は、かつて1641年に長期議会によって廃止された悪名高い高等宗務裁判所を、ジェームズ2世が1686年に事実上復活させたものでした。悪名高い裁判官ジョージ・ジェフリーズが主導したこの委員会は、国王の宗教政策に従わない聖職者を処罰する強力な権限を持ち、実際にロンドン主教ヘンリー・コンプトンが、ジェームズ2世の意向に反する説教をした聖職者の処分を拒んだことを理由に、主教としての職務を停止させられています。
  - 例えば、通常の裁判所を通さずに、行政機関が独自に「特別法廷」を作って気に入らない相手を処罰できるとしたら、司法の独立も適正手続きの保障も意味をなさなくなってしまいます。第3条は、そうした国王直属の特別裁判所の存在自体を否定することで、法の支配のもとで裁判は通常の手続きに従って行われるべきだという原則を確立しました。この考え方は、第10条が定める過酷な刑罰の禁止や、第11条が定める陪審制度の適正な運用とも密接に関連しています。
commentaryOsaka:
  - 裁判所っちゅうのは、法律に基づいて公平に判断する場所のはずやねん。せやのに、国王が自分の言うことを聞く裁判所を新しく作って、そこで気に入らん人を裁かせるようになったらどうなるやろか。第3条が問題にしとるのは、まさにそういう仕組みのことやで。
  - 例えばな、Bさんが会社で不満を訴えたいときに、本来は労働基準監督署みたいな公平な第三者機関に相談するもんやんな。せやのに、社長が「会社の言うことしか聞かへん審査係」を社内に新設して、Bさんの訴えをそこだけで処理させるようにしたら、まともな判断が下されると思えへんやろ。1686年、ジェームズ2世は高等宗務裁判所を復活させて、聖職者や大学関係者を国王の意向どおりに処分できる仕組みを作ったんや。Cさんのような聖職者が国王の宗教政策に逆らったら、この裁判所で処罰されることになってもうたんやで。
  - 公平であるべき裁判の仕組みが、権力者の道具になってしもたら、法律そのものが信用できひんくなるんや。第3条は、そういう「身内だけの裁判所」を作ることそのものを禁止したんやで。裁判の独立性を守るための、大事な一歩やったんやな。
