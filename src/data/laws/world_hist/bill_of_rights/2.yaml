article: 2
title: Article 2
titleOsaka: 第2条
originalText:
  - That the pretended power of dispensing with laws or the execution of laws by regal authority, as it hath been assumed and exercised of late, is illegal;
osakaText: []
commentary:
  - 第2条は、国王が議会の同意なしに、特定の人物や場合について法律またはその執行を免除する権限（特定停止権・免除権）を持つと主張し、実際に行使してきたことを違法と定めた条文です。第1条の「停止権」が法律の効力そのものを全面的に止めるものであったのに対し、第2条の「免除権」は特定の個人や事案に限って法律の適用を免除するものであり、両者は似て非なる権限として区別されています。
  - この条文の背景には、1686年の「ゴドゥン対ヘイルズ事件」があります。カトリック教徒であったサー・エドワード・ヘイルズは、公職就任者に国教会への忠誠を誓わせる審査法（Test Act）に違反して軍の将校職に就いていましたが、王座裁判所はジェームズ2世の免除権を認め、ヘイルズの任官を合法と判断しました。この判決を根拠に、ジェームズ2世は多くのカトリック教徒を審査法の適用除外として要職に登用し、議会の強い反発を招きました。
  - 例えば、国会で定めた法律に「ただし特定の知人にはこの法律を適用しない」という抜け道を国王が勝手に作れてしまうようなものです。これでは法律の前の平等が根底から崩れてしまいます。第2条は、こうした個別の適用除外についても議会の同意なしには認められないことを明文化し、第1条とあわせて国王による法律の恣意的な骨抜きを二重に防ぐ役割を果たしています。
