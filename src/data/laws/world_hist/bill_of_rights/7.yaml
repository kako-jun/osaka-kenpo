article: 7
title: Article 7
titleOsaka: 第7条
originalText:
  - That the subjects which are Protestants may have arms for their defence suitable to their conditions and as allowed by law;
osakaText:
  - プロテスタントの国民は、自分の身を守るために、自分の身分にふさわしくて法律で許された範囲での武器やったら、持ってもええんやな。
commentary:
  - 第7条は、プロテスタントである国民が、自らの身分に応じた武器を、法律の許す範囲で自衛のために所持できることを定めた条文です。ここでいう「身分に応じた」とは、当時の身分や財産に基づく所持制限がなお存在していたことを意味しており、無制限の武装権を保障したものではありません。
  - この条文の背景には、ジェームズ2世の治世下で、治安判事らが治安維持を名目にプロテスタント、とりわけ国王に批判的なホイッグ派の人々の家宅を捜索し、武器を没収する一方で、カトリック教徒には軍の士官職を与えるなど優遇していた実態がありました。多数派であるプロテスタント国民が自衛の手段を奪われる一方、少数派のカトリック教徒が武装を認められるという不均衡は、国民に強い危機感を抱かせました。
  - 例えば、政府が特定の宗派や政治的立場の人々からだけ選択的に自衛の手段を取り上げるようなことがあれば、その集団は権力による迫害に対して無防備になってしまいます。第7条は、そうした選別的な武装解除を防ぎ、プロテスタント国民の自衛権を法律の枠内で保障したものです。なお、この条文は後の合衆国憲法修正第2条の思想的な源流の一つとしても知られています。
commentaryOsaka:
  - 自分の身を守る手段がまったくない状態って、想像したら心細いもんやんな。第7条は、プロテスタントの国民が身分に見合った範囲で、法律の許す限り武器を持てることを保障しとるんやで。
  - 例えばな、Eさんの家だけ「物騒やから」言うて防犯グッズを取り上げられて、お隣のFさんの家はそのまま持っといてもええ、なんてことになったらどう思う? 実はジェームズ2世の時代のイングランドで、これに近いことが起きとってん。治安判事らが「治安維持のため」言うて、国王に批判的なプロテスタントの家を家宅捜索して武器を没収する一方で、カトリック教徒には軍の士官の地位まで与えてたんや。多数派のプロテスタントが丸腰にされて、少数派のカトリック教徒だけ武装を許される。この露骨な不公平が、国民の危機感に火をつけたんやで。
  - 権利っちゅうのは、持っとるだけやのうて、いざというときに使える状態にあってこそ意味があるんや。第7条は、自分の身を自分で守る最低限の手段を、法律の枠内で保障した条文やねん。
