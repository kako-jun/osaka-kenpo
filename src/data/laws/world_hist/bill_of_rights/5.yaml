article: 5
title: Article 5
titleOsaka: 第5条
originalText:
  - That it is the right of the subjects to petition the king, and all commitments and prosecutions for such petitioning are illegal;
osakaText:
  - 国民には、国王に請願する権利があるんや。そういう請願をしたことを理由にして誰かを捕まえたり訴えたりするんは、みんな違法やで。
commentary:
  - 第5条は、国民が国王に請願する権利を持つこと、そしてそうした請願を理由に身柄を拘束したり訴追したりすることを違法と定めた条文です。政治権力に対して不満や要望を申し立てる行為そのものが処罰の対象になってしまえば、国民は声を上げることすらできなくなってしまいます。この条文は、表現の自由や言論の自由の先駆けとなる重要な権利を保障しています。
  - この条文が生まれた直接のきっかけは、1688年に起きた「七主教事件」でした。カンタベリー大主教ウィリアム・サンクロフトを含む7人の主教は、ジェームズ2世が発した信教自由宣言を各教会の礼拝で読み上げるよう命じられたことに対し、これを拒否したいと国王に請願書を提出しました。ところがジェームズ2世は、この請願を扇動的名誉毀損とみなして7人を訴追しました。裁判の結果、陪審は7人全員を無罪とし、国民は熱狂的にこれを歓迎しました。この事件は、国王に対する国民の不満を一気に高め、名誉革命への流れを後押しすることになります。
  - 例えば、政府の政策に反対する署名活動や陳情を行った市民が、そのことを理由に逮捕されてしまうような社会を想像してみてください。それでは誰も安心して意見を表明できません。第5条は、こうした請願という平和的な意思表示の手段を、権力による報復から守ることを明文化しており、現代の請願権や表現の自由の思想的な源流の一つとなっています。
commentaryOsaka:
  - 困ったことがあったら、責任者に「なんとかしてください」って伝える。これって当たり前のことに思えるけど、その当たり前を法律で守らなあかんかった時代があったんや。第5条は、国王への請願権と、請願したことを理由に罰せられへん権利を保障しとるんやで。
  - 例えばな、みさきさんが職場の待遇に納得いかんくて、上司に改善を求める手紙を出したとするやろ。それだけで「反抗的や」って理由でクビにされたら、誰も声を上げられへんくなってしまうよな。1688年、イングランド国教会の7人の主教たちが、ジェームズ2世の「信教自由宣言」を教会で読み上げることを拒否して、国王に「これは違法な命令やと思います」っちゅう請願書を出したんや。せやのに国王は激怒して、この7人を扇動的な名誉毀損の罪でロンドン塔に閉じ込めてもうたんやで。裁判にかけられた主教たちやったけど、陪審は無罪の評決を出して、民衆も大喜びしたんや。
  - 声を上げたら罰せられるんやったら、誰も本当のことを言われへんくなるやろ。請願権っちゅうのは、権力に対して「それはおかしいんちゃいますか」と言える最後の手段なんや。第5条は、その手段そのものを守るための条文やねん。
