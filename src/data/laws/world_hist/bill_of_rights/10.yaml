article: 10
title: Article 10
titleOsaka: 第10条
originalText:
  - That excessive bail ought not to be required, nor excessive fines imposed, nor cruel and unusual punishments inflicted;
osakaText:
  - 度を越した保釈金を求めたらあかんし、度を越した罰金を科したらあかんし、残酷で普通やない刑罰を与えたらあかんのやで。
commentary:
  - 第10条は、過大な保釈金を要求してはならないこと、過大な罰金を科してはならないこと、そして残虐で異常な刑罰を科してはならないことを定めた条文です。刑罰や身柄拘束の条件が権力者の裁量で際限なく重くできてしまえば、それ自体が国民を萎縮させ、抑圧する道具になってしまいます。
  - この条文の背景としてよく知られているのが、タイタス・オーツの事件です。オーツは1678年に「教皇派陰謀事件」なる虚偽の告発を行い多くの人々を死に追いやりましたが、後にその証言が偽証であったことが発覚し、1685年に有罪判決を受けました。その際に科された刑罰は、毎年公開のさらし台に立たせたうえで街中を鞭打ちながら引き回し、終身刑に処するという極めて過酷なものであり、当時の人々の間でも刑罰として行き過ぎているという批判がありました。また、1685年のモンマス公の反乱の後、裁判官ジョージ・ジェフリーズが主導した「血の巡回裁判」でも、反乱への関与者に対して過大な罰金や厳しい処罰が科されたことが問題視されました。
  - 例えば、軽微な犯罪であっても見せしめのために極めて重い刑罰を科したり、資力のない被告人が到底払えないような高額の保釈金を要求したりすることは、公正な裁判の実現を妨げてしまいます。第10条は、こうした行き過ぎた処罰や身柄拘束条件に歯止めをかけるものであり、この考え方は後のアメリカ合衆国憲法修正第8条にもほぼそのままの表現で受け継がれ、現代の刑事法における罪刑均衡や残虐な刑罰の禁止という基本原則の源流となっています。
commentaryOsaka:
  - 罰っちゅうのは、罪の重さに見合ったもんでなあかんのや。度を越した保釈金や罰金、残酷すぎる刑罰は、正義とは呼べへんやろ。第10条は、そういう行き過ぎた刑罰を禁止しとるんやで。
  - 例えばな、なおきさんが軽い交通違反で捕まったのに、払いきれへんほど高額な罰金を要求されたら、それはもう罰やのうて嫌がらせに近いもんになるやろ。1685年、タイタス・オーツという人物は、以前に嘘の証言でぎょうさんの人を有罪に追い込んだ罪で裁かれたんやけど、罰金だけやのうて、鞭打ちや晒し台に何度もかけられるという過酷な刑罰を受けたんや。同じ年には、モンマスの反乱に関わった人らを裁く「血の巡回裁判」で、ジェフリーズ判事がやたら重い刑罰を次々と下したことも知られとるんやで。
  - 刑罰が度を越してしもたら、それはもう法による裁きやのうて、権力による報復になってまうんや。第10条は、罰の重さにも節度が必要やっちゅう、当たり前やけどとても大事な原則を定めとるんやで。
