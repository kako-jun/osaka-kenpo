article: 8
title: Article 8
titleOsaka: 第8条
originalText:
  - That election of members of Parliament ought to be free;
osakaText: []
commentary:
  - 第8条は、議会の議員選挙が自由に行われるべきことを定めた条文です。選挙結果に国王や政府が不当に介入し、意のままになる議員ばかりを選ばせるようなことがあれば、議会は国王をチェックする機関としての役割を果たせなくなってしまいます。この条文は、議会の独立性を選挙の段階から確保するための重要な原則です。
  - ジェームズ2世は、審査法や刑罰法規の廃止に賛成する議員だけで構成された、いわば「都合の良い議会」を作り出そうと画策しました。各地の治安判事や地方行政官に対して個別に面会（いわゆる「クローゼッティング」）を行って協力を迫ったり、都市の自治体特許状を書き換えて、国王の意向に従う人物だけが公職や選挙権を得られるように仕組んだりするなど、選挙そのものへの介入を強めていました。
  - 例えば、政府が自分たちに批判的な候補者の立候補を妨害したり、投票できる人を国王に都合の良い人物だけに絞り込んだりできるとしたら、選挙は形だけのものになってしまいます。第8条は、こうした選挙への不当な介入を禁じることで、議会が真に国民の意思を代表する機関であり続けるための土台を築きました。
