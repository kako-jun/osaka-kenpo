article: 12
title: Article 12
titleOsaka: 第12条
originalText:
  - That all grants and promises of fines and forfeitures of particular persons before conviction are illegal and void;
osakaText:
  - まだ有罪と決まってへん段階で、特定の人に対する罰金や没収財産について、先に約束したり与えたりすることは、みんな違法で無効なんやで。
commentary:
  - 第12条は、有罪判決が下される前に、特定の人物に科される予定の罰金や没収財産を、あらかじめ他者に付与したり約束したりすることを違法かつ無効と定めた条文です。まだ有罪と確定していない人物の財産について、国王が勝手に処分を約束してしまうことは、裁判の結果を先取りする行為にほかなりません。
  - 当時、国王が寵臣や協力者に対して、これから裁判にかけられる予定の人物の財産や罰金を、もし有罪になったら与えるという形で事前に約束することがありました。このような約束が交わされてしまうと、約束を受けた側には対象者を有罪に追い込む強い動機が生まれてしまい、裁判官や関係者が公正な判断を下すことが難しくなります。第12条は、こうした裁判前の利益誘導を防ぎ、有罪判決が確定するまでは何人も財産権を侵害されないという、無罪推定の考え方に通じる原則を明文化しています。
  - 例えば、まだ裁判が始まってもいない段階で、被告人になる予定の人物の財産を「有罪になった暁には差し上げます」と第三者に約束してしまえば、その約束を受けた人物は何としても有罪判決を勝ち取ろうとするでしょう。これでは公正な裁判は望めません。第12条は、こうした利害関係が裁判に持ち込まれることを防ぎ、第10条や第11条とあわせて刑事手続き全体の公正さを守る役割を果たしています。
commentaryOsaka:
  - まだ有罪と決まってへん人から、先に罰金や財産を約束させるなんて、順番があべこべやんな。第12条は、そういう有罪確定前の取り決めを無効にしとるんやで。
  - 例えばな、ようこさんが何か疑いをかけられただけの段階で、まだ裁判も始まってへんのに「有罪になったらこの財産は差し出します」っちゅう約束をさせられたら、これはもう疑われた時点で罰を受けとるのと同じことになってまうやろ。当時のイングランドでは、国王が有力者から先に罰金や財産の没収を約束させて、それを理由に相手を従わせるっちゅうやり方が問題になっとったんや。裁判の結果を待たんと、事実上の処罰を先取りしてしまう仕組みやったんやな。
  - 人は有罪と決まるまでは無実として扱われるべきや、っちゅう考え方があるやろ。第12条は、まさにその考え方につながる原則を、財産の扱いという形で先取りして定めとった条文なんやで。
